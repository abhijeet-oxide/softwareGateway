# THE OPERATOR BESIDE THE DATABASE IT RUNS, WATCHING ONLY THAT NAMESPACE.
#
# VALID ONLY WHEN THIS CLUSTER HOSTS ONE ENVIRONMENT. There can only be one
# CloudNativePG per cluster - the CRDs and the admission webhooks it reconciles
# are cluster-scoped singletons - so this is the right shape when lab and
# production are separate clusters, and the wrong one when they share.
#
# What it buys, when it applies: the operator holds a Role rather than a
# ClusterRole, so its blast radius is the namespace it serves and a compromise
# or a bug cannot reach anything else in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace the environment's own layers create. This operator does not
# create it and must not: it would then own the namespace its database lives
# in, and removing the operator would take the database with it.
namespace: swgw
resources:
  # Not the operator's home in this scope - see the file. It holds the Helm
  # release record, which is what makes the scopes mutually exclusive.
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: HelmRelease
      name: cloudnative-pg
    patch: |
      - op: add
        path: /spec/values/config
        value:
          # Only the namespace it is deployed in. The chart renders a Role
          # instead of a ClusterRole for everything except the parts that are
          # irreducibly cluster-scoped - the CRDs and the webhooks.
          clusterWide: false
