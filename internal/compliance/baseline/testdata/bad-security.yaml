# Container security posture, including the two hostPath findings that are the
# same field and very different problems.
---
# Source: bad-security/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: loose, namespace: bad}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loose}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loose}
    spec:
      volumes:
        - name: runtime
          hostPath: {path: /var/run/docker.sock}
      containers:
        - name: loose
          image: registry.acme.example/bad/loose@sha256:1212121212121212121212121212121212121212121212121212121212121212
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            seccompProfile: {type: Unconfined}
            capabilities:
              add: [NET_ADMIN, SYS_ADMIN]
---
# Source: bad-security/templates/tight.yaml
# Correct throughout, and must produce no security findings.
apiVersion: apps/v1
kind: Deployment
metadata: {name: tight, namespace: bad}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: tight}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tight}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
      containers:
        - name: tight
          image: registry.acme.example/bad/tight@sha256:3434343434343434343434343434343434343434343434343434343434343434
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
---
# Source: bad-security/templates/memory-scratch.yaml
# Memory-backed scratch with no ceiling: filling it exhausts the server's
# memory and evicts every other pod on it, not just this one.
apiVersion: apps/v1
kind: Deployment
metadata: {name: unbounded-scratch, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: unbounded-scratch}}
  template:
    metadata: {labels: {app.kubernetes.io/name: unbounded-scratch}}
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cache
          emptyDir:
            medium: Memory
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          volumeMounts:
            - {name: cache, mountPath: /cache}
---
# Source: bad-security/templates/adds-capabilities.yaml
# Permissions added back in three tiers at once: SYS_NICE is ordinary and only
# recorded, NET_RAW is the middle tier the old single rule missed entirely, and
# CAP_WHATEVER is not in the standard at all.
apiVersion: batch/v1
kind: Job
metadata: {name: adds-capabilities, namespace: bad}
spec:
  template:
    metadata: {labels: {app.kubernetes.io/name: adds-capabilities}}
    spec:
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      containers:
        - name: worker
          image: registry.acme.example/bad/worker@sha256:9999000099990000999900009999000099990000999900009999000099990000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: [ALL]
              add: [NET_RAW, SYS_NICE, CAP_WHATEVER]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
---
# Source: bad-security/templates/nowhere-to-write.yaml
# Read-only program files, which is right, and nothing writable mounted - so
# the first temporary file the program creates fails at run time. Reported for
# information: whether it writes anything is a question for whoever knows it.
apiVersion: apps/v1
kind: Deployment
metadata: {name: nowhere-to-write, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: nowhere-to-write}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nowhere-to-write}}
    spec:
      volumes:
        - name: config
          configMap: {name: nowhere-to-write}
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:aaaa0000aaaa0000aaaa0000aaaa0000aaaa0000aaaa0000aaaa0000aaaa0000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/app, readOnly: true}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: nowhere-to-write, namespace: bad}
data:
  log.level: info
