apiVersion: softwaregateway.io/v1alpha1
kind: Product
metadata:
  name: ericsson-ran
  displayName: Ericsson Cloud RAN
  owner: ran-platform
spec:
  sources:
    - name: vendor
      registry: registry.ericsson.example.com:9443
      repository: ericsson/cloud-ran
      anonymous: true
      discovery:
        enabled: true
        interval: 30m
  targets:
    - name: jfrog-lab
      registry: artifactory.internal.example.com:9444
      repository: ericsson-lab/cloud-ran
      type: artifactory
      xrayEnabled: true
      xrayEndpoint: https://artifactory.internal.example.com:9444
      credentialsRef:
        secretName: internal-registry
      default: true
  network:
    tls:
      # Development only: dev/fakeregistry issues its own certificate.
      insecureSkipVerify: true
