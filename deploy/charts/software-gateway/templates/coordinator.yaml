{{- if .Values.layers.application }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swgw.fullname" . }}-coordinator
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  # NOT release-prefixed: deploy/web/nginx.conf, baked into the web image and
  # mounted by docker-compose.yml, proxies to `controller:8080`.
  name: controller
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swgw.fullname" . }}-coordinator
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- include "swgw.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 8 }}
      annotations:
        # THE ONLY CHECKSUMS ON THIS POD, and their absence elsewhere is the
        # design: config.yaml is a subPath mount and needs a restart, while
        # products and credentials are watched and rotate in place.
        checksum/system-config: {{ .Files.Get "files/config/config.yaml" | sha256sum }}
        checksum/settings: {{ toYaml .Values.settings | sha256sum }}
    spec:
      # Kubernetes injects <SERVICE>_PORT=tcp://ip:port for every Service in the
      # namespace. Those names collide with configuration keys and the failure
      # reads as a parse error three services away. Off for every pod here.
      enableServiceLinks: false
      serviceAccountName: {{ include "swgw.fullname" . }}-coordinator
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "swgw.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.coordinator.terminationGracePeriodSeconds }}
      {{- with .Values.coordinator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # HARD: this process migrates the schema at startup. Waiting here keeps
        # the pod in Init saying so, and the application container's restart
        # count at zero, where it still means something.
        {{- include "swgw.waitForTCP" (dict "ctx" . "name" "database" "host" (include "swgw.dbHost" .) "port" .Values.database.port) | nindent 8 }}
      containers:
        - name: coordinator
          image: {{ include "swgw.image" (dict "ctx" . "name" "coordinator") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["--config=/etc/softwaregateway/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "swgw.commonEnv" . | nindent 12 }}
            # The driver as well as the DSN: it defaults to sqlite, so a DSN on
            # its own gives a Coordinator that opens a local file and loses it
            # with the pod.
            - name: SWGW_DATABASE_DRIVER
              value: postgres
            {{- include "swgw.dbEnv" . | nindent 12 }}
            - name: SWGW_AUTH_ENABLED
              value: {{ .Values.identity.enabled | quote }}
            {{- if .Values.identity.enabled }}
            # The issuer is the PUBLIC url, because that is what lands in the
            # token's `iss`. DiscoveryURL is where this process fetches keys: a
            # browser reaches ZITADEL by its external name and a pod reaches it
            # by Service name, and both must be expressible.
            - name: SWGW_AUTH_ISSUER
              value: {{ include "swgw.identityUrl" . | quote }}
            - name: SWGW_AUTH_DISCOVERYURL
              value: http://zitadel:8080
            - name: SWGW_AUTH_HOSTHEADER
              value: {{ include "swgw.identityHostHeader" . | quote }}
            {{- end }}
            - name: SWGW_AUTH_CERBOSADDR
              value: http://cerbos:3592
            - name: SWGW_AUTH_TENANT
              value: {{ .Values.tenant | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            {{- with .Values.coordinatorExtraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # LIVENESS IS PROCESS-LOCAL. A liveness probe that reached the
          # database would restart every Coordinator during a brief Postgres
          # blip - a fleet-wide crash loop at the moment the process most needs
          # to stay alive and retry.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          # READINESS decides traffic, and means: the database answers, its
          # schema is the one this build expects, and products loaded. With
          # maxUnavailable 0 this is what stalls a bad rollout.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
          securityContext:
            {{- include "swgw.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "swgw.configVolumeMounts" . | nindent 12 }}
            # Compliance bundles are staged here, and the root filesystem is
            # read-only.
            - name: tmp
              mountPath: /tmp
{{- if eq .Values.secrets.backend "azureKeyVault" }}
            # The CSI driver produces a Secret only while a pod mounts its
            # SecretProviderClass, so the workload that needs every credential
            # is the one that mounts them. See templates/secrets.yaml.
            - name: azure-secrets
              mountPath: /mnt/azure-secrets
              readOnly: true
{{- end }}
      volumes:
        {{- include "swgw.configVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
{{- if eq .Values.secrets.backend "azureKeyVault" }}
        - name: azure-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "swgw.fullname" . }}-secrets
{{- end }}
{{- if .Values.coordinator.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "swgw.fullname" . }}-coordinator
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  minAvailable: {{ .Values.coordinator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 6 }}
{{- end }}
{{- end }}
