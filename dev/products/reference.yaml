# THE REFERENCE PRODUCT.
#
# One document that exercises every field the schema has, annotated with why
# each one exists. Copy it, delete what you do not need — most real products
# are a fifth of this length, because almost everything here has a default.
#
# It is also the fixture `task validate` runs, so it cannot drift from the
# validator: a field that stops being accepted breaks CI here first.
#
# The shape to hold in your head:
#
#   sources   vendor-side, READ-ONLY, polled by discovery.
#             One source = ONE REGISTRY + one or more repositories on it.
#   targets   yours, READ-WRITE. One target = ONE FIXED REPOSITORY.
#             Everything replicated to a target lands under that one path.

apiVersion: softwaregateway.io/v1alpha1
kind: Product

metadata:
  # The resource ID: lowercase alphanumeric and hyphens, <=63 chars. Immutable —
  # it appears in API paths, metric labels and every audit record.
  name: reference
  displayName: "Reference Product"
  description: "Every configurable field, annotated. Copy and cut down."
  owner: platform-infra@example.com
  labels:
    tier: critical
    vendor: example
  # Turns the whole product off without deleting it. Defaults to true.
  #
  # Deleting a document to pause a product loses the thing you most want back:
  # the exact registries, filters and rules that were working. A disabled
  # product still loads and still VALIDATES, so a mistake in it surfaces now
  # rather than on the day someone re-enables it.
  enabled: true

spec:
  # =====================================================================
  # NETWORK — TLS trust, proxy and timeouts for everything in this product.
  #
  # Inherited by every source and target; each may override it.
  # =====================================================================
  network:
    # A PEM bundle projected by VSO at <configDir>/secrets/internal-ca/ca.crt.
    # APPENDED to the system roots, never replacing them — a product that adds
    # a private CA still needs to reach public registries and Sigstore.
    caBundleRef:
      secretName: internal-ca
      key: ca.crt

    # OMITTING THIS BLOCK DOES NOT MEAN "NO PROXY". It means "whatever the
    # environment says": with nothing configured here, HTTPS_PROXY / NO_PROXY
    # from the process environment apply, the same way curl, docker and kubectl
    # treat them. That is usually what you want — in a proxied network it is
    # often the only route out — but it is worth knowing, because a corporate
    # proxy inherited this way is invisible in configuration and shows up only
    # as a transfer running at a fraction of the available bandwidth.
    #
    # `proxy.direct: true` (see the `plugins` source below) is how you say NO
    # proxy and mean it, including the environment's. Either way, each process
    # logs the effective setting once per registry at startup — grep for
    # `registry transport`.
    proxy:
      httpsProxy: http://proxy.example.com:3128
      noProxy: [".svc.cluster.local", "internal.example.com"]

    # Per request, not per transfer. A blob has no total deadline: a 40 GB blob
    # is not slow, it is large. idleStall is what catches a dead connection —
    # bytes stopped arriving, which is a real failure at any size.
    timeouts:
      connect: 10s
      responseHeader: 30s
      idleStall: 60s

    # tls.insecureSkipVerify exists and is deliberately not set here.
    #
    # It disables the chain, the expiry AND the hostname check. Supplying a
    # caBundleRef is the right fix for an untrusted chain. In particular it does
    # NOT fix "x509: negative serial number" — that failure happens while
    # PARSING the certificate, before any verification runs, so skipping
    # verification changes nothing. Measured, not assumed; the fix is
    # tls.allowNegativeSerialNumbers in system configuration.

  # =====================================================================
  # SOURCES
  # =====================================================================
  sources:
    # -----------------------------------------------------------------
    # 1. The common case: one registry, one repository, credentials from a
    #    Secret, polled every 15 minutes.
    # -----------------------------------------------------------------
    - name: primary
      registry: registry.vendor.example.com
      repository: platform/suite
      # `generic` — plain OCI Distribution v2 — is right for every registry we
      # have met, including vendors with elaborate publishing conventions.
      # acr | artifactory | quay exist only for genuine protocol deviations.
      type: generic
      credentialsRef:
        secretName: vendor-registry
        # Defaults to the `username` and `password` keys; override if VSO
        # projects the Secret with different ones.
        usernameKey: username
        passwordKey: password

      discovery:
        enabled: true
        interval: 15m
        tagFilters:
          # RE2 (Go regexp): linear time, no backtracking. Stated explicitly
          # because a user-supplied pattern evaluated inside a polling loop
          # would, under a backtracking engine, be a denial-of-service vector.
          #
          # No include patterns admits everything. Exclude always wins.
          include: ['^v\d+\.\d+\.\d+$']
          exclude: ['-(rc|beta|alpha)\.']

      # ONE number: requests in flight against this registry, which is ALSO the
      # connection pool, because those are the same thing — point more
      # goroutines at a pool of 32 and you get 32 in-flight requests and a
      # queue. Absent inherits the application-level `concurrency.perRegistry`
      # (32), and absent is the usual case. This one is spelled out because the
      # vendor asked us to stay under 50 rps.
      #
      # requestsPerSecond is a politeness ceiling ON TOP, for a vendor that
      # limits by rate rather than connection count. Burst is derived (2×), not
      # configurable — it was a third number whose only sensible value is a
      # small multiple of the rate.
      concurrency:
        perRegistry: 32
        requestsPerSecond: 50

    # -----------------------------------------------------------------
    # 2. SEVERAL REPOSITORIES, named explicitly — a product that ships as one
    #    repository per component.
    #
    #    One source, not four: they share a registry host, one credential and
    #    one rate-limit budget. Four sources would duplicate all three and let
    #    the budgets multiply against a vendor that only ever sees one client.
    # -----------------------------------------------------------------
    - name: components
      registry: registry.vendor.example.com
      repositories:
        - suite/core
        - suite/database
        - suite/frontend
        - suite/agent
      credentialsRef:
        secretName: vendor-registry
      discovery:
        enabled: true
        interval: 15m
        tagFilters:
          include: ['^v\d+\.\d+\.\d+$']
      concurrency:
        perRegistry: 16
        requestsPerSecond: 50

    # -----------------------------------------------------------------
    # 3. NO REPOSITORIES NAMED — the interesting case.
    #
    #    Naming none means "every repository on this registry", found from the
    #    catalog on every scan. This is what you want when you cannot know the
    #    set in advance: each new plugin ships as a NEW repository, and listing
    #    them by hand means a plugin is silently not replicated until somebody
    #    remembers to edit this file.
    #
    #    There is deliberately no `repositoryDiscovery.enabled` switch. Naming
    #    nothing IS the statement, so configuration cannot say one thing and
    #    mean another.
    # -----------------------------------------------------------------
    - name: plugins
      registry: partner.example.com
      credentialsRef:
        secretName: partner-registry
      discovery:
        enabled: true
        interval: 30m
        # Both filters live here because discovery is what they govern: a scan
        # finds REPOSITORIES, then TAGS, and each step gets a filter.
        # repositoryFilters is what keeps the scope to ours on a registry
        # shared with other teams.
        repositoryFilters:
          include: ['^example/plugins/']
          exclude: ['-test$', '-scratch$']
        tagFilters:
          include: ['^v\d+\.\d+\.\d+$']
        # Bounds what ONE scan will adopt when enumerating. A catalog that
        # suddenly returns thousands of repositories is far likelier to be a
        # misconfiguration than a real change, and adopting them all would
        # point thousands of scanners at one registry. Defaults to 200.
        maxRepositories: 100

      # Per-source network settings override the product's where set.
      #
      # `direct: true` bypasses the product-level proxy entirely. "Everything
      # through the corporate proxy except this one registry" is the normal
      # shape, and repeating the host in noProxy at every level is easy to get
      # subtly wrong when it has a port or an alias.
      network:
        proxy:
          direct: true

      # Signing trust for THIS vendor. Two vendors do not share a signing
      # identity. The scalars (policy, atSource, …) inherit from the product;
      # `cosign` REPLACES wholesale — a trust configuration assembled field by
      # field from two documents is one nobody can audit.
      #
      # Executes in M5; validated now so it is correct when it arrives.
      verification:
        enabled: true
        atSource: true
        policy: warn          # still onboarding their signing
        cosign:
          mode: key
          key:
            publicKeyRef:
              secretName: partner-signing-key
              key: cosign.pub

    # -----------------------------------------------------------------
    # 4. A VENDOR WITH ITS OWN SIGNATURE LAYOUT, and anonymous access.
    #
    #    `vendor` is NOT the source's `type`. `type` says how to SPEAK to the
    #    registry, and for every vendor we have met that is plain Distribution
    #    v2 — including Nokia's NEAR, whose protocol is entirely standard. What
    #    differs is the PUBLISHING CONVENTION, which is this. Two axes, two
    #    fields.
    #
    #    `vendor: near` is the single switch for everything NEAR-specific:
    #
    #      * The three tags NEAR publishes per release — orb_X,
    #        signature_orb_X and the signed_orb_X index over both — become ONE
    #        package, with the index as the transfer root so the signature
    #        travels with the payload. Transferring orb_X alone would leave the
    #        signature behind and make destination-side verification impossible
    #        forever.
    #      * Listings drop the noise NEAR puts on every name: `orbs/` off the
    #        repository, `orb_` off the tag. Cosmetic only — the real names are
    #        stored, transferred and returned by -o json, and BOTH spellings
    #        resolve as input, so anything you can see you can paste back.
    #
    #    OMIT IT for a conformant registry, which is most of them. Without it
    #    this source would be read as ordinary — and, just as importantly, a
    #    source that is not NEAR gets none of NEAR's rewriting. That is the
    #    reason the field exists: the shortening used to be applied everywhere,
    #    guessed from what a page of results looked like.
    #
    #    `signatures` has TWO independent axes, because they genuinely vary
    #    independently — a vendor may pair the referrers API with PKCS#7, or a
    #    wrapper index with a Sigstore bundle:
    #
    #      vendor   WHERE the signature is:  (unset) | near
    #      format   HOW it is checked:       auto | cosign | pkcs7
    #
    #    `signatures.layout` is the older spelling of `vendor` and still works;
    #    setting both to DIFFERENT values is a validation error.
    # -----------------------------------------------------------------
    - name: near
      registry: near.vendor.example.com
      repositories:
        - orbs/cfx-5000-k8s
        - orbs/cfx-5000-db
      vendor: near
      # Anonymous access — some vendors publish openly. Mutually exclusive
      # with credentialsRef; one of the two is required.
      anonymous: true
      discovery:
        enabled: true
        interval: 30m
      signatures:
        format: pkcs7
        # CA roots for PKCS#7 (a public key or Fulcio root for cosign). A
        # reference, never inline: every credential and key is managed by VSO
        # and read from a projected Secret. Read by M5.
        trustBundleRef:
          secretName: vendor-signing-ca
          key: ca.crt

    # -----------------------------------------------------------------
    # 5. A FAILOVER MIRROR — reachable, but not polled.
    #
    #    Note the two different switches, and the difference between them:
    #
    #      enabled: false            the source does not exist for any purpose
    #      discovery.enabled: false  it can still be transferred FROM on
    #                                request, but is not polled
    #
    #    Discovery is off here because both registries serve the same content,
    #    and polling both would double-discover every tag.
    # -----------------------------------------------------------------
    - name: mirror
      registry: registry-eu.vendor.example.com
      repository: platform/suite
      credentialsRef:
        secretName: vendor-registry
      discovery:
        enabled: false
      concurrency:
        perRegistry: 16

  # =====================================================================
  # TARGETS
  #
  # A target is a PLACE: one registry, one fixed repository. Everything
  # replicated to it lands under that path, whatever repository it came from —
  # what follows is the registry's own addressing, tags and digests.
  #
  # One fixed path rather than a mapping derived from the source's, because lab
  # is one repository and production is another, and a deployment points at one
  # of them. Deriving the destination would mean your path changed whenever a
  # vendor reorganised theirs.
  #
  # WORTH KNOWING: with several source repositories feeding one target, BLOBS
  # never collide — they are content-addressed. TAGS can. Two repositories both
  # publishing `v1.2.3` become one tag at the target, and the later push wins.
  # If your vendor's tags are not globally unique, use one target per source
  # repository.
  # =====================================================================
  targets:
    - name: lab
      registry: internal.example.com
      # A PREFIX, not the destination. The vendor's own repository structure is
      # reproduced beneath it, so an ORB's images and charts keep their names:
      # `vendor/platform/orbs/CFX-5000-k8s/nginx`. Omit it entirely to mirror
      # the vendor's paths at this registry's root.
      repository: vendor/platform
      type: generic
      credentialsRef:
        secretName: internal-registry
      # Which stage this target is. Several targets may share one — `lab-eu`
      # and `lab-us` are both the lab stage — and `transfers promote` resolves
      # against it, refusing to guess when more than one matches.
      environment: lab
      # Used when a transfer request names no target. At most one per product.
      default: true
      # A registry we own, so we can be less polite than with a vendor.
      concurrency:
        perRegistry: 64
        requestsPerSecond: 200

    - name: production
      # Same REGISTRY as lab, different repository — so a lab→production
      # promotion can use cross-repository mount and move almost no bytes.
      registry: internal.example.com
      repository: vendor/platform-prod
      type: generic
      credentialsRef:
        secretName: internal-registry
      environment: production
      # Rejects direct replication: production is reachable only by promotion
      # from another target. Mutually exclusive with `default`.
      promotionOnly: true
      concurrency:
        perRegistry: 32
      # Destination-side verification can differ from the source's — this is
      # the check that runs after the push, against what actually landed.
      #
      # An override block must be SELF-CONTAINED: `policy` and the whole
      # `cosign` block are spelled out even though the product already says the
      # same thing. Validation checks each block on its own, because a trust
      # configuration you have to merge two documents in your head to read is
      # one nobody can audit.
      verification:
        enabled: true
        policy: enforce
        atDestination: true
        cosign:
          mode: keyless
          keyless:
            certificateIdentity: 'https://github.com/vendor/platform/.github/workflows/release.yaml@refs/heads/main'
            certificateOidcIssuer: 'https://token.actions.githubusercontent.com'

    # -----------------------------------------------------------------
    # 4. A QUAY TARGET THAT PULLS FOR ITSELF.
    #
    #    `replication` says HOW content gets in, as opposed to what goes
    #    there. Absent — every target above — means `copy`: our workers pull
    #    from the origin and push here. That is unchanged and is still right
    #    for almost everything.
    #
    #    `mirror` hands the job to Quay. We write the configuration, Quay
    #    pulls from the upstream on its own schedule, and the convergence
    #    keeps working while this tool is down. What you give up is byte-level
    #    progress: Quay reports a state, not a speed, so a mirror transfer
    #    shows `configuring -> syncing -> succeeded` and NO percentage.
    #    Nothing synthesises one.
    #
    #    Two credentials, and they are not the same credential:
    #
    #      credentialsRef   /v2      artifacts       a robot account
    #      quay.apiTokenRef /api/v1  configuration   an OAuth 2 bearer token
    #
    #    A copy-mode Quay target needs none of this.
    # -----------------------------------------------------------------
    - name: ocp-prod
      registry: quay.apps.ocp.example.com
      # The first path segment is the Quay ORGANIZATION, and it is load-bearing:
      # the mirror robot has to belong to it, and validation checks that.
      repository: platform-prod/vendor-platform
      type: quay
      credentialsRef:
        secretName: quay-robot
      environment: ocp
      quay:
        # repo:admin scope for mirroring (org:admin for a proxy cache). The
        # robot above authenticates /v2 and is REJECTED by /api/v1 — the most
        # common way to get a 403 that looks like a permissions problem.
        apiTokenRef:
          secretName: quay-api
          key: token
      replication:
        mode: mirror
        mirror:
          # WHERE QUAY PULLS FROM. Naming another target keeps the chain
          # lab -> ocp-prod declared once, so it stays right when the lab
          # path changes. `externalReference: host/path` is the escape hatch
          # for an upstream this product does not otherwise declare.
          from: lab

          # WHAT TO SYNC — and the single most expensive field in this file.
          #
          # These are SHELL GLOBS. Every other pattern in this document is
          # RE2. `^v\d+\.\d+\.\d+$` is correct three sections above and
          # matches EXACTLY NOTHING here: the sync would succeed, the
          # destination would stay empty, and the configuration would look
          # perfect. Validation rejects RE2 syntax in this field for that
          # reason.
          #
          # Note the second glob. Cosign signatures are tags of the form
          # `sha256-<hex>.sig`, so a rule of just `v3.*` mirrors the images
          # and leaves every signature behind — after which destination-side
          # verification fails for every package, forever, with no visible
          # cause. If you verify at the destination, mirror the signatures.
          tags: ['v3.*', 'sha256-*.sig']

          # WHEN. `interval` is Quay's sync_interval; `startAt` its
          # sync_start_date, defaulting to the moment we first apply.
          interval: 6h

          # WHO PUSHES. Quay allows only a robot to write into a mirrored
          # repository, and it must be in this repository's organization.
          robot: platform-prod+swgw-mirror

          # WHAT QUAY USES TO REACH THE UPSTREAM. Written INTO Quay, so these
          # credentials leave our custody — by reference, as everywhere else.
          sourceCredentialsRef:
            secretName: internal-registry

          # HOW QUAY REACHES IT. Quay's egress, not ours: none of this affects
          # our own transport, and the product-level `network` block above
          # does not affect Quay's.
          network:
            verifyTLS: true
            proxy:
              httpsProxy: http://proxy.example.com:3128
              noProxy: ['internal.example.com', '.svc.cluster.local']

          acceptUnsignedImages: false
          skopeoTimeout: 300s      # Quay's default; its maximum is 43200s

          # WHAT WE DO ABOUT IT. `apply` means "write it when asked" —
          # `transferctl targets apply`. A config reload NEVER writes to Quay:
          # applying a mirror flips the repository read-only and deletes
          # whatever the glob does not match, which is not something a
          # `kubectl apply` should be able to do. `detect` never writes at all
          # and only reports drift.
          manage: apply
          # A download against this target becomes sync-now plus a wait,
          # rather than an error saying there is nothing to push.
          syncOnRequest: true

    # -----------------------------------------------------------------
    # 5. A PROXY CACHE — a Quay organization fronting an upstream.
    #
    #    Nothing is stored until somebody pulls through it, which is the
    #    point: no schedule, no capacity planning, and content that expires.
    #    It is NOT a replication destination and cannot be one — there is no
    #    way to push into a cache. Validation rejects it as a rule target, as
    #    the default target, and as a promotion destination, all at load,
    #    because the alternative is failing on the day a rule first matches.
    #
    #    `transferctl warm` is how you populate one deliberately: it pulls a
    #    package through the proxy path and discards the bytes.
    # -----------------------------------------------------------------
    - name: ocp-dev-cache
      registry: quay.apps.ocp.example.com
      # <proxy-org>/<upstream-path>. The path IS the cache layout, so
      # `proxy.organization` must agree with its first segment.
      repository: dev-cache/vendor/platform
      type: quay
      anonymous: true
      quay:
        apiTokenRef:
          secretName: quay-api
          key: token
      replication:
        mode: proxy
        proxy:
          organization: dev-cache
          upstreamRegistry: internal.example.com
          upstreamCredentialsRef:
            secretName: internal-registry
          expiration: 24h        # Quay's default; the staleness window
          insecure: false
          manage: apply
          # Pull every blob of a discovered package through the proxy so the
          # cache is warm before anyone needs it. Off by default: it costs a
          # full pull whose bytes are thrown away.
          prewarm: false

    - name: legacy-dr
      registry: dr.example.com
      repository: vendor/platform
      anonymous: true
      # Being decommissioned. `enabled: false` stops it receiving transfers
      # without throwing away the configuration or its history.
      #
      # Validation REJECTS an autoDownload rule pointing at a disabled target,
      # because that would otherwise fail the first time a package matched.
      enabled: false

  # =====================================================================
  # PROMOTION — the hop `transferctl transfers promote` takes by default.
  #
  # Declared rather than hard-coded, because the names of a site's stages are
  # the site's. Omit the block entirely and it defaults to lab -> production;
  # it only has to be written when those words are wrong.
  #
  # Each environment may name SEVERAL targets — `lab-eu` and `lab-us` are both
  # the lab stage. When one does, `promote` refuses to guess and names the
  # candidates, so an unintended push to a production registry is not one
  # keystroke away.
  # =====================================================================
  promotion:
    from: lab
    to: production

  # =====================================================================
  # DOWNLOAD — WHAT happens when software is brought in.
  #
  # A download takes named software and puts it through a set of targets. It
  # carries NO tag pattern and no repository filter, because by the time one
  # runs the software has already been chosen — by a person typing
  # `transferctl download v3.2.1`, or by an auto-download rule that matched.
  # A pattern asked at that point could only disagree with the choice.
  #
  # This is a LIST for future-proofing. One entry is the default by being the
  # only one, and nothing has to say so. Declare several — a different
  # destination set for a different class of release — and exactly one must
  # carry `default: true`, which validation enforces.
  # =====================================================================
  download:
    - name: internal
      # A SET, not a sequence. The order comes from the targets themselves:
      # `ocp-prod` declares `replication.mirror.from: lab`, so this runs
      # lab first and then has Quay pull from it — one hop over the vendor
      # link instead of two. `transferctl downloads list` prints the chain
      # it derived, which is the only way to check that reading was right.
      targets: [lab, ocp-prod]

      # Whether verification GATES the chain. It selects between behaviours
      # the verification block below already configures; keys and identities
      # are NOT restated here, because a trust configuration assembled from
      # three places is one nobody can audit.
      verify:
        before: true          # source-side, before any bytes move
        after: true           # destination-side, after they land
        # Under `enforce` a target that fails verification stops every target
        # that mirrors from it — which is the whole security value of a chain.
        policy: enforce

      priority: 100           # 0-1000; defaults to 50
      # Meaningless with one download, required once there are two.
      default: true

  # =====================================================================
  # AUTO-DOWNLOAD — WHEN a download happens without being asked.
  #
  # A rule does not download anything itself. It matches a tag and TRIGGERS
  # the download above — the same operation a person performs by hand, with
  # the same targets and the same gates. That equivalence is the point: there
  # is no automatic path that can do something the manual path cannot.
  # =====================================================================
  autoDownload:
    # The master switch over automatic firing ONLY. Downloads by hand are
    # unaffected — a switch that also disabled the manual path is one nobody
    # dares touch during an incident.
    enabled: true
    rules:
      # Evaluated in order, FIRST MATCH WINS — not all-match, because two
      # rules matching one tag with different downloads has no sensible
      # reading.
      - name: ga-releases
        # RE2, like every other pattern in this document except a Quay mirror
        # glob. This is the ONLY place a pattern belongs.
        tagPattern: '^v\d+\.\d+\.\d+$'
        # `download` omitted: triggers the default, which is the only one.
        # Naming it explicitly is how a second download would be reached.

      - name: release-candidates
        tagPattern: '^v\d+\.\d+\.\d+-rc\.\d+$'
        # Narrows which sources the rule watches; absent means all of them.
        # It is how one product carries a vendor's GA channel and its
        # early-access channel without two rules differing only by a pattern
        # nobody can read.
        sources: [primary]

      - name: near-orbs
        tagPattern: '^orb_\d+\.\d+\.\d+$'
        # Turned off without being deleted. Configuration, in Git, and the
        # only way to stop a rule — there is deliberately no runtime override,
        # because a second source of truth for "is this on" is exactly what
        # GitOps exists to prevent.
        enabled: false

  # =====================================================================
  # VERIFICATION — product-wide defaults, overridable per source and target.
  #
  # Executes in M5. Configuration written now stays valid, and discovery
  # already reports WHETHER a package is signed, which it cannot do without
  # knowing where to look.
  # =====================================================================
  verification:
    enabled: true
    # enforce — a failure blocks or fails the transfer.
    # warn    — record it, notify, and proceed. Right while onboarding a vendor
    #           whose signing setup is not yet understood.
    policy: enforce
    atSource: true
    atDestination: true
    # Defaults to true, and should stay true: without it the destination holds
    # unsigned copies and the chain of custody ends at our boundary.
    transferSignatures: true
    cosign:
      mode: keyless
      keyless:
        # BOTH constraints are REQUIRED, and validation rejects the document
        # without them. Keyless verification with no identity constraint
        # accepts any valid Sigstore signature from anyone: it proves someone
        # signed the artifact, not that the vendor did. That is syntactically
        # valid, semantically useless, and would look perfectly secure in
        # production — which is why it is an error and not a warning.
        certificateIdentity: 'https://github.com/vendor/platform/.github/workflows/release.yaml@refs/heads/main'
        certificateOidcIssuer: 'https://token.actions.githubusercontent.com'

  # =====================================================================
  # NOTIFICATIONS
  # =====================================================================
  notifications:
    enabled: true
    channels:
      - name: platform-email
        type: email
        email:
          recipients:
            - platform-infra@example.com

      - name: platform-teams
        type: teams
        teams:
          # Must be a Power Automate WORKFLOW URL. Legacy O365 connector
          # webhooks (outlook.office.com/webhook/...) are retired and no longer
          # work in current tenants.
          webhookUrlRef:
            secretName: teams-webhook
            key: url

    subscriptions:
      # The closed set of events: PackageDiscovered, TransferCompleted,
      # PromotionCompleted, TransferFailed, VerificationFailed, DiscoveryFailed.
      # An unknown name is rejected — a subscription to an event that will
      # never fire is silence you would mistake for calm.
      - events: [PackageDiscovered]
        channels: [platform-email]
      - events: [TransferFailed, VerificationFailed, DiscoveryFailed]
        channels: [platform-email, platform-teams]

  # =====================================================================
  # RETENTION — how long history is kept, per record kind.
  # =====================================================================
  retention:
    transfers: 2160h        # 90 days
    auditEvents: 8760h      # 1 year
