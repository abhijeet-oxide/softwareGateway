# Configuration and secrets: what the release puts where anybody can read it.
---
# Source: bad-config/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: leaky, namespace: bad}
data:
  log.level: info
  # A credential in a ConfigMap is readable by anybody who can read the
  # namespace, which is a far wider set than can read a Secret.
  database.password: hunter2
  api_key: sk-live-8f3a9c2e1b4d
  # None of these four has a key the old name-driven detector matched, and all
  # four are unmistakable credentials. They are what it missed.
  CONNECTION_STRING: postgresql://svcuser:hunter2@db.acme.example:5432/appdb
  CLOUD_ACCESS_KEY: AKIAIOSFODNN7EXAMPLE
  SESSION_JWT: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXk
  INITIAL_LOGIN: changeme
  # A reference is not a credential, and must not be reported as one.
  database.passwordSecretRef: leaky-db
  oidc.authorizationUrl: https://sso.acme.example/authorize
---
# Source: bad-config/templates/configmap-ok.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: clean, namespace: bad}
immutable: true
data:
  log.level: debug
---
# Source: bad-config/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: leaky, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: leaky}}
  template:
    metadata: {labels: {app.kubernetes.io/name: leaky}}
    spec:
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          # Container args are world-readable through the API and appear in ps.
          # The second one is the shape a prefix-blind pattern misses: the flag
          # is not called "password", it is called "db-password".
          args: ["--listen=:8080", "--password=hunter2", "--db-password=S3cr3t-Value",
                 "--password-file=/etc/app/db.pass"]
          env:
            - name: LOG_LEVEL
              value: info
            # A signed token is credential material by its shape, whatever the
            # variable is called, so CFG-13 reads it rather than inferring it.
            - name: API_TOKEN
              value: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhcHAifQ.0hK4a2Ck1H3xJ7Uu8bWc2mQFPkzq1sPz8t7d2c9uV0A
            # Named for a credential, opaque, and not the name of anything this
            # release ships. Nobody outside this workload can say whether it is
            # a password or a lookup key, which is CFG-16's whole point.
            - name: DB_PASSWORD
              value: S3cr3t-P@ssw0rd-Value
            - name: TLS_KEY
              value: |
                -----BEGIN PRIVATE KEY-----
                notarealkey
                -----END PRIVATE KEY-----
          envFrom:
            # The container gets every key in the Secret, including the ones
            # added next release for a different component.
            - secretRef: {name: everything}
---
# Source: bad-config/templates/secret.yaml
# A Secret shipped with material already in it. Everything in a chart is in
# version control and in every mirror of the release, so this has to be treated
# as exposed from the moment it was committed.
apiVersion: v1
kind: Secret
metadata: {name: shipped-credentials, namespace: bad}
type: Opaque
data:
  # base64 of "S3cr3t-P@ssw0rd-Value" - visible after a single decode, which is
  # why the detector decodes before it looks.
  password: UzNjcjN0LVBAc3N3MHJkLVZhbHVl
  # base64 of "changeme"
  admin-initial: Y2hhbmdlbWU=
---
# Source: bad-config/templates/shipped-stringdata.yaml
# The same exposure written under stringData rather than data. The finding used
# to name `data` whatever the Secret used, so on this one the path resolved to
# nothing and the evidence window showed apiVersion, kind and metadata - none of
# which the finding is about.
apiVersion: v1
kind: Secret
metadata: {name: shipped-signing-key, namespace: bad}
type: Opaque
stringData:
  service.hostname: db.acme.example
  signing.key: |
    -----BEGIN PRIVATE KEY-----
    notarealkeyeither
    -----END PRIVATE KEY-----
---
# Source: bad-config/templates/db-connection-properties.yaml
# A configuration template shipped as one Secret value, with its credential
# fields deliberately EMPTY - the values arrive at install time. Nothing is
# exposed. A check that fires on the presence of data rates this Critical, which
# tells a team to fix something that is already correct.
apiVersion: v1
kind: Secret
metadata: {name: db-connection-properties, namespace: bad}
type: Opaque
stringData:
  db.properties: |
    dataSource.url = jdbc:postgresql://db.acme.example:5432/appdb
    dataSource.user = svcusr
    dataSource.password =
  conf-db.properties: |
    dataSource.user = svcusr
    dataSource.password =
---
# Source: bad-config/templates/service-endpoints.yaml
# Values that are shipped and are not credentials: a hostname and a username.
# Recorded by CFG-15, never reported by CFG-14.
apiVersion: v1
kind: Secret
metadata: {name: service-endpoints, namespace: bad}
type: Opaque
stringData:
  upstream.host: db.acme.example
  upstream.user: svcusr
---
# Source: bad-config/templates/secret-empty.yaml
# An empty shell, filled in by the platform's secret store at install time.
# It must NOT be reported: shipping the object is the correct pattern, and only
# shipping the material is the defect.
apiVersion: v1
kind: Secret
metadata: {name: filled-at-install, namespace: bad}
type: Opaque
stringData:
  password: ""
---
# Source: bad-config/templates/configmap-parameters.yaml
# Every key here NAMES a credential and none of them holds one. All six were
# reported as leaked credentials by the name-driven detector this replaced, and
# not one of them may fire now.
apiVersion: v1
kind: ConfigMap
metadata: {name: credential-parameters, namespace: bad}
immutable: true
data:
  SECRET_FETCH_RETRYCOUNT: "5"
  SECRET_REFRESH_INTERVAL_SEC: "300"
  TOKEN_CACHE_TTL_SECONDS: "900"
  PASSWORD_MIN_LENGTH: "12"
  KEYSTORE_PATH: /etc/tls/keystore.jks
  CREDENTIAL_PROVIDER_CLASS: com.example.vault.Provider
---
# Source: bad-config/templates/deployment-platform-ca.yaml
# Mounts kube-root-ca.crt, which Kubernetes creates in every namespace itself.
# No chart ships it and no chart could, so CFG-11 must be silent here - it used
# to report every such mount as a workload that would never start.
apiVersion: apps/v1
kind: Deployment
metadata: {name: uses-platform-ca, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: uses-platform-ca}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: uses-platform-ca}
      annotations:
        checksum/config: "d0f1e2a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f"
    spec:
      volumes:
        - name: platform-ca
          configMap: {name: kube-root-ca.crt}
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:8888000088880000888800008888000088880000888800008888000088880000
          volumeMounts:
            - {name: platform-ca, mountPath: /etc/ssl/platform, readOnly: true}
