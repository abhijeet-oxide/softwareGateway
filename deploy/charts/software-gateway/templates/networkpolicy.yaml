{{- if .Values.layers.application }}
{{- if .Values.networkPolicy.enabled }}
{{/*
The only control in front of the Coordinator's API that does not depend on a
token being checked.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "swgw.fullname" . }}-coordinator
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "coordinator") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "coordinator") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: worker}
        - podSelector:
            matchLabels: {app: web}
{{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
{{- end }}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "swgw.fullname" . }}-cerbos
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "cerbos") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "cerbos") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The PDP answers one caller. Nothing else in the namespace has a reason to
    # ask it whether an action is permitted.
    - from:
        - podSelector:
            matchLabels: {app: coordinator}
      ports:
        - {port: 3592, protocol: TCP}
        - {port: 3593, protocol: TCP}
{{/* NO POLICY FOR THE DATABASE, deliberately. Its pods need traffic this chart
     knows nothing about - streaming replication, the operator's connections,
     the instance manager's probes - and the way you would find out a policy
     here was wrong is a failover that does not complete. */}}
{{- end }}
{{- end }}
