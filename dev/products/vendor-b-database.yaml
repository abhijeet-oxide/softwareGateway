apiVersion: softwaregateway.io/v1alpha1
kind: Product

# A deliberately minimal product: one source, one target, no auto-download and
# no verification. It exists so local development exercises the "product with
# almost nothing configured" path, which is where defaulting bugs surface.
metadata:
  name: vendor-b-database
  displayName: "Vendor B Database"
  owner: data-platform@example.com

spec:
  sources:
    - name: primary
      registry: registry.vendor-b.example.com
      repository: db/enterprise
      # Anonymous access — some vendors publish openly. Mutually exclusive
      # with credentialsRef.
      anonymous: true
      discovery:
        interval: 30m

  targets:
    - name: lab
      registry: internal.example.com
      repository: vendor-b/database
      anonymous: true
      default: true
