apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    app.kubernetes.io/part-of: software-gateway-platform
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    softwaregateway.io/note: >-
      Holds the operator's Helm release record only; in this scope the operator
      itself runs in the namespace it serves. The record lives here in every
      scope so that two scopes can never both install - see the HelmRelease.
