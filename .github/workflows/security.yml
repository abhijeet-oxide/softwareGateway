# Scanners, kept out of CI on purpose.
#
# None of these gate a merge and none of them is fast: CodeQL alone is longer
# than the whole of CI. Putting them here means a pull request waits on
# correctness, not on a database build, while the findings still land in the
# Security tab on every push to main and once a week besides.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches advisories published against code nobody has touched.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# EVERY JOB HONOURS RUNNER_LABEL, exactly as ci.yml and cd.yml do. This file
# had `ubuntu-latest` written into all nine of them, which is not a preference
# for hosted runners so much as an omission, and on a repository whose owner
# has an IP allow list it is fatal: a hosted runner's address is not on the
# list, so `actions/checkout` never gets as far as the code.
#
#   remote: The repository owner has an IP allow list enabled, and
#   20.115.146.233 is not permitted to access this repository.
#   fatal: unable to access 'https://github.com/.../': ... error: 403
#
# The scanners then reported as failed, having scanned nothing. With the
# variable unset - a fork, this repository - the fallback is what it always
# was, so nothing changes for anybody who does not set it.
env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PNPM_VERSION: "12.3.4"

jobs:
  # WHICH SCANNERS HAVE ANYTHING TO LOOK AT. CodeQL for Go is 6-8 minutes of
  # database build; a pull request that only edits the chart must not pay it.
  changes:
    name: What changed
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      go: ${{ steps.f.outputs.go }}
      web: ${{ steps.f.outputs.web }}
      containers: ${{ steps.f.outputs.containers }}
      # A JSON array, so a language with nothing to scan costs no runner at all
      # rather than a job that starts and skips every step.
      languages: ${{ steps.f.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE"...HEAD)"
          else
            files="ALL"
          fi
          has() {
            if [ "$files" = "ALL" ]; then echo true; return; fi
            if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi
          }

          go=$(has '^(cmd|internal|pkg|deploy/chartstage|deploy/secretsinv)/|^go\.(mod|sum)$')
          web=$(has '^web/')
          actions=$(has '^\.github/')

          # WHAT THE JAVASCRIPT EXTRACTOR READS IS NOT JUST web/. The ZITADEL
          # seeders under deploy/ and the mock provider under test/ are .mjs
          # and are analysed with it - the host-matching bug fixed in
          # bootstrap.mjs was a CodeQL finding in exactly that tree. Gating the
          # language on `^web/` meant a pull request touching only those files
          # got no JavaScript scan while the run still reported green.
          #
          # Kept SEPARATE from `web`, which still means web/ alone: `web` also
          # gates pnpm audit, and auditing web/pnpm-lock.yaml because a seeder
          # changed is a job with nothing to do.
          js=$(has '^web/|\.(mjs|cjs|js|jsx|ts|tsx)$')

          langs=""
          [ "$go" = true ]      && langs="${langs}\"go\","
          [ "$js" = true ]      && langs="${langs}\"javascript-typescript\","
          # Workflow analysis: the unpinned action, and the expression
          # interpolated straight into a `run:` block.
          [ "$actions" = true ] && langs="${langs}\"actions\","

          {
            echo "go=$go"
            echo "web=$web"
            echo "containers=$(has '^(deploy/build|deploy/web|deploy/certs)/|^go\.(mod|sum)$|^web/pnpm-lock\.yaml$')"
            echo "languages=[${langs%,}]"
          } >> "$GITHUB_OUTPUT"

  # CodeQL: the semantic one. It finds the injection and taint bugs a linter
  # cannot, and it is the expensive one, which is why it is gated above.
  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended over the default pack: the default set is tuned
          # for noise, and this is a product that moves credentials around.
          queries: security-extended
          # Which trees are test input rather than shipped code. Named in a
          # file so the list carries its reasons; see the comments there.
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # The Go vulnerability database, filtered by call graph: govulncheck reports
  # only the advisories whose vulnerable function this code actually reaches,
  # so a finding here is a finding to act on rather than a dependency upgrade
  # to schedule.
  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The web tier's advisories. pnpm audit rather than npm audit - this project
  # has no package-lock.json and npm audit would resolve a different tree.
  #
  # Advisory data moves independently of this repository, so a new critical in
  # a transitive dependency must not turn every unrelated pull request red:
  # the finding is reported, the job is not failed.
  audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Audit
        working-directory: web
        run: |
          pnpm audit --audit-level high --prod | tee "$RUNNER_TEMP/audit.txt" || true
          {
            echo "### pnpm audit"
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Trivy reads the Dockerfiles and the repository tree: base images with known
  # CVEs, and the misconfigurations (a root user, a missing HEALTHCHECK, a
  # container with no resource limits) that a Go linter will never see.
  trivy:
    name: Trivy
    needs: changes
    if: needs.changes.outputs.containers == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # `severity` ALONE DOES NOT FILTER THE SARIF. The action reports
          # every severity into the SARIF regardless, so the line above shaped
          # the console output and nothing that reached the Security tab -
          # which is how 579 low and 259 medium findings arrived under a
          # setting that says CRITICAL,HIGH. This makes the filter mean what
          # it reads as.
          limit-severities-for-sarif: true
          # THE COMPLIANCE FIXTURES ARE NOT THIS DEPLOYMENT'S MANIFESTS.
          #
          # They are broken Kubernetes on purpose - `bad-pdb.yaml`,
          # `bad-security.yaml`, `bad-rbac.yaml` are what the baseline checks
          # are RUN AGAINST, and each one fails the check it is named for. A
          # misconfiguration scanner pointed at them reports every defect they
          # were written to contain: they produced 1007 of this repository's
          # 1011 Trivy alerts, and 172 of its 173 Trivy criticals and highs,
          # burying the four that are about an artifact anybody ships.
          #
          # The same trees are excluded from CodeQL for the same reason; see
          # docs/design/31-code-scanning.md section 3.
          skip-dirs: internal/compliance/baseline/testdata,internal/compliance/render/testdata
          # Reported, not enforced. Trivy's database updates daily and a new
          # HIGH in a base image is a scheduled upgrade, not a broken branch.
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  # THE ALERT INVENTORY, AS A FILE. Every open code scanning alert, from every
  # tool that publishes one - CodeQL and Trivy both - with a breakdown by tool
  # and severity in the job summary and the raw JSON as an artifact.
  #
  # Why this exists: the Security tab is the only place that number lives, and
  # reading it needs a browser and a person. A release review, a reviewer
  # without repository admin, and anything automated all want the list, and a
  # screenshot of a tab is not a list.
  #
  # MANUAL ONLY, and that is the whole design. It reports what the scanners
  # have already published, so it has nothing to add to a pull request and must
  # never cost one a minute. A `workflow_dispatch` run is also the full scan -
  # the `changes` job only narrows the languages for a pull request, and sets
  # every one of them for a manual run - so dispatching this workflow scans
  # everything and then exports what the scan found.
  export:
    name: Export alert inventory
    # always(): the scans above are what makes the export worth reading, but a
    # language that had nothing to build must not stop the export of the rest.
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [codeql, trivy]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # The one permission this whole job is for. The read is why a token that
      # cannot reach the Security tab can still be handed its contents.
      security-events: read
    steps:
      - name: Collect open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A SARIF upload is indexed asynchronously, so the analysis the job
          # above just pushed is not necessarily queryable the moment this one
          # starts. Ten tries, five seconds apart, then take what is there:
          # a slightly stale inventory is worth more than a failed job.
          read_ok=false
          for attempt in $(seq 1 10); do
            if gh api --paginate \
                 "repos/$REPO/code-scanning/alerts?state=open&per_page=100" \
                 --jq '.[]' > alerts.jsonl; then
              read_ok=true
              break
            fi
            echo "code scanning alerts not queryable yet (attempt $attempt/10)"
            sleep 5
          done

          # AN EMPTY LIST MUST MEAN "NO ALERTS" AND NEVER "THE READ FAILED".
          # Those are the same empty file, and a summary reporting 0 open
          # alerts because the API refused is the failure this product's own
          # design refuses to ship (docs/design/21 section 2). So a read that
          # never succeeded fails the job instead of publishing a zero.
          if [ "$read_ok" != true ]; then
            echo "::error::could not read code scanning alerts after 10 attempts; check that this job still has security-events read"
            exit 1
          fi
          jq -s '.' alerts.jsonl > alerts.json

          total=$(wc -l < alerts.jsonl | tr -d ' ')

          # security_severity_level is what the tab's Critical/High badge reads
          # from, and only security queries carry one; rule.severity is the
          # fallback so a quality finding still lands in a row instead of
          # vanishing from the count.
          #
          # Ordered by severity and not by count, because the row somebody is
          # looking for is the critical one even when there is a single one of
          # it under four hundred mediums.
          rows () {
            jq -s -r --arg by "$1" '
              def rank: {"critical":0,"high":1,"medium":2,"low":3}[.] // 4;
              def key: if $by == "rule"
                       then [.tool, .sev, .rule] else [.tool, .sev] end;
              map({ tool: .tool.name,
                    sev:  (.rule.security_severity_level // .rule.severity // "unknown"),
                    rule: .rule.id })
              | group_by(key)
              | map(.[0] + {n: length})
              | sort_by([(.sev | rank), -.n, .tool])
              | .[]
              | if $by == "rule"
                then "| \(.tool) | \(.sev) | `\(.rule)` | \(.n) |"
                else "| \(.tool) | \(.sev) | \(.n) |" end
            ' alerts.jsonl
          }

          {
            echo "### Open code scanning alerts: $total"
            echo
            echo "| Tool | Severity | Alerts |"
            echo "|---|---|---:|"
            rows tool
            echo
            echo "<details><summary>By rule</summary>"
            echo
            echo "| Tool | Severity | Rule | Alerts |"
            echo "|---|---|---|---:|"
            rows rule
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: code-scanning-alerts
          path: |
            alerts.json
            alerts.jsonl
          retention-days: 30

  # A CREDENTIAL IN THE HISTORY IS A CREDENTIAL TO ROTATE, so this one does
  # fail the build. The rule it enforces is in CLAUDE.md: no credential is ever
  # a value in this repository; config/secrets/secrets.yaml holds names only.
  #
  # The binary rather than gitleaks-action, which requires a paid licence key
  # for organisation-owned repositories.
  gitleaks:
    name: Secret scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret that was committed and then removed is
          # still a secret that leaked.
          fetch-depth: 0

      - name: Scan
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --exit-code 1

  # A dependency that arrives in a pull request is reviewed before it is
  # merged, not after. Pull requests only - there is no diff to review on a
  # push to main.
  #
  # NEEDS DEPENDENCY GRAPH ON for the repository, under Settings -> Code
  # security. Without it this job fails with "Dependency review is not
  # supported on this repository", which is a setting nobody has turned on
  # rather than anything wrong with the diff - and the message says so.
  #
  # No `comment-summary-in-pr`: posting it needs `pull-requests: write`, and a
  # run triggered by Dependabot gets a read-only token whatever this file asks
  # for. Most pull requests here are Dependabot's, so the comment would fail on
  # exactly the ones a finding is most likely to appear in. The findings are in
  # the job summary and the check annotation either way.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Copyleft licences would change this product's distribution terms.
          deny-licenses: AGPL-3.0, GPL-3.0, GPL-2.0

  # The gate. Only the scanners whose findings are actionable on this diff
  # block a merge; the advisory jobs report and are allowed to be red.
  security:
    name: Security
    if: always()
    needs: [changes, codeql, gitleaks, dependency-review]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every scanner that ran must have passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a security scanner failed - see the Security tab"
          exit 1
      - run: echo "Security is green"
