apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
resources:
  - namespace.yaml
  - ../base
patches:
  - target:
      kind: HelmRelease
      name: cloudnative-pg
    patch: |
      - op: add
        path: /spec/values/config
        value:
          # Every namespace in the cluster, which is what lets one operator
          # serve both environments.
          clusterWide: true
