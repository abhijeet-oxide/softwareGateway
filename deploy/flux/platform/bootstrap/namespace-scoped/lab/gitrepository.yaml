# The cluster's platform source, and it tracks `main` whichever environments
# live here.
#
# Operators are CLUSTER-SCOPED. A cluster that hosts both lab and production
# has one CloudNativePG, not one per namespace, so this cannot hang off the
# per-environment sources - those track different branches and would each try
# to own the same operator, reverting each other every five minutes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: software-gateway-platform
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/abhijeet-oxide/softwareGateway
  ref:
    branch: main
  secretRef:
    name: software-gateway-git
  ignore: |
    /*
    !/deploy/flux/platform/operators
