# Software Gateway - chart defaults.
#
# A deployment states its differences in one values file. Annotated examples
# for AKS and OpenShift are in deploy/examples/.

nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------------------------- layers
#
# The chart renders two independent layers. They are separate so that a
# rollback of one cannot reach the other, and so that the ZITADEL migration can
# be a Helm pre-install hook - which needs the database to already exist.
#
# A plain `helm install` of a self-contained stack turns both on and accepts
# that ordering is then the operator's problem. The GitOps path installs two
# releases from ONE values file, the database one first; see
# deploy/flux/software/base.
layers:
  database: false
  application: true

# The ZITADEL organization this deployment serves. A token minted for a
# different organization at the same issuer is rejected rather than read.
tenant: default

# Who somebody is told to ask when this deployment refuses them. An address or
# a URL. Empty names no route, which is better than inventing one.
supportContact: ""

# --------------------------------------------------------------------- images
#
# This product's three images live at <registry>/<repository>/software-gateway-<name>.
# The tag is not settable per component: three images built from one commit are
# one artifact.
image:
  registry: ""
  repository: software-gateway
  # Empty means .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Third-party images, written as upstream paths. `mirror` is prefixed to each,
# so an estate with no egress repoints all of them in one place.
images:
  mirror: ""
  zitadel: zitadel/zitadel:v4.17.3
  zitadelLogin: zitadel/zitadel-login:v4.17.3
  nginx: nginx:1.27.5-alpine
  cerbos: cerbos/cerbos:0.55.0
  # One utility image, used by the seeder and every wait-for-... init container.
  node: node:22.23.2-alpine

# Names of Secrets the kubelet pulls with. Every pod and the database Cluster
# get all of them.
imagePullSecrets: []
#  - acr-pull

# --------------------------------------------------------------------- access
#
# The two addresses a BROWSER uses, and how they are published. Everything
# internal is a Service name and is not configurable.
#
# `identity` is stamped into every token's `iss` and is the Host header ZITADEL
# matches against, so it must be the address a browser really reaches. A
# hostname or an IP; no public DNS is required.
access:
  scheme: http
  web:
    host: localhost
    # Omitted from the URL when it is the scheme's default.
    port: 8000
  identity:
    host: localhost
    port: 8090

  # ingress       an Ingress per address (Kubernetes)
  # route         a Route per address (OpenShift)
  # loadBalancer  a LoadBalancer Service per address
  # nodePort      a NodePort Service per address
  # none          ClusterIP only - an external reverse proxy is pointed at the
  #               `web` and `zitadel-proxy` Services
  expose:
    type: none
    # Applied to whichever objects the type above renders.
    annotations: {}
    ingress:
      className: ""
      tls:
        enabled: false
        webSecretName: ""
        identitySecretName: ""
    route:
      # edge, passthrough, reencrypt, or "" for plain HTTP.
      termination: ""
    loadBalancer:
      webIP: ""
      identityIP: ""
    nodePort:
      # 0 lets the API server allocate.
      web: 0
      identity: 0

# ------------------------------------------------------------------- database
#
# Connection the application and ZITADEL use.
database:
  # Empty derives <cluster.name>-rw and <cluster.name>-app, which is what
  # CloudNativePG publishes. Set them for a database this release does not
  # provision.
  host: ""
  port: 5432
  name: swgw
  # ZITADEL claims `public` and about 150 tables, so it gets its own database
  # in the same instance rather than a schema.
  identityDatabase: zitadel
  sslMode: require

  existingSecret: ""
  usernameKey: username
  passwordKey: password
  # A key holding a ready-made connection URL. CloudNativePG publishes `uri`.
  # Empty composes the DSN from the parts above; the password must then be
  # URL-safe, because the kubelet substitutes it without encoding.
  dsnKey: uri

  # How long a pod waits in Init for the database before reporting why. It does
  # not crash-loop.
  waitTimeoutSeconds: 600

  # The CloudNativePG Cluster the `database` layer renders. Its name is what the
  # two settings above are derived from, so both releases agree on the database
  # without restating it.
  #
  # Clear the name for a database this deployment does not own - a managed
  # service, an existing cluster - and set `host` and `existingSecret` instead.
  cluster:
    name: swgw-db
    instances: 3
    image: ghcr.io/cloudnative-pg/postgresql:16.10
    storage:
      size: 50Gi
      className: ""
    # The write-ahead log on its own volume, so a burst of WAL cannot fill the
    # volume the data is on.
    walStorage:
      size: 10Gi
      className: ""
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {memory: 4Gi}
    parameters:
      max_connections: "400"
    # A commit is on two instances before the client is told it committed.
    synchronousReplicas: 1
    # Continuous WAL archiving. A replica is not a backup: it replicates a
    # DROP TABLE faithfully and immediately.
    backup:
      enabled: false
      destinationPath: ""
      retentionPolicy: 30d
      # Exactly one of these, matching destinationPath.
      azureCredentials: {}
      s3Credentials: {}
      googleCredentials: {}

# ------------------------------------------------------------------ workloads
coordinator:
  replicas: 2
  resources:
    # No CPU limit: CFS throttling on a control plane produces stalls that read
    # as network faults. Memory is limited - unbounded memory is a node hazard.
    requests: {cpu: 200m, memory: 256Mi}
    limits: {memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 45

worker:
  replicas: 2
  resources:
    requests: {cpu: "1", memory: 256Mi}
    limits: {memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # A worker streams blobs registry to registry. On SIGTERM it stops leasing and
  # finishes what it holds; anything outliving this is killed and its lease
  # expires.
  terminationGracePeriodSeconds: 120
  autoscaling:
    # Needs prometheus-adapter to publish the metric. Without it the HPA reports
    # `unknown` forever and pins replicas at minReplicas.
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    metricName: softwaregateway_queue_backlog_per_worker
    targetAverageValue: "20"

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

cerbos:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------ identity
#
# ZITADEL, its sign-in screens, and the nginx that puts them on one origin.
# `enabled: false` points the deployment at an identity provider it does not
# manage: set access.identity at it and run the seeder against it.
identity:
  enabled: true

  # The 32-byte key ZITADEL encrypts its own secrets with. Not generated here:
  # a generated key that nothing stores is a database nobody can decrypt after
  # the next upgrade.
  masterkey:
    existingSecret: ""
    key: masterkey
    # Local and evaluation only; the chart refuses a production-shaped install
    # with this set.
    value: ""

  # ZITADEL's own root account, created at first boot.
  rootPassword:
    existingSecret: ""
    key: rootPassword
    value: ""

  # The first administrator, created before anybody has signed in.
  bootstrapAdmin:
    username: admin
    email: admin@example.com
    firstName: ""
    lastName: ""
    # Local and evaluation only. The seeder refuses to run with this set while
    # sso.issuer is configured.
    password: ""
    existingSecret: ""

  # Single sign-on against a corporate directory. With `issuer` set the sign-in
  # screen redirects straight to it. The redirect URI to register is
  # <identity url>/idps/callback, under the "Web" platform.
  sso:
    issuer: ""
    clientId: ""
    existingSecret: ""
    clientSecretKey: clientSecret
    displayName: Microsoft
    # Keeps ZITADEL's own password box available after SSO is configured.
    allowPasswordLogin: false
    requireMfa: false

  # Tokens are verified offline, so removing somebody stops the RENEWAL rather
  # than the session. This is that window.
  tokenLifetimes:
    accessToken: 15m
    idToken: 12h
    refreshTokenIdle: 720h
    refreshTokenMax: 2160h

  branding:
    primaryColor: ""
    primaryColorDark: ""
    languages: en

  zitadel:
    replicas: 2
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}
  login:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  proxy:
    replicas: 2
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 128Mi}

# ------------------------------------------------------------------- seeding
#
# The Job that turns config/users/users.yaml and config/access/roles.yaml into
# accounts, projects and grants. Its name carries a hash of what it reads, so a
# release that only moved an image creates no Job. It restarts nothing.
seed:
  enabled: true
  ttlSecondsAfterFinished: 3600
  backoffLimit: 4
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Reissues the worker fleet's credentials on the next run. The old ones stop
  # working at once, so let the run finish and then roll the workers.
  rotateWorkerSecret: false

# ------------------------------------------------------------------- secrets
#
# config/secrets/secrets.yaml lists the credentials this deployment needs -
# names, keys and a relative path, no values. This picks the operator that
# turns each entry into a Kubernetes Secret; the Secret that lands is identical
# either way.
secrets:
  # vault | azureKeyVault | none
  backend: none

  vault:
    authRef: vault-auth
    mount: kv
    type: kv-v2
    # The inventory's `path` is appended to this.
    pathPrefix: softwaregateway
    refreshAfter: 1h

  azureKeyVault:
    name: ""
    tenantId: ""
    # Workload identity. The deprecated aad-pod-identity is not offered.
    clientId: ""
    # Object names are <objectPrefix><name>-<key>.
    objectPrefix: swgw-

  # Produce the kubelet's pull Secret from the inventory as well, so one
  # credential is held in one place. The rendered Secret's name is added to
  # imagePullSecrets automatically.
  registryPullSecret:
    enabled: false
    name: registry-pull
    # The inventory entry holding a ready-made .dockerconfigjson.
    from: registry-pull

# --------------------------------------------------------- extra trust roots
#
# PEM certificates for internal registries signed by a private CA. Mounted over
# the image's bundle and named in SSL_CERT_FILE.
extraCAs:
  enabled: false
  existingConfigMap: ""
  certificates: ""

# ---------------------------------------------------------------- networking
networkPolicy:
  # Off by default: a policy naming the wrong namespace is an outage, and a
  # cluster whose CNI does not enforce them is a false sense of safety.
  enabled: false
  # Namespaces allowed to reach the Coordinator directly - monitoring, whatever
  # runs transferctl.
  allowFromNamespaces: []

# ------------------------------------------------------------- observability
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ------------------------------------------------------------ configuration
#
# config/config.yaml is mounted verbatim - the same file `task run` reads and
# docker-compose.yml mounts. Cluster differences are stated here as SWGW_
# overrides, which is the layering the loader already performs. An unknown
# SWGW_ variable is refused at startup, so a typo is a failed rollout.
settings: {}
#  SWGW_OBSERVABILITY_LOG_LEVEL: debug

coordinatorExtraEnv: []
workerExtraEnv: []

# ------------------------------------------------------------------ rollout
#
# maxUnavailable 0: a replica is removed only after its replacement is ready,
# and readiness on the Coordinator means the database answers and the schema
# matches this build. A bad image stalls the rollout instead of taking capacity
# away, which is what makes Flux's remediation fire.
rollout:
  maxSurge: 1
  maxUnavailable: 0
  progressDeadlineSeconds: 600
