# WHO MAY USE THIS GATEWAY, and what each of them may do.
#
# This file IS the provisioning mechanism. Add a person, commit, and let the
# seeder run - `docker compose run --rm zitadel-init` locally, the seeding Job
# under Flux, a pipeline step in CI. Who has access is then a reviewed change
# rather than clicks in a console that nobody can reconstruct afterwards.
#
# Idempotent in both directions that matter: an account that already exists is
# left alone, a grant that is missing is added. Removing somebody here does NOT
# delete their account - deleting a person is not a thing a seeder should decide
# to do on a re-run - so revoke access in the console or by disabling them at
# the identity provider.
#
# THE ADDRESS IS THE IDENTITY. With single sign-on configured, an account is
# matched to an arriving sign-in by a VERIFIED e-mail address. The address here
# must be the one the corporate directory asserts for that person, or they are
# refused with `Errors.User.NotFound` however correct everything else looks. The
# seeder prints what the directory actually asserted on every run.
#
#   username    the login name in the identity provider. Local to this system.
#   email       what the directory asserts. This is what a sign-in matches on.
#   firstName   optional. Derived from the address when it spells a name, and
#   lastName    replaced by the directory's own at the second sign-in.
#   password    LOCAL AND TEST ONLY. Ignored once SSO_ISSUER is set.
#   orgRoles    tenant-wide roles, from data/access/roles.yaml
#   products    per-product roles, from the same file
#
# EVERY PRODUCT IN data/products NEEDS AN OWNER HERE. Seeding fails otherwise,
# naming the product and the role - see `ownerRole` in data/access/roles.yaml.

users:
  - username: test-owner
    email: test-owner@example.com
    firstName: Test
    lastName: Owner
    password: TestOwner!23
    orgRoles: []
    products:
      software-01: [product-owner]
      software-02: [product-owner]
      software-03: [product-owner]

  - username: test-security
    email: test-security@example.com
    firstName: Test
    lastName: Security
    password: TestSec!23
    orgRoles: [org-security]
    products: {}

  - username: test-reader
    email: test-reader@example.com
    firstName: Test
    lastName: Reader
    password: TestRead!23
    orgRoles: [org-reader]
    products: {}

# Machine accounts. They authenticate with the client credentials grant - no
# browser, no password - and carry exactly the same roles as a person, so an
# automated caller is gated by the same policies. Their secrets are printed
# ONCE, by the run that creates them, because ZITADEL does not store them
# retrievably; set `rotateSecret: true` to reissue.
apiUsers:
  - username: ci-deployer
    name: CI Deployer
    description: pipeline that requests downloads
    orgRoles: []
    products:
      software-01: [product-operator]

  - username: ci-auditor
    name: CI Auditor
    description: reads security across all products
    orgRoles: [org-security]
    products: {}
