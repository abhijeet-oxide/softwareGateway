name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GODEBUG: http2client=0

jobs:
  build:
    name: Application build and tests
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm CLI
        run: npm install --global pnpm@12.3.4

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: task build

      - name: Run Go vet
        run: task vet

      - name: Run automated tests
        run: task test

      - name: Verify built binaries
        run: |
          ./bin/coordinator --version
          ./bin/worker --version
          ./bin/transferctl version --client

  postgres:
    name: PostgreSQL integration tests
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # SQLite does not cover PostgreSQL-specific query behavior.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run PostgreSQL test suite
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: task test:postgres

  cross-compile:
    name: Cross-platform binary build
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build Linux, macOS, and Windows binaries
        run: task build:all

      - name: Verify Windows binary extensions
        run: |
          missing=0
          for arch in amd64 arm64; do
            for bin in coordinator worker transferctl; do
              if [ ! -f "dist/windows-$arch/$bin.exe" ]; then
                echo "::error::dist/windows-$arch/$bin.exe is missing"
                missing=1
              fi
              if [ -f "dist/windows-$arch/$bin" ]; then
                echo "::error::dist/windows-$arch/$bin has no .exe suffix"
                missing=1
              fi
            done
          done
          if [ "$missing" = "0" ]; then
            echo "all Windows binaries correctly suffixed"
          fi
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  portable:
    name: Taskfile portability validation
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Run selected tasks with a Windows-like PATH to catch Unix-only commands.
      - name: Validate commands with a restricted PATH
        run: |
          mkdir -p /tmp/winpath
          for t in go gofmt git task; do
            ln -sf "$(command -v $t)" "/tmp/winpath/$t"
          done

          for t in build:backend vet validate; do
            echo "--- task $t"
            if ! env -i \
                 PATH=/tmp/winpath \
                 HOME="$HOME" \
                 GOCACHE="$(go env GOCACHE)" \
                 GOMODCACHE="$(go env GOMODCACHE)" \
                 task "$t"; then
              echo "::error::task $t needs a command Windows does not have."
              echo "::error::Gate it with 'platforms:' or use a template function."
              exit 1
            fi
          done
          echo "every task ran with only go, gofmt, git and task on PATH"

  lint:
    name: Go static analysis
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # v2.13 is the first release whose go directive is 1.26, and golangci-lint
      # refuses to run when it was built with a Go older than the module targets.
      - name: Install golangci-lint CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "golangci-lint install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run Go static analysis
        run: task lint

  config:
    name: Product configuration validation
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Task CLI
        run: |
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Task CLI install failed; retrying ($attempt/3)"
            sleep 10
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate product files
        run: task validate

      - name: Verify invalid configuration is rejected
        run: task validate:rejects-broken

  chart:
    name: Helm and Kubernetes manifest validation
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Helm
        run: |
          helm_dir="$RUNNER_TEMP/bin"
          mkdir -p "$helm_dir"
          curl -fsSL https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$helm_dir/helm"
          echo "$helm_dir" >> "$GITHUB_PATH"
          "$helm_dir/helm" version --short

      - name: Install Kustomize
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kustomize" version

      # Helm packages a directory, so stage the shared config into the chart.
      - name: Stage chart configuration
        run: go run ./deploy/chartstage/cmd/chartstage

      - name: Lint Helm chart
        run: |
          helm lint deploy/charts/software-gateway \
            --set identity.masterkey.value=0123456789abcdef0123456789abcdef \
            --set identity.rootPassword.value=lint

      # Render every instance with the one values file Flux will put in a
      # ConfigMap, both layers, exactly as the two HelmReleases read it.
      - name: Render every instance
        run: |
          set -euo pipefail
          for instance in $(go run ./deploy/chartstage/cmd/chartstage -instances | awk '{print $1}'); do
            go run ./deploy/chartstage/cmd/chartstage -values "$instance" > "/tmp/$instance-values.yaml"
            for layer in database application; do
              db=false; app=false
              [ "$layer" = database ] && db=true || app=true
              helm template swgw deploy/charts/software-gateway \
                --values "/tmp/$instance-values.yaml" \
                --set "layers.database=$db" --set "layers.application=$app" \
                > "/tmp/$instance-$layer.yaml"
              echo "$instance/$layer: $(grep -c '^kind:' "/tmp/$instance-$layer.yaml") objects"
            done
          done

      - name: Build every Flux kustomization
        run: |
          set -euo pipefail
          find deploy/flux -name kustomization.yaml -print0 | while IFS= read -r -d '' k; do
            d=$(dirname "$k")
            n=$("$RUNNER_TEMP/bin/kustomize" build "$d" | grep -c '^kind:' || true)
            echo "$d: $n objects"
          done

      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 /tmp/lab-application.yaml /tmp/lab-database.yaml

      - name: Verify invalid chart configurations are rejected
        run: |
          set -euo pipefail
          fails=0
          try() {
            if helm template t deploy/charts/software-gateway "${@:2}" >/dev/null 2>&1; then
              echo "::error::the chart accepted $1, which cannot work"
              fails=1
            else
              echo "refused: $1"
            fi
          }
          base=(--set identity.masterkey.value=0123456789abcdef0123456789abcdef
                --set identity.rootPassword.value=r)
          try "a release that renders neither layer" \
            "${base[@]}" --set layers.application=false
          try "a database layer with no cluster to name" \
            --set layers.application=false --set layers.database=true --set database.cluster.name=
          try "an external database nobody said where to find" \
            "${base[@]}" --set database.cluster.name=
          try "a masterkey that is not 32 bytes" \
            --set identity.masterkey.value=short --set identity.rootPassword.value=r
          try "single sign-on with the client secret in values" "${base[@]}" \
            --set identity.sso.issuer=https://example.com --set identity.sso.clientId=x
          try "an Ingress routing on an IP literal" "${base[@]}" \
            --set access.expose.type=ingress --set access.web.host=10.0.0.1
          try "a node port outside the node port range" "${base[@]}" \
            --set access.expose.type=nodePort
          try "a pull secret that no inventory entry produces" "${base[@]}" \
            --set secrets.backend=vault --set secrets.registryPullSecret.enabled=true \
            --set secrets.registryPullSecret.from=nothing-declares-this
          try "an internal registry with no mirror for the third-party images" \
            "${base[@]}" --set image.registry=registry.example.internal
          exit $fails

  release:
    name: Release version calculation
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The algorithm asks which release first contained a commit, which a
          # shallow clone answers wrongly rather than failing.
          fetch-depth: 0

      - name: Calculate release version
        env:
          CHANNEL: main
        run: bash .github/scripts/version.sh

  schema:
    name: Coordinator smoke test
    # Self-hosted runners are selected with the RUNNER_LABEL repository variable.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start coordinator and verify health endpoints
        run: |
          go build -o /tmp/coordinator-ci ./cmd/coordinator

          /tmp/coordinator-ci --config ./config/config.yaml &
          COORD=$!
          trap 'kill $COORD 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/metrics | grep -q 'softwaregateway_build_info'
          # Asserts a product was actually LOADED and serialised, not merely
          # that the route answers. The old assertion looked for 'reference',
          # a field this response no longer carries, so it could not pass on
          # any input - the endpoint returns name/productId/sources/targets.
          curl -fsS http://localhost:8080/api/v1/products | grep -q '"productId"'
          echo "coordinator booted, migrated and served products"
