<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" role="img" aria-label="Software Gateway">
  <!-- The same mark the application draws in web/src/brand.ts: a closed carton
       seen from a three-quarter angle, its lid seam across the top and its two
       faces separated by tone. Drawn here in the brand colour rather than in
       white, because this one sits on the sign-in screen's own surface. -->
  <g transform="translate(6,10) scale(1.05)" fill="#22b8cf">
    <path d="M12 12.1 L21 7.4 L21 16.6 L12 21.3 Z" fill-opacity="0.55"/>
    <path d="M12 12.1 L3 7.4 L3 16.6 L12 21.3 Z" fill-opacity="0.78"/>
    <path d="M12 2.7 L21 7.4 L12 12.1 L3 7.4 Z"/>
    <path d="M7.5 5.05 L16.5 9.75" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="38" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="16" font-weight="600" fill="#f8f9fa">Software Gateway</text>
</svg>
