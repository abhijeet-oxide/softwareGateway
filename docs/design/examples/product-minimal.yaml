# ═══════════════════════════════════════════════════════════════════════════════
#  Product — the minimum that works
#
#  The site's default flow, one vendor, three internal repositories, no
#  overrides of anything. This is the whole document.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: softwaregateway.io/v1alpha2
kind: Product

metadata:
  name: nokia-cmm
  displayName: Nokia Cloud Mobility Manager
  owner: mobility-core

spec:
  sources:
    - name: vendor
      registry: vendor-near
      repositories: ['nokia/cmm']
      discovery:
        interval: 30m

  targets:
    - name: external
      registry: artifactory
      repository: nokia-external/cmm
      scan: [xray, anchore]
    - name: lab
      registry: artifactory
      repository: nokia-lab/cmm
      scan: [xray, anchore]
    - name: prod
      registry: artifactory
      repository: nokia-prod/cmm
      scan: [xray]

  quay:
    organization: mobility-core           # earns this product both lab mirrors
    robot: mobility-core+swgw

  autoDownload:
    enabled: true
    rules:
      - name: all
        tagPattern: '.*'

# No `pipeline:` — the site default [external, lab, prod] binds to the targets
# of the same name. No `trust:`, no `gates:`, no `scanners:`, no `network:`, no
# `concurrency:`, no `retention:`. Sixteen keys.
