# A product whose packages are spread across SEVERAL REPOSITORIES on one
# registry, with a private CA and repository filtering.
#
# The other two sample products show the single-repository case. This one
# exists to answer three questions the schema alone does not:
#
#   1. How do I cover more than one repository?
#   2. What if I do not know the repositories yet — a new one appears every
#      time a component is published?
#   3. Where do I put my internal CA certificate?

apiVersion: softwaregateway.io/v1alpha1
kind: Product

metadata:
  name: vendor-c-suite
  displayName: "Vendor C Suite"
  description: "Ships as separate repositories per component."
  owner: platform-infra@example.com

spec:
  # ---------------------------------------------------------------------
  # TLS trust for everything in this product.
  #
  # The bundle is APPENDED to the system roots, never replacing them — a
  # product that adds a private CA still needs to reach public registries and
  # Sigstore. There is deliberately no `insecureSkipVerify`: disabling
  # verification is never the right fix, and an option to do it gets set in
  # production "temporarily" exactly once.
  #
  # The file is a PEM bundle projected by VSO at
  # <configDir>/secrets/internal-ca/ca.crt. Override the filename with `key`.
  # ---------------------------------------------------------------------
  network:
    caBundleRef:
      secretName: internal-ca
      key: ca.crt
    proxy:
      httpsProxy: http://proxy.example.com:3128
      noProxy: [".svc.cluster.local", "internal.example.com"]
    timeouts:
      connect: 10s
      responseHeader: 30s

  sources:
    # -----------------------------------------------------------------
    # Several repositories, named explicitly.
    #
    # One source, not three: they share a registry host, one credential and
    # one rate-limit budget. Three sources would duplicate all three and let
    # the per-repository budgets multiply against a vendor that only ever
    # sees one client.
    # -----------------------------------------------------------------
    - name: components
      registry: registry.vendor-c.example.com
      repositories:
        - suite/core
        - suite/database
        - suite/frontend
        - suite/agent
      credentialsRef:
        secretName: vendor-a-registry
      discovery:
        enabled: true
        interval: 15m
        tagFilters:
          include: ['^v\d+\.\d+\.\d+$']
      rateLimits:
        maxConcurrentDownloads: 16
        requestsPerSecond: 50

    # -----------------------------------------------------------------
    # NO REPOSITORIES NAMED — the interesting case.
    #
    # Naming none means "every repository on this registry", found from the
    # catalog on every scan. This is what you want when you cannot know the
    # set in advance: each new plugin ships as a NEW repository, and listing
    # them by hand means a plugin is silently not replicated until somebody
    # remembers to edit this file.
    #
    # There is no `enabled` switch for it. Naming nothing IS the statement,
    # so configuration cannot say one thing and mean another.
    #
    # discovery.repositoryFilters is what keeps the scope to ours on a
    # registry shared with other teams. It is not mandatory — a registry
    # dedicated to one product needs no filter — but `transferctl products
    # check` reports how many repositories an unfiltered source would adopt,
    # which is the fact worth knowing.
    # -----------------------------------------------------------------
    - name: plugins
      registry: internal.example.com
      credentialsRef:
        secretName: internal-registry
      discovery:
        enabled: true
        interval: 30m
        # Both filters live here because discovery is what they govern: a scan
        # finds REPOSITORIES, then TAGS, and each step gets a filter.
        repositoryFilters:
          include: ['^vendor-c/plugins/']
          exclude: ['-test$', '-scratch$']
        tagFilters:
          include: ['^v\d+\.\d+\.\d+$']
        maxRepositories: 100
      # Per-source network settings override the product's where set.
      #
      # `direct: true` bypasses the product-level proxy entirely — and the
      # environment's, too. "Everything through the corporate proxy except this
      # one internal registry" is the normal shape, and repeating the host in
      # noProxy at every level is easy to get subtly wrong.
      network:
        proxy:
          direct: true

      # Signing trust for THIS vendor. Two vendors do not share a signing
      # identity, so cosign replaces the product's wholesale rather than
      # merging — a trust configuration assembled from two documents is one
      # nobody can audit. The scalars (policy, atSource) still inherit.
      #
      # Executes in M5; validated now so it is correct when it arrives.
      verification:
        enabled: true
        atSource: true
        policy: warn          # still onboarding their signing
        cosign:
          mode: key
          key:
            publicKeyRef:
              secretName: internal-registry
              key: password   # a stand-in; a real deployment projects a PEM

  # A target that is being decommissioned. `enabled: false` stops it receiving
  # transfers without throwing away the configuration or its history.
  #
  # Validation rejects an autoDownload rule pointing at a disabled target,
  # because that would otherwise fail the first time a package matched it.

  targets:
    - name: internal
      registry: internal.example.com
      repository: mirror/vendor-c
      credentialsRef:
        secretName: internal-registry
      default: true

  autoDownload:
    enabled: true
    rules:
      - name: releases
        tagPattern: '^v\d+\.\d+\.\d+$'
        targets: [internal]
        priority: 100
