# Operator charts, from the internal registry like everything else.
#
# BESIDE THE GitRepository, NOT IN THE OPERATORS LAYER. It is a SOURCE, and
# sources live in flux-system whichever namespace the operator ends up in - the
# operator's HelmRelease references it across namespaces by design. Keeping it
# in the layer would put it through that layer's namespace transformer and land
# it next to the operator, where the sourceRef would no longer find it.
#
# A cluster that pulls its application from Artifactory and its database
# operator from the public internet is not an air-gapped deployment; it is one
# that has not been tested without egress yet. Mirror the upstream chart into a
# virtual Helm repository and point this at it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: internal-charts
  namespace: flux-system
spec:
  type: oci
  url: oci://artifactory.internal.example.com/helm
  interval: 5m
  # The same JFrog credential everything else uses.
  secretRef:
    name: jfrog
