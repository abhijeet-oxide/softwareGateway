# yaml-language-server: $schema=../../../software/schema/values.schema.json
#
# LAB - only what differs from the chart's defaults.
#
# Every key not here is a chart default: `helm show values software-gateway`,
# or deploy/charts/software-gateway/values.yaml with the reasoning attached.
# Restating a default is how the two drift, so `go test ./deploy/...` fails on
# one.

supportContact: platform-team@example.internal

# No public DNS and nothing that terminates TLS, so the scheme stays the chart's
# default `http` and both addresses are private load balancer IPs. Claiming https
# here would be a stack that comes up green and refuses every sign-in: the scheme
# is stamped into every token's `iss` and the coordinator checks it.
access:
  web:
    host: 10.20.30.40
    port: 80
  identity:
    host: 10.20.30.41
    port: 80
  expose:
    type: loadBalancer
    annotations:
      # Without this Azure allocates a PUBLIC address.
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    loadBalancer:
      # Free addresses in the node subnet. Leave empty to let Azure allocate,
      # then put what it allocated into access.*.host above.
      webIP: 10.20.30.40
      identityIP: 10.20.30.41

# Everything through one registry, the third-party images included.
image:
  registry: contoso.azurecr.io
images:
  mirror: contoso.azurecr.io/docker

# Created by hand: `task flux:secrets -- lab` prints the command.
imagePullSecrets:
  - registry-pull

database:
  cluster:
    instances: 2
    image: contoso.azurecr.io/docker/cloudnative-pg/postgresql:16.10
    storage: {size: 32Gi, className: managed-csi}
    walStorage: {size: 8Gi, className: managed-csi}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 2Gi}
    # With two instances a synchronous standby is the whole fleet, and a lab can
    # afford to lose the last few seconds.
    synchronousReplicas: 0

identity:
  masterkey:
    existingSecret: swgw-zitadel
  rootPassword:
    existingSecret: swgw-zitadel
  bootstrapAdmin:
    email: platform-team@example.internal
  # No single sign-on here: everybody in config/users/users.yaml signs in with
  # the password that file carries.
  zitadel: {replicas: 1}
  login: {replicas: 1}
  proxy: {replicas: 1}

cerbos:
  replicas: 1

# A lab is a place to read logs.
settings:
  SWGW_OBSERVABILITY_LOG_LEVEL: debug
