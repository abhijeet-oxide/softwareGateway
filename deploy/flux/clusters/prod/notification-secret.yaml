# The webhook the notifications are posted to.
#
# IN flux-system, NOT the application namespace, which is why it is here rather
# than in config/secrets/secrets.yaml. That inventory is the list of credentials
# the APPLICATION reads, and everything in it is projected into the pods at
# /etc/softwaregateway/secrets. This one is read by Flux itself, about the
# application, and putting it in that list would mount a Teams webhook inside
# the coordinator for no reason.
#
# Same backend, same mount, same review path - one directory further out.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  mount: kv
  type: kv-v2
  # The key in the KV entry must be `address`: that is the field the msteams
  # Provider reads. A `proxy` key is optional and is read too.
  path: softwaregateway/prod/flux-notifications
  refreshAfter: 1h
  vaultAuthRef: vault-auth
  destination:
    name: flux-notifications
    create: true
