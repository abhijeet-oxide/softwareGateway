{{- if .Values.layers.application }}
{{/*
CREDENTIALS, FROM ONE INVENTORY, THROUGH EITHER OPERATOR.

config/secrets/secrets.yaml lists what this deployment needs: a name, its keys
and a relative path. No values, ever. This turns that list into whichever
operator the cluster runs, and the Secret that lands is identical either way -
same name, same keys - so switching backends is one value.

  vault          VaultStaticSecret, read by the Vault Secrets Operator. The
                 Secret exists whether or not a pod is running and a rotation
                 reaches the projected volume without a restart.
  azureKeyVault  SecretProviderClass, read by the Azure Key Vault CSI driver.
                 The driver produces a Secret only while a pod mounts the class,
                 so the coordinator mounts it.
  none           the Secrets are already in the namespace.

The environment supplies the ROOT (vault.pathPrefix, azureKeyVault.name); the
inventory supplies the leaf.
*/}}
{{- $inv := .Files.Get "files/config/secrets/secrets.yaml" | fromYaml -}}
{{- $entries := default (list) $inv.secrets -}}
{{- $pull := .Values.secrets.registryPullSecret -}}

{{- if eq .Values.secrets.backend "vault" }}
{{- range $entries }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "swgw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    softwaregateway.io/keys: {{ join ", " (default (list) .keys) | quote }}
{{- if .description }}
    softwaregateway.io/description: {{ .description | quote }}
{{- end }}
spec:
  mount: {{ $.Values.secrets.vault.mount }}
  type: {{ $.Values.secrets.vault.type }}
  path: {{ printf "%s/%s" (trimSuffix "/" $.Values.secrets.vault.pathPrefix) .path }}
  # What makes a rotation arrive without a rollout: the operator rewrites the
  # Secret, the kubelet updates the projected volume, the process reads the file
  # when it next needs a token.
  refreshAfter: {{ $.Values.secrets.vault.refreshAfter }}
  vaultAuthRef: {{ $.Values.secrets.vault.authRef }}
  destination:
    name: {{ .name }}
    create: true
{{- if and $pull.enabled (eq .name $pull.from) }}
    # The kubelet's pull credentials. The vault entry holds a ready-made
    # .dockerconfigjson rather than parts this chart would have to assemble.
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}
{{- end }}

{{- if eq .Values.secrets.backend "azureKeyVault" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "swgw.fullname" . }}-secrets
  labels:
    {{- include "swgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "secrets.azureKeyVault.clientId is required (workload identity)" .Values.secrets.azureKeyVault.clientId | quote }}
    keyvaultName: {{ required "secrets.azureKeyVault.name is required" .Values.secrets.azureKeyVault.name | quote }}
    tenantId: {{ required "secrets.azureKeyVault.tenantId is required" .Values.secrets.azureKeyVault.tenantId | quote }}
    objects: |
      array:
{{- range $entries }}
{{- $entry := . }}
{{- range .keys }}
        - |
          objectName: {{ printf "%s%s-%s" $.Values.secrets.azureKeyVault.objectPrefix $entry.name (. | replace "." "-") }}
          objectType: secret
          objectAlias: {{ printf "%s__%s" $entry.name . }}
{{- end }}
{{- end }}
  # The Secrets the driver syncs out of what it mounted. These carry the same
  # names and keys the Vault path produces.
  secretObjects:
{{- range $entries }}
{{- $entry := . }}
    - secretName: {{ .name }}
{{- if and $pull.enabled (eq .name $pull.from) }}
      type: kubernetes.io/dockerconfigjson
{{- else }}
      type: Opaque
{{- end }}
      data:
{{- range .keys }}
        - objectName: {{ printf "%s__%s" $entry.name . }}
          key: {{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
