# Applied once per cluster:  kubectl apply -k deploy/flux/clusters/<env>
#
# This is a KUSTOMIZE kustomization - the thing `kubectl -k` reads - and
# sync.yaml beside it is a FLUX Kustomization, which is a different kind with
# the same name. Keeping them in one file is not possible and putting both
# under the name `kustomization.yaml` is how `kubectl apply -k` ends up parsing
# a Flux object and reporting a field it has never heard of.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml         # where this cluster reads the repository and the charts
  - sync.yaml           # what it reconciles from them
  - notifications.yaml  # and what it says while doing it
  - notification-secret.yaml  # the webhook it says it to
