name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # prometheus/client_golang and the OTel stack require Go 1.25, which raised
  # the module's floor from the 1.24 originally planned. See docs/design/16 §5.
  GO_VERSION: "1.25"

# Every job below invokes the SAME task a developer runs locally. That is the
# point of moving off make: a pipeline that reimplements the build in YAML
# drifts from what developers run, and the drift is only discovered when CI
# passes and the laptop does not - or the reverse. One definition, one file,
# both places.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify go.mod is tidy
        run: task tidy:check

      # `task build` depends on build:frontend, which runs `pnpm build`. Without
      # these the task fails with exit status 127 - pnpm simply is not there.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        run: task build

      - name: Vet
        run: task vet

      # Unit tests MUST NOT require Docker. They run against SQLite and an
      # in-process registry, because a suite that needs containers is a suite
      # developers run less often - and the difference compounds.
      - name: Test
        run: task test

      # The built binaries, not `go run`: this is the artefact that ships, and
      # a build that produces something unrunnable must fail here.
      - name: Verify binaries run
        run: |
          ./bin/coordinator --version
          ./bin/worker --version
          ./bin/transferctl version --client

  postgres:
    name: Store tests against Postgres
    runs-on: ubuntu-latest
    # A SERVICE CONTAINER, not Docker inside the tests.
    #
    # The rule above still holds - `task test` must run on a laptop with
    # nothing installed - and this does not break it: the Postgres cases skip
    # themselves when TEST_POSTGRES_DSN is unset, so the same suite runs both
    # places and only this job has a server to point at.
    #
    # It exists because SQLite could not have caught what shipped. Its dialect
    # is largely the identity function, so a query that is not portable passes
    # every local run: the transfer projection coalesced a timestamptz with the
    # empty string, and the short-id lookup compared a UUID column with an
    # arbitrary string. Listing or reading a transfer - the Downloads page, the
    # shell, every `transferctl transfers` command - could not work on Postgres
    # at all, and nothing in this file would have said so.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test against both dialects
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: task test:postgres

  cross-compile:
    name: Cross-compile every platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for linux, darwin and windows
        run: task build:all

      # Windows binaries MUST carry .exe. Without it the file is not executable
      # on Windows and has to be renamed by hand - a bug this repository
      # shipped once already, so it is now asserted rather than assumed.
      - name: Assert Windows binaries have the .exe suffix
        run: |
          missing=0
          for arch in amd64 arm64; do
            for bin in coordinator worker transferctl; do
              if [ ! -f "dist/windows-$arch/$bin.exe" ]; then
                echo "::error::dist/windows-$arch/$bin.exe is missing"
                missing=1
              fi
              if [ -f "dist/windows-$arch/$bin" ]; then
                echo "::error::dist/windows-$arch/$bin has no .exe suffix"
                missing=1
              fi
            done
          done
          if [ "$missing" = "0" ]; then
            echo "all Windows binaries correctly suffixed"
          fi
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  portable:
    name: No Unix-only commands in the Taskfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Task interprets shell SYNTAX in-process, but an external command still
      # has to exist on PATH. `date`, `rm`, `tail`, `grep`, `sed` and `awk` do
      # not exist in PowerShell, and shelling out to one fails the whole
      # Taskfile before any task runs:
      #
      #   task: Command "date -u +%Y-%m-%dT%H:%M:%SZ" failed: exit status 127
      #
      # This job reproduces that on Linux by stripping PATH down to what a
      # Windows box has, so the failure is caught in seconds rather than
      # waiting on the Windows runner below - or on a developer's laptop, which
      # is where it was actually found.
      - name: Run tasks with a Windows-like PATH
        run: |
          mkdir -p /tmp/winpath
          for t in go gofmt git task; do
            ln -sf "$(command -v $t)" "/tmp/winpath/$t"
          done

          # build:backend, not build. `build` also runs build:frontend, which
          # is `pnpm build` - and pnpm spawns package scripts THROUGH A SHELL,
          # the one thing this job deliberately removes from PATH. Testing it
          # here would fail on the harness rather than on a Unix-only command,
          # which is the opposite of what this job is for. build:frontend is a
          # single cross-platform command in `dir: web` with no shell
          # built-ins; pnpm picks the right shell per platform itself.
          # validate:rejects-broken is absent on purpose: it is a shell
          # fixture gated to linux/darwin in the Taskfile, so asserting it runs
          # without a shell would be asserting something nobody wants.
          for t in build:backend vet validate test:short; do
            echo "--- task $t"
            if ! env -i \
                 PATH=/tmp/winpath \
                 HOME="$HOME" \
                 GOCACHE="$(go env GOCACHE)" \
                 GOMODCACHE="$(go env GOMODCACHE)" \
                 task "$t"; then
              echo "::error::task $t needs a command Windows does not have."
              echo "::error::Gate it with 'platforms:' or use a template function."
              exit 1
            fi
          done
          echo "every task ran with only go, gofmt, git and task on PATH"

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The reason this job exists. The Makefile needed bash and `find`, so it
      # could not run here at all - Windows support was asserted, never tested,
      # and the .exe bug survived because nothing checked. Task ships its own
      # shell interpreter, so the same tasks run natively in PowerShell.
      # `task build` depends on build:frontend, which runs `pnpm build`. Without
      # these the task fails with exit status 127 - pnpm simply is not there.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        run: task build

      - name: The binaries are runnable without renaming
        run: |
          ./bin/coordinator.exe --version
          ./bin/worker.exe --version
          ./bin/transferctl.exe version --client

      # Without the race detector: it needs cgo and a C toolchain, which is a
      # slow and fragile thing to require of a Windows runner. The Linux job
      # runs -race, which is where race coverage belongs.
      - name: Test
        run: task test:short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The action rather than `task lint`: it manages the golangci-lint
      # version and its own result cache, which a plain invocation does not.
      # The version is pinned because the config uses the v2 schema and a v1
      # binary rejects it.
      # v7 or newer is REQUIRED: this repository pins golangci-lint v2, and
      # action v6 refuses it outright with "golangci-lint v2 is not supported
      # by golangci-lint-action v6".
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

  config:
    name: Validate product configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: go-task/setup-task@v1
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The compensation for configuring products as ConfigMaps rather than
      # CRDs: there is no admission webhook, so the same validator the
      # Coordinator runs at load runs here, before the pull request merges.
      - name: Validate sample products
        run: task validate

      # The validator must actually reject bad configuration. A validator that
      # passes everything is worse than none, because it is trusted.
      - name: Confirm the validator rejects the broken fixture
        run: task validate:rejects-broken

  schema:
    name: Schema boots end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Proves the zero-setup development path stays working: no cluster, no
      # containers, no manual migration step.
      - name: Coordinator boots on SQLite and serves its probes
        run: |
          # Compile FIRST, then start. `go run` compiles inside the readiness
          # budget below, so adding a dependency to the binary silently eats
          # the wait and the job fails with "connection refused" as though the
          # service were broken. Building separately keeps the 20 s budget
          # measuring startup, which is what it is meant to measure.
          go build -o /tmp/coordinator-ci ./cmd/coordinator

          # data/products is committed and is what every runtime reads, so
          # there is nothing to seed: this boots the Coordinator against the
          # same directory a developer, a compose stack and a cluster all use.
          /tmp/coordinator-ci --config ./data/config.yaml &
          COORD=$!
          trap 'kill $COORD 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/metrics | grep -q 'softwaregateway_build_info'
          # Asserts a product was actually LOADED and serialised, not merely
          # that the route answers. The old assertion looked for 'reference',
          # a field this response no longer carries, so it could not pass on
          # any input - the endpoint returns name/productId/sources/targets.
          curl -fsS http://localhost:8080/api/v1/products | grep -q '"productId"'
          echo "coordinator booted, migrated and served products"
