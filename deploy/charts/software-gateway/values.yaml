# Software Gateway - chart defaults.
#
# A deployment states its differences in one values file. Annotated examples for
# an AKS lab, AKS production, OpenShift and an external reverse proxy are in
# deploy/examples/.
#
# EVERY OPTIONAL FEATURE IS ONE FLAG, and turning one on is the only thing that
# adds a Secret to create. `task flux:secrets -- <instance>` prints the current
# list for an instance, derived from its values file.
#
#   identity.enabled              deploy ZITADEL          on   - off points at
#                                                              an identity
#                                                              provider you run
#   identity.sso.enabled          sign in through a       off  - needs a Secret
#                                 corporate directory            (client secret)
#   layers.database               deploy PostgreSQL       off* - on in the Flux
#                                                                path
#   access.expose.type            publish the addresses   none
#   access.expose.ingress.tls     terminate TLS here      off  - needs two
#                                   .enabled                     certificate
#                                                                Secrets
#   database.cluster.backup       continuous WAL          off  - needs object
#                                   .enabled              archiving  storage creds
#   networkPolicy.enabled         fence the coordinator   off
#   metrics.serviceMonitor        scrape metrics          off
#     .enabled
#   secrets.backend               a credentials operator  none - none means the
#                                                                Secrets already
#                                                                exist
#   seed.enabled                  provision people        on
#
# Flux notifications are a cluster concern rather than a deployment one: one
# commented line in deploy/flux/clusters/<cluster>/0-sources/kustomization.yaml.

nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------------------------- layers
#
# The chart renders two independent layers. They are separate so that a
# rollback of one cannot reach the other, and so that the ZITADEL migration can
# be a Helm pre-install hook - which needs the database to already exist.
#
# A plain `helm install` of a self-contained stack turns both on and accepts
# that ordering is then the operator's problem. The GitOps path installs two
# releases from ONE values file, the database one first; see
# deploy/flux/software/base.
layers:
  database: false
  application: true

# The ZITADEL organization this deployment serves. A token minted for a
# different organization at the same issuer is rejected rather than read.
tenant: default

# Who somebody is told to ask when this deployment refuses them. An address or
# a URL. Empty names no route, which is better than inventing one.
supportContact: ""

# --------------------------------------------------------------------- images
images:
  # WHERE THEY COME FROM. These three are what a deployment sets.
  #
  #   registry     this product's own three images, at
  #                <registry>/<repository>/software-gateway-<name>
  #   mirror       every third-party image below. They are written as upstream
  #                paths and this is prefixed, so one line repoints all of them -
  #                usually the same registry with a pull-through path.
  #   pullSecrets  names of Secrets the kubelet pulls with. Applied to every pod
  #                and to the database cluster.
  #
  # Setting `registry` without `mirror` is refused: it is a cluster that pulls
  # three images from you and six from the internet, which is not an air-gapped
  # deployment and looks exactly like one until the first node without egress.
  registry: ""
  mirror: ""
  pullSecrets: []
  pullPolicy: IfNotPresent

  # WHAT IS PULLED. Versions this chart was built and tested against, pinned
  # together. A deployment does not normally set any of them - change one only to
  # take a patch ahead of the chart release that carries it, and expect to carry
  # that override until it catches up.
  #
  # The tag for this product's three images is deliberately not settable per
  # component: three images built from one commit are one artifact, and letting
  # them drift is how a coordinator ends up talking to a worker from another
  # release.
  repository: software-gateway
  # Empty means .Chart.AppVersion.
  tag: ""
  # Upstream references, written the way a registry names them: a Docker Hub
  # image is its bare path, and anything published elsewhere carries its host.
  #
  # `mirror` replaces that host - or is prefixed when there is none - so the path
  # under your registry is the one `az acr import`, `crane copy` or `skopeo` give
  # you by default. `task images:mirror -- <instance>` prints the exact commands.
  zitadel: ghcr.io/zitadel/zitadel:v4.17.3
  zitadelLogin: ghcr.io/zitadel/zitadel-login:v4.17.3
  nginx: nginx:1.27.5-alpine
  cerbos: cerbos/cerbos:0.55.0
  # One utility image, used by the seeder and every wait-for-... init container.
  node: node:22.23.2-alpine
  # Read by the `database` layer, and pulled again on every failover - a cluster
  # that cannot reach it cannot recover.
  postgres: ghcr.io/cloudnative-pg/postgresql:16.10

# --------------------------------------------------------------------- access
#
# THE TWO ADDRESSES A BROWSER USES. Everything internal is a Service name and is
# not configurable, because there is nothing to decide.
#
# Whole URLs, exactly as somebody would type them. Scheme, host and port are read
# out of these rather than set separately, so there is nothing to get out of step.
#
#   webUrl       where the Software Gateway UI answers
#   identityUrl  where a browser is sent to sign in
#
# They are TWO ORIGINS, not one host with two paths: ZITADEL cannot serve under a
# path prefix, it stamps identityUrl into every token's `iss`, and it answers 404
# to a Host header it does not recognise. One IP with two DNS names, or one name
# on two ports, are both fine - no public DNS is required.
#
# The SCHEME is what the BROWSER speaks to whatever is in front. `https` here
# with a plain-HTTP front door is a stack that comes up green and refuses every
# sign-in. ZITADEL always serves plain HTTP behind the front door; that is a
# different question and does not change the issuer.
access:
  webUrl: http://localhost:8000
  identityUrl: http://localhost:8090

  # HOW THOSE ADDRESSES ARE PUBLISHED.
  #
  #   none          nothing rendered. Every Service stays ClusterIP and your own
  #                 proxy - Traefik, nginx, an ingress you already run - is
  #                 pointed at `web:80` and `zitadel-proxy:80`.
  #   ingress       an Ingress per address
  #   route         a Route per address (OpenShift)
  #   loadBalancer  a Service per address, each with its own address
  #   nodePort      a Service per address, reached at <node ip>:<port>
  expose:
    type: none
    # Applied to whichever objects the type above renders.
    annotations: {}
    ingress:
      className: ""
      tls:
        enabled: false
        webSecretName: ""
        identitySecretName: ""
    route:
      # edge, passthrough, reencrypt, or "" for plain HTTP.
      termination: ""
    loadBalancer:
      webIP: ""
      identityIP: ""
    nodePort:
      # 0 lets the API server allocate.
      web: 0
      identity: 0

# ------------------------------------------------------------------- database
#
# Connection the application and ZITADEL use.
database:
  # Empty derives <cluster.name>-rw and <cluster.name>-app, which is what
  # CloudNativePG publishes. Set them for a database this release does not
  # provision.
  host: ""
  port: 5432
  name: swgw
  # ZITADEL claims `public` and about 150 tables, so it gets its own database
  # in the same instance rather than a schema.
  identityDatabase: zitadel
  sslMode: require

  existingSecret: ""
  usernameKey: username
  passwordKey: password
  # A key holding a ready-made connection URL. CloudNativePG publishes `uri`.
  # Empty composes the DSN from the parts above; the password must then be
  # URL-safe, because the kubelet substitutes it without encoding.
  dsnKey: uri

  # How long a pod waits in Init for the database before reporting why. It does
  # not crash-loop.
  waitTimeoutSeconds: 600

  # The CloudNativePG Cluster the `database` layer renders. Its name is what the
  # two settings above are derived from, so both releases agree on the database
  # without restating it.
  #
  # Clear the name for a database this deployment does not own - a managed
  # service, an existing cluster - and set `host` and `existingSecret` instead.
  cluster:
    name: swgw-db
    instances: 3
    storage:
      size: 50Gi
      className: ""
    # THE WRITE-AHEAD LOG, ON ITS OWN VOLUME. Nothing to do with backups.
    #
    # Every write is journalled here before it reaches the data files, and the
    # journal is only recycled once it has. A large transfer writes WAL far
    # faster than it is recycled, so on one volume a burst fills the disk the
    # data is on - and a PostgreSQL that cannot write WAL stops accepting writes
    # entirely. Separate volumes turn that into a full WAL disk and a database
    # that is still serving reads.
    #
    # Set size to "" to keep WAL on the data volume.
    walStorage:
      size: 10Gi
      className: ""
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {memory: 4Gi}
    parameters:
      max_connections: "400"
    # A commit is on two instances before the client is told it committed.
    synchronousReplicas: 1
    # Continuous WAL archiving. A replica is not a backup: it replicates a
    # DROP TABLE faithfully and immediately.
    backup:
      enabled: false
      destinationPath: ""
      retentionPolicy: 30d
      # Exactly one of these, matching destinationPath.
      azureCredentials: {}
      s3Credentials: {}
      googleCredentials: {}

# ------------------------------------------------------------------ workloads
coordinator:
  replicas: 2
  resources:
    # No CPU limit: CFS throttling on a control plane produces stalls that read
    # as network faults. Memory is limited - unbounded memory is a node hazard.
    requests: {cpu: 200m, memory: 256Mi}
    limits: {memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 45

worker:
  replicas: 2
  resources:
    requests: {cpu: "1", memory: 256Mi}
    limits: {memory: 512Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  # A worker streams blobs registry to registry. On SIGTERM it stops leasing and
  # finishes what it holds; anything outliving this is killed and its lease
  # expires.
  terminationGracePeriodSeconds: 120
  autoscaling:
    # Needs prometheus-adapter to publish the metric. Without it the HPA reports
    # `unknown` forever and pins replicas at minReplicas.
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    metricName: softwaregateway_queue_backlog_per_worker
    targetAverageValue: "20"

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

cerbos:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------ identity
#
# ZITADEL, its sign-in screens, and the nginx that puts them on one origin.
# `enabled: false` points the deployment at an identity provider it does not
# manage: set access.identity at it and run the seeder against it.
identity:
  enabled: true

  # THE TWO VALUES WITH NO SAFE DEFAULT, and you do not have to create either.
  #
  # Left as they are, the chart generates them on first install and reads them
  # back from the cluster on every upgrade, so they never rotate. Read one at any
  # time with:
  #
  #   kubectl -n <namespace> get secret <release>-identity \
  #     -o jsonpath='{.data.masterkey}' | base64 -d
  #
  # `existingSecret` takes them from a Secret you manage instead - a credentials
  # operator, or your own `kubectl create secret`. `value` is for a laptop.
  #
  # KEEP A COPY OF THE MASTER KEY somewhere deleting the namespace cannot reach.
  # ZITADEL encrypts its own database with it, so a database restored into a
  # fresh namespace without it is bytes nothing can read.
  masterkey:
    existingSecret: ""
    key: masterkey
    value: ""

  # ZITADEL's own instance owner, created at first boot. Not the product
  # administrator - that account comes from config/users/users.yaml. This one is
  # the way back in if provisioning ever breaks.
  rootPassword:
    existingSecret: ""
    key: rootPassword
    value: ""

  # The first administrator, created before anybody has signed in.
  bootstrapAdmin:
    username: admin
    email: admin@example.com
    firstName: ""
    lastName: ""
    # Local and evaluation only. The seeder refuses to run with this set while
    # sso.issuer is configured.
    password: ""
    existingSecret: ""

  # Single sign-on against a corporate directory. On, the sign-in screen
  # redirects straight to it and ZITADEL's own form is never shown.
  #
  # Needs an app registration in the directory. Its issuer and client id are
  # values; its client SECRET is a Secret, named below and never written here.
  # The redirect URI to register is <identity url>/idps/callback, under the
  # "Web" platform - see docs/entra-app-registration.md.
  sso:
    enabled: false
    issuer: ""
    clientId: ""
    existingSecret: ""
    clientSecretKey: clientSecret
    displayName: Microsoft
    # Keeps ZITADEL's own password box available after SSO is configured.
    allowPasswordLogin: false
    requireMfa: false

  # Tokens are verified offline, so removing somebody stops the RENEWAL rather
  # than the session. This is that window.
  tokenLifetimes:
    accessToken: 15m
    idToken: 12h
    refreshTokenIdle: 720h
    refreshTokenMax: 2160h

  branding:
    primaryColor: ""
    primaryColorDark: ""
    languages: en

  zitadel:
    replicas: 2
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1Gi}
  login:
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  proxy:
    replicas: 2
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 128Mi}

# ------------------------------------------------------------------- seeding
#
# The Job that turns config/users/users.yaml and config/access/roles.yaml into
# accounts, projects and grants. Its name carries a hash of what it reads, so a
# release that only moved an image creates no Job. It restarts nothing.
seed:
  enabled: true
  ttlSecondsAfterFinished: 3600
  backoffLimit: 4
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  # Reissues the worker fleet's credentials on the next run. The old ones stop
  # working at once, so let the run finish and then roll the workers.
  rotateWorkerSecret: false

# ------------------------------------------------------------------- secrets
#
# config/secrets/secrets.yaml lists the credentials this deployment needs -
# names, keys and a relative path, no values. This picks the operator that
# turns each entry into a Kubernetes Secret; the Secret that lands is identical
# either way.
secrets:
  # vault | azureKeyVault | none
  backend: none

  vault:
    authRef: vault-auth
    mount: kv
    type: kv-v2
    # The inventory's `path` is appended to this.
    pathPrefix: softwaregateway
    refreshAfter: 1h

  azureKeyVault:
    name: ""
    tenantId: ""
    # Workload identity. The deprecated aad-pod-identity is not offered.
    clientId: ""
    # Object names are <objectPrefix><name>-<key>.
    objectPrefix: swgw-

  # Produce the kubelet's pull Secret from the inventory as well, so one
  # credential is held in one place. The rendered Secret's name is added to
  # images.pullSecrets automatically.
  registryPullSecret:
    enabled: false
    name: registry-pull
    # The inventory entry holding a ready-made .dockerconfigjson.
    from: registry-pull

# --------------------------------------------------------- extra trust roots
#
# PEM certificates for internal registries signed by a private CA. Mounted over
# the image's bundle and named in SSL_CERT_FILE.
extraCAs:
  enabled: false
  existingConfigMap: ""
  certificates: ""

# ---------------------------------------------------------------- networking
networkPolicy:
  # Off by default: a policy naming the wrong namespace is an outage, and a
  # cluster whose CNI does not enforce them is a false sense of safety.
  enabled: false
  # Namespaces allowed to reach the Coordinator directly - monitoring, whatever
  # runs transferctl.
  allowFromNamespaces: []

# ------------------------------------------------------------- observability
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# ------------------------------------------------------------ configuration
#
# config/config.yaml is mounted verbatim - the same file `task run` reads and
# docker-compose.yml mounts. Cluster differences are stated here as SWGW_
# overrides, which is the layering the loader already performs. An unknown
# SWGW_ variable is refused at startup, so a typo is a failed rollout.
settings: {}
#  SWGW_OBSERVABILITY_LOG_LEVEL: debug

coordinatorExtraEnv: []
workerExtraEnv: []

# ------------------------------------------------------------------ rollout
#
# maxUnavailable 0: a replica is removed only after its replacement is ready,
# and readiness on the Coordinator means the database answers and the schema
# matches this build. A bad image stalls the rollout instead of taking capacity
# away, which is what makes Flux's remediation fire.
rollout:
  maxSurge: 1
  maxUnavailable: 0
  progressDeadlineSeconds: 600
