# CD builds and publishes one versioned chart and its images. Flux deploys the
# chart after this workflow updates the environment pointer in Git.
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      # Pointer changes are deployment-only and must not publish a new release.
      - 'deploy/environments/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Queue releases per branch so version calculation and publishing cannot race.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # the version tag, and the one-line pointer commit
  pull-requests: write  # main is rule-protected: the pointer commit goes through a PR

env:
  GO_VERSION: "1.26"
  GODEBUG: http2client=0
  JFROG_REGISTRY: https://artifact.it.example.com
  JFROG_REPOSITORY: artifacts-oci-stage
  REGISTRY_HOST: artifact.it.example.com

jobs:
  # ---------------------------------------------------------------- 1. version
  version:
    name: Decide the version
    runs-on:
      group: Concordia-WestUS3
      labels: concordia-linux-cpu2-ram7gi-dockerio
    outputs:
      chart_version: ${{ steps.v.outputs.chart_version }}
      image_version: ${{ steps.v.outputs.image_version }}
      images_changed: ${{ steps.v.outputs.images_changed }}
      should_release: ${{ steps.v.outputs.should_release }}
      tag: ${{ steps.v.outputs.tag }}
      environment: ${{ steps.env.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Version calculation requires complete tag and commit history.
          fetch-depth: 0

      - id: env
        run: |
          case "${{ github.ref_name }}" in
            main) echo "name=nprd" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::CD runs on main only"; exit 1 ;;
          esac

      - id: v
        env:
          CHANNEL: ${{ github.ref_name }}
        run: bash .github/scripts/version.sh

      # Reserve the version now, before anything is built or pushed. Image
      # tags are immutable, so any later failure (build, chart, promote, a
      # cancelled matrix sibling) must never leave this version un-tagged -
      # otherwise the next run recomputes the exact same version from git
      # tags alone and collides with the image this run already pushed.
      - name: Reserve the release tag
        if: steps.v.outputs.should_release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "${{ steps.v.outputs.chart_version }}"
          git push origin "${{ steps.v.outputs.tag }}"

  # ----------------------------------------------------------------- 2. images
  #
  # Configuration-only releases reuse the existing application images.
  images:
    name: ${{ matrix.component }} image
    needs: version
    if: needs.version.outputs.should_release == 'true' && needs.version.outputs.images_changed == 'true'
    runs-on:
      group: Concordia-WestUS3
      labels: concordia-linux-cpu2-ram7gi-dockerio
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: coordinator
            dockerfile: deploy/build/Dockerfile.coordinator
          - component: worker
            dockerfile: deploy/build/Dockerfile.worker
          - component: web
            dockerfile: deploy/build/Dockerfile.web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Prepare npm registry credentials
        if: matrix.component == 'web'
        env:
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/npmrc" <<EOF
          registry=https://${REGISTRY_HOST}/artifactory/api/npm/npm-proxy/
          //${REGISTRY_HOST}/artifactory/api/npm/npm-proxy/:_authToken=${JFROG_TOKEN}
          always-auth=true
          EOF

      - name: Prepare Go module proxy credentials
        if: matrix.component != 'web'
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/netrc" <<EOF
          machine ${REGISTRY_HOST}
            login ${JFROG_USERNAME}
            password ${JFROG_TOKEN}
          EOF

      # Image tags are immutable; fail on collisions instead of overwriting.
      - name: The tag must not already exist
        run: |
          registry="${JFROG_REGISTRY#https://}"
          registry="${registry#http://}"
          ref="${registry}/${JFROG_REPOSITORY}/software-gateway-${{ matrix.component }}:${{ needs.version.outputs.image_version }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::$ref already exists. An image tag is written once."
            echo "::error::This means a release tag was deleted and recreated, or two runs raced."
            exit 1
          fi
          echo "$ref is free"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY_HOST }}/${{ env.JFROG_REPOSITORY }}/software-gateway-${{ matrix.component }}:${{ needs.version.outputs.image_version }}
          build-args: |
            VERSION=${{ needs.version.outputs.image_version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            HTTP_PROXY=${{ vars.HTTP_PROXY || 'http://proxy.conexus.svc.local:3128' }}
            HTTPS_PROXY=${{ vars.HTTPS_PROXY || 'http://proxy.conexus.svc.local:3128' }}
            NO_PROXY=${{ vars.NO_PROXY }}
            GOPROXY=https://artifact.it.example.com/artifactory/api/go/att-go-proxy-group
            NPM_REGISTRY=https://artifact.it.example.com/artifactory/api/npm/npm-proxy/
          # Mount credentials into builds; build arguments remain visible in image history.
          secret-files: ${{ matrix.component == 'web' && format('npmrc={0}/npmrc', runner.temp) || format('netrc={0}/netrc', runner.temp) }}
          provenance: false

  # ------------------------------------------------------------------ 3. chart
  chart:
    name: Package and publish the chart
    needs: [version, images]
    # Run even when the images job is skipped for a configuration-only release.
    if: always() && needs.version.result == 'success' && needs.version.outputs.should_release == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on:
      group: Concordia-WestUS3
      labels: concordia-linux-cpu2-ram7gi-dockerio
    outputs:
      chart_version: ${{ needs.version.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Helm
        run: |
          helm_dir="$RUNNER_TEMP/bin"
          mkdir -p "$helm_dir"
          curl -fsSL https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$helm_dir/helm"
          echo "$helm_dir" >> "$GITHUB_PATH"
          "$helm_dir/helm" version --short

      # Helm packages a directory, so stage the shared config into the chart.
      - name: Stage config/ into the chart
        run: go run ./deploy/chartstage/cmd/chartstage

      - name: Lint
        run: |
          helm lint deploy/charts/software-gateway \
            --set identity.masterkey.value=0123456789abcdef0123456789abcdef \
            --set identity.rootPassword.value=lint

      # Render the environment before publishing the chart.
      - name: Render nprd environment
        run: |
          set -euo pipefail
          env=nprd
          ns=swg
          go run ./deploy/chartstage/cmd/chartstage -values "$env" > "/tmp/$env-values.yaml"
          helm template swgw deploy/charts/software-gateway \
            --namespace "$ns" --values "/tmp/$env-values.yaml" > "/tmp/$env.yaml"
          echo "$env: $(grep -c '^kind:' "/tmp/$env.yaml") objects"

      - name: Package
        run: |
          helm package deploy/charts/software-gateway \
            --version "${{ needs.version.outputs.chart_version }}" \
            --app-version "${{ needs.version.outputs.image_version }}" \
            --destination /tmp/chart
          ls -l /tmp/chart

      - name: Publish
        run: |
          registry="${JFROG_REGISTRY#https://}"
          registry="${registry#http://}"
          helm registry login "$registry" \
            --username "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_TOKEN }}"
          helm push "/tmp/chart/software-gateway-${{ needs.version.outputs.chart_version }}.tgz" \
            "oci://${registry}/${JFROG_REPOSITORY}"

  # ---------------------------------------------------------------- 4. promote
  #
  # Deployment is a Git pointer update; Flux performs the cluster reconciliation.
  promote:
    name: Point ${{ needs.version.outputs.environment }} at it
    needs: [version, chart]
    if: always() && needs.version.result == 'success' && needs.version.outputs.should_release == 'true' && needs.chart.result == 'success'
    runs-on:
      group: Concordia-WestUS3
      labels: concordia-linux-cpu2-ram7gi-dockerio
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # main is rule-protected ("Changes must be made through a pull
      # request"), so the pointer update goes out on a side branch and merges
      # in through a PR instead of a direct push.
      - name: Move the pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ needs.version.outputs.environment }}
          CHART_VERSION: ${{ needs.version.outputs.chart_version }}
          IMAGE_VERSION: ${{ needs.version.outputs.image_version }}
          IMAGES_CHANGED: ${{ needs.version.outputs.images_changed }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="deploy/environments/${ENVIRONMENT}/platform/helmrelease.yaml"

          # Update exactly one chart version field.
          matches=$(grep -cE '^      version: ' "$file")
          if [ "$matches" != "1" ]; then
            echo "::error::$file has $matches lines matching the chart version; expected exactly 1"
            exit 1
          fi
          previous_version="$(grep -E '^      version: ' "$file" | awk '{print $2}')"
          sed -i -E "s|^      version: .*|      version: ${CHART_VERSION}|" "$file"

          if [ "$IMAGES_CHANGED" = "true" ]; then
            image_note="New images were built and pushed for this release (tag \`${IMAGE_VERSION}\`)."
          else
            image_note="No code changed, so this release reuses the existing images (tag \`${IMAGE_VERSION}\`) - only configuration moved."
          fi

          body=$(cat <<EOF
          ## What this PR does
          Points **${ENVIRONMENT}** at release **${CHART_VERSION}** (previously \`${previous_version}\`).

          This only edits one line in \`${file}\`. [Flux](https://fluxcd.io/) picks up the change and applies it to the cluster automatically - no manual deployment step is needed.

          | | |
          |---|---|
          | Environment | \`${ENVIRONMENT}\` |
          | Chart version | \`${CHART_VERSION}\` (was \`${previous_version}\`) |
          | Image tag | \`${IMAGE_VERSION}\` |
          | Images rebuilt? | ${IMAGES_CHANGED} |
          | Source commit | ${GITHUB_SHA} |
          | Triggered by | [this CD run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |

          ${image_note}

          Opened automatically by the CD pipeline; no cluster credential was used to produce it.
          EOF
          )

          branch="deploy/${ENVIRONMENT}-${CHART_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$file"
          git commit \
            -m "deploy(${ENVIRONMENT}): ${CHART_VERSION}" \
            -m "Points ${ENVIRONMENT} at release ${CHART_VERSION} (was ${previous_version}). ${image_note}"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "deploy(${ENVIRONMENT}): ${previous_version} -> ${CHART_VERSION}" \
            --body "$body")

          # Auto-merge needs a repo setting this token cannot flip, so poll for
          # mergeability ourselves instead: the ruleset (status checks on this
          # PR) is never satisfied the instant it opens.
          for _ in $(seq 1 120); do
            state="$(gh pr view "$pr_url" --json mergeStateStatus --jq .mergeStateStatus)"
            case "$state" in
              CLEAN|HAS_HOOKS)
                gh pr merge "$pr_url" --squash --delete-branch
                exit 0
                ;;
              BEHIND|BLOCKED|UNKNOWN)
                sleep 15
                ;;
              *)
                echo "::error::PR $pr_url is '$state' and cannot become mergeable automatically"
                exit 1
                ;;
            esac
          done
          echo "::error::PR $pr_url did not become mergeable in time"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ needs.version.outputs.environment }}"
            echo
            echo "- chart \`${{ needs.version.outputs.chart_version }}\`"
            echo "- images \`${{ needs.version.outputs.image_version }}\`"
            echo "- pointer \`deploy/environments/${{ needs.version.outputs.environment }}/platform/helmrelease.yaml\`"
            echo
            echo "Flux applies it within a minute. Nothing here touched a cluster."
          } >> "$GITHUB_STEP_SUMMARY"
