findings:
  - {check: SUP-01, kind: Deployment, name: images, container: semver-tag}
  - {check: SUP-01, kind: Deployment, name: images, container: implicit-hub}
  # ported-registry IS pinned by digest, so SUP-01 must not fire on it - that
  # is the false positive a naive reference parser produces.
  - {check: SUP-02, kind: Deployment, name: images, container: ported-registry}
  - {check: SUP-02, kind: Deployment, name: images, container: implicit-hub}
  # semver-tag is on the approved registry, so SUP-02 must NOT fire on it. Its
  # only defect is the tag, and the two checks stay separable - which is what
  # lets a vendor fix one without being told about the other.
  # A moving label: what was tested and what starts after the next restart can
  # be different software, with nothing recording that they differ.
  - {check: SUP-11, kind: Deployment, name: moving, container: latest-tag}
  # SUP-01 must NOT also fire on it. There is no specific version to pin yet, so
  # reporting "not pinned by fingerprint" alongside "uses a moving label" would
  # penalise one decision twice - on exactly the images a reader most needs to
  # look at.
