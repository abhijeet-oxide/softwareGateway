# =============================================================================
# Software Gateway - complete stack, day 0.
#
#   curl -O   https://raw.githubusercontent.com/abhijeet-oxide/softwareGateway/main/deploy/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/abhijeet-oxide/softwareGateway/main/deploy/.env.example
#   docker compose up -d
#
# Open http://localhost:8000. Everything below is seeded automatically.
#
# EVERY IMAGE IS PINNED AND OVERRIDABLE. No `latest` anywhere: a tag that moves
# under you turns a working deployment into a support call nobody can reproduce.
# And no registry host is hard-coded that you cannot replace - each image is a
# variable, so an internal registry or pull-through proxy is one line in .env:
#
#   ZITADEL_IMAGE=artifactory.corp/ghcr-remote/zitadel/zitadel:v4.17.3
#
# ZITADEL is published to GHCR ONLY - it is not on Docker Hub - so its default
# is the one image reference that names a registry. If your proxy cannot reach
# ghcr.io, that is the one to mirror first.
#
# IT RUNS WITH NO .env AT ALL. Every variable has a working default, so
# `docker compose up -d` (or `podman compose up -d`) on a fresh clone gives you
# a running system. That is deliberate: the previous version used compose's
# `:?` required-variable syntax, which is correct and unusable - podman-compose
# surfaces it as a thirty-line Python traceback with the actual message buried
# in the last line, and the first thing anyone sees is a stack dump.
#
# The cost is that the defaults are INSECURE and say so in their own values
# (INSECURE-local-dev-*). The seeder prints a banner naming exactly what to
# change before this is reachable by anyone else. Copy .env.example to .env
# and fill it in for anything beyond your own machine.
#
# STARTUP ORDER is declared, not raced. Each edge is a real condition:
#
#   the identity provider
#     postgres --healthy--> zitadel --healthy--> zitadel-init --completed--+
#                              |                                          |
#                              |                     zitadel-login <------'
#                              `--healthy--> zitadel-proxy <--started-----'
#
#   the product
#     postgres     --healthy---------> controller --healthy--> web
#     cerbos       --healthy---------'                            ^
#     zitadel-init --completed-------'--------------completed-----'
#     controller   --healthy--> worker
#
# ZITADEL is THREE containers, not one, and that is not this stack's choice:
# since v3 the sign-in screens are a separate service from the APIs, and one
# origin in front of both is what makes them a single identity provider. See
# deploy/zitadel/nginx.conf.
#
# SHUTDOWN is the exact reverse: `docker compose down` stops web first and
# postgres last, so nothing writes to a database that has already gone.
# Add -v to that command to discard the data as well.
#
# BUILD SECRETS UNDER PODMAN: THE DEFAULT FILES MUST STAY ZERO BYTES.
#
# podman's remote client - podman machine, so every Windows and macOS host -
# cannot pass a build secret to the server over the wire. It copies each secret
# INTO THE BUILD CONTEXT, keeps the handle open, and tars the context
# (containers/podman, pkg/bindings/images/build.go: os.CreateTemp with a
# `defer Close`). On Windows the size in the tar header comes from the
# directory entry, which still reads zero while podman's writes sit unflushed,
# so the copy delivers the real bytes and archive/tar refuses them:
#
#   archive/tar: write too long
#   Error: Post "http://d/v5.5.2/libpod/build?...": io: read/write on closed pipe
#
# A ZERO BYTE secret is immune, because zero is what the header promised.
# See containers/podman#26914, #17899 and #23815: the bug is open, and empty
# secret files are the only ones that work.
#
# So deploy/npm/npmrc.default and deploy/go/netrc.default are zero bytes, and
# deploy/deploy_test.go fails if either grows. They used to carry a comment
# saying "Intentionally empty" while being 423 and 215 bytes, which broke every
# build on Windows on an error that names neither podman nor the file.
# Anything worth saying about them is in the README beside them.
#
# A CREDENTIALED file is not empty and therefore still hits this. See
# deploy/STACK.md for what to do about that; it is podman's bug to fix, not
# something this file can work around. Docker is unaffected: buildx streams
# secrets over its session rather than through the context.
# =============================================================================

name: software-gateway

services:
  # --- data ------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: swgw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-INSECURE-local-dev-password}
      POSTGRES_DB: swgw
    # Two DATABASES in one instance, never one shared database: ZITADEL claims
    # `public` and ~150 tables. See docs/design/24 section 3.1.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-zitadel.sql:/docker-entrypoint-initdb.d/10-zitadel.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swgw -d swgw"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- identity --------------------------------------------------------------
  zitadel:
    image: ${ZITADEL_IMAGE:-ghcr.io/zitadel/zitadel:v4.17.3}
    restart: unless-stopped
    # The masterkey must be EXACTLY 32 bytes. ZITADEL refuses to start
    # otherwise, and the message ("masterkey must be 32 bytes, but is 33")
    # arrives buried in a migration failure, so count before changing it.
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:-INSECURE-local-dev-masterkey-32c}" --tlsMode disabled
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: swgw
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD:-INSECURE-local-dev-password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: swgw
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-INSECURE-local-dev-password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8090}
      ZITADEL_TLS_ENABLED: "false"
      # Login V2. The sign-in screens are their own service since v3 (see the
      # zitadel-login service below and deploy/zitadel/nginx.conf); these four
      # tell the core where that service is reachable FROM A BROWSER, which is
      # the front door's address and never the container's.
      #
      # v4 already redirects to /ui/v2/login by default, so an unset
      # DEFAULTLOGINURLV2 would work today - through the same front door, with
      # a relative Location. They are set anyway because "it happened to
      # default that way" is not a thing to build a login flow on, and because
      # a reader comparing this against ZITADEL's own compose file should find
      # the same block.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}/ui/v2/login/logout?post_logout_redirect=
      # The org created at first boot IS the default tenant. No second step.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${GATEWAY_TENANT:-default}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ROOT_PASSWORD:-RootPassw0rd!}
      # Machine account + PAT, written to a shared volume for the seeder. It is
      # the ONLY write credential in the stack and no long-running service sees it.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: seeder
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: seeder
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /pat/pat.txt
    user: "0:0"          # the distroless image cannot write /pat as its default uid
    volumes:
      - patshare:/pat
    # NOT published. ZITADEL is reached through zitadel-proxy, which is what
    # puts the core and the login UI on one origin. Publishing this as well
    # would give the same instance a second address that serves 404 for every
    # sign-in URL, which is the more confusing half of the bug this fixes.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # --- day-0 seeding: one shot, idempotent, then gone ------------------------
  zitadel-init:
    image: ${SEEDER_IMAGE:-node:22.23.2-alpine}
    depends_on:
      zitadel:
        condition: service_healthy
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_HOST_HEADER: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}
      ZITADEL_PUBLIC_URL: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}
      WEB_PUBLIC_URL: http://localhost:${WEB_PORT:-8000}
      GATEWAY_TENANT: ${GATEWAY_TENANT:-default}
      GATEWAY_PRODUCTS: ${GATEWAY_PRODUCTS:-software-01,software-02,software-03}
      GATEWAY_ORG_ROLES: ${GATEWAY_ORG_ROLES:-org-admin,org-operator,org-security,org-reader}
      GATEWAY_PRODUCT_ROLES: ${GATEWAY_PRODUCT_ROLES:-product-owner,product-operator,product-reader}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      # Defaulted so a zero-config run has an admin who can actually sign in.
      # Setting SSO_ISSUER makes the seeder REFUSE this, so the convenience
      # cannot follow you into production.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD-INSECURE-local-admin-Passw0rd!}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_DISPLAY_NAME: ${SSO_DISPLAY_NAME:-Microsoft}
      # Password sign-in is switched OFF once SSO is configured, which locks
      # out `zitadel-admin` as well: it is in the same organization and has no
      # Microsoft account. Recoverable, always - this container authenticates
      # with a machine token rather than through the sign-in screen, so setting
      # this and re-running it puts the password box back.
      SSO_ALLOW_PASSWORD_LOGIN: ${SSO_ALLOW_PASSWORD_LOGIN:-false}
      BRANDING_PRIMARY_COLOR: ${BRANDING_PRIMARY_COLOR:-}
      BRANDING_PRIMARY_COLOR_DARK: ${BRANDING_PRIMARY_COLOR_DARK:-}
      BRANDING_LOGO_FILE: ${BRANDING_LOGO_FILE:-}
      BRANDING_LOGO_DARK_FILE: ${BRANDING_LOGO_DARK_FILE:-}
      BRANDING_LANGUAGES: ${BRANDING_LANGUAGES:-en}
      BOOTSTRAP_USERS_FILE: /bootstrap-users.json
      # Who the worker credentials are written FOR. This container is root and
      # the worker image is distroless nonroot, so a 0600 file written here is
      # unreadable there unless it is handed over. 65532 is the nonroot uid in
      # gcr.io/distroless/*; change it with RUNTIME_IMAGE.
      WORKER_UID: ${WORKER_UID:-65532}
      # Set to anything to reissue the worker credentials on this run. The old
      # ones stop working at once; workers take the new ones on restart.
      WORKER_ROTATE_SECRET: ${WORKER_ROTATE_SECRET:-}
      # Only so the banner can name what is still at its default. Never used
      # to authenticate anything.
      STACK_POSTGRES_PASSWORD_SET: ${POSTGRES_PASSWORD:+yes}
      STACK_MASTERKEY_SET: ${ZITADEL_MASTERKEY:+yes}
    volumes:
      # Read-write, unlike every other consumer of this volume: the seeder
      # ISSUES the login service's token as well as reading its own.
      - patshare:/pat
      - oidcshare:/oidc
      # The data plane's credentials. Its own volume: see the volumes block.
      - workercreds:/workercreds
      - ./deploy/zitadel/bootstrap.mjs:/bootstrap.mjs:ro
      - ./deploy/zitadel/users.json:/bootstrap-users.json:ro
      # The sign-in screen's logo. Mount another directory here to brand it
      # without touching the repository - see deploy/zitadel/branding/README.md.
      - ${BRANDING_DIR:-./deploy/zitadel/branding}:/branding:ro
    entrypoint: ["node", "/bootstrap.mjs"]
    restart: on-failure:3

  # --- the sign-in screens ---------------------------------------------------
  # ZITADEL's login UI is a SEPARATE SERVICE, and has been since v3: the core
  # binary serves the APIs and the admin console, and this Next.js app serves
  # every screen a person actually signs in on. Deploying the core alone gives
  # you an identity provider that redirects to a login page that does not
  # exist, which answers `{"code":5,"message":"Not Found"}` - the symptom
  # docs/design/25 was written about.
  zitadel-login:
    image: ${ZITADEL_LOGIN_IMAGE:-ghcr.io/zitadel/zitadel-login:v4.17.3}
    restart: unless-stopped
    depends_on:
      # For the token below, which the seeder issues. Not merely for ZITADEL:
      # this service exits at once if the file is not there.
      zitadel-init:
        condition: service_completed_successfully
    environment:
      # Server to server, so the internal name - this is the one URL here that
      # is NOT the browser-facing one.
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      # The image ships HOSTNAME=:: and its Next.js server listens on exactly
      # what that says, so on any host or engine without IPv6 this container
      # restart-loops on `listen EAFNOSUPPORT ... :::3000` - a message that
      # names neither ZITADEL nor IPv6 as the problem. Nothing in this stack
      # talks IPv6 to it, so it binds v4 and the question does not arise.
      HOSTNAME: 0.0.0.0
      # A service user holding IAM_LOGIN_CLIENT and nothing else. Deliberately
      # not the seeder's PAT: that one can write every object in the instance,
      # and this container is the one thing here a signed-out browser talks to.
      ZITADEL_SERVICE_USER_TOKEN_FILE: /pat/login-client.pat
      # ZITADEL answers 404 to a Host it does not recognise as its own external
      # name, and this service talks to it as `zitadel:8080`. Same fact as
      # SWGW_AUTH_HOSTHEADER on the controller and ZHOST in the seeder. Parsed
      # on the FIRST colon, so a host:port value is safe here.
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090},X-Forwarded-Proto:http
    # The PAT is written by ZITADEL running as uid 0 and is read-only to
    # everyone else, so this image has to read it as root too.
    user: "0"
    volumes:
      - patshare:/pat:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c",
             "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- ZITADEL's front door --------------------------------------------------
  # One origin for the whole identity provider: the APIs, the admin console and
  # the sign-in screens. See deploy/zitadel/nginx.conf for why that is a
  # requirement and not a preference.
  zitadel-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27.5-alpine}
    restart: unless-stopped
    depends_on:
      zitadel:
        condition: service_healthy
      zitadel-login:
        condition: service_started
    volumes:
      - ./deploy/zitadel/nginx.conf:/etc/nginx/templates/zitadel.conf:ro
      - ./deploy/zitadel/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    # BOTH things a bind mount inherits from the host are worked around here.
    #
    # A bind-mounted file keeps the host's permission bits, so a clone that lost
    # the executable bit cannot be run directly - hence `sh <script>` rather than
    # the script itself. And it keeps the host's BYTES, so a Windows checkout
    # made before .gitattributes existed carries CRLF: every line then ends in a
    # carriage return, `set -eu` becomes an illegal option and `nginx` becomes a
    # command not found, none of which mentions line endings. Stripping into
    # /tmp costs one copy at start and makes the container independent of how the
    # repository happens to be checked out.
    entrypoint:
      - /bin/sh
      - -c
      # `tr` rather than `sed 's/\r$//'` on purpose: the sed form contains a `$`,
      # and this string is interpolated by compose before any shell sees it.
      # docker compose survives it; podman-compose has its own substitution and
      # this is not the place to find out whose it is.
      - tr -d '\r' < /docker-entrypoint.sh > /tmp/entrypoint.sh && exec /bin/sh /tmp/entrypoint.sh
    ports:
      - "${ZITADEL_PORT:-8090}:80"
    healthcheck:
      # BOTH halves, because a front door that only proves one of them is a
      # front door that goes green while nobody can sign in. The Host header is
      # explicit: ZITADEL answers 404 to `127.0.0.1`.
      test: ["CMD-SHELL",
             "wget -q -O /dev/null --header=\"Host: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}\" http://127.0.0.1/.well-known/openid-configuration && wget -q -O /dev/null http://127.0.0.1/ui/v2/login/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- authorization ---------------------------------------------------------
  cerbos:
    image: ${CERBOS_IMAGE:-cerbos/cerbos:0.55.0}
    restart: unless-stopped
    command: ["server", "--config=/config/config.yaml"]
    environment:
      # This product ships into air-gapped estates. Cerbos posts usage data to
      # telemetry.cerbos.dev by default, which is a failed TLS handshake every
      # few seconds in a network with no egress, and an unexpected outbound
      # connection in one that has.
      CERBOS_NO_TELEMETRY: "1"
    volumes:
      - ./deploy/cerbos/policies:/policies:ro
      - ./deploy/cerbos/config.yaml:/config/config.yaml:ro
    healthcheck:
      # Defaults to the gRPC health protocol on :3593, which the REST API sits on.
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # --- the product -----------------------------------------------------------
  # Named `controller` at the deployment layer. The binary is still
  # cmd/coordinator: its koanf keys are user-facing config, so renaming them is
  # a deprecation cycle rather than a rename. See docs/design/24 section 13.
  controller:
    # Named so a prebuilt or internally published image can be used instead of
    # building here: CONTROLLER_IMAGE=registry.corp/software-gateway-controller:1.2.3
    image: ${CONTROLLER_IMAGE:-software-gateway-controller:local}
    build:
      context: .
      dockerfile: build/Dockerfile.coordinator
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25.14}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
        # A build container inherits NOTHING from the host, so a corporate
        # proxy must be handed to it explicitly or every fetch times out.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
      secrets:
        - netrc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cerbos:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
    environment:
      # THE DRIVER AS WELL AS THE DSN. They are two settings and the driver
      # defaults to sqlite, so a DSN on its own gave a Coordinator that opened
      # a LOCAL FILE, migrated it, served from it and wrote the whole estate
      # into the container - while this Postgres sat empty and the only clue
      # was one startup line saying "DEVELOPMENT ONLY" beside the Postgres URL
      # it had ignored. `docker compose down` then took the data with it.
      # A mismatch is refused at startup now rather than defaulted around.
      SWGW_DATABASE_DRIVER: postgres
      SWGW_DATABASE_DSN: postgres://swgw:${POSTGRES_PASSWORD:-INSECURE-local-dev-password}@postgres:5432/swgw?sslmode=disable
      # The issuer must be the PUBLIC url: it is what ZITADEL stamps into the
      # token's `iss`, so validating against the internal name fails.
      SWGW_AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Issuer is the PUBLIC url, because that is what lands in the token's
      # `iss`. DiscoveryURL is where this service actually fetches the keys:
      # the browser reaches ZITADEL as localhost, a container reaches it by
      # service name, and both must be expressible or nothing validates.
      SWGW_AUTH_ISSUER: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}
      SWGW_AUTH_DISCOVERYURL: http://zitadel:8080
      # ZITADEL picks its instance from Host and 404s on one it does not know.
      SWGW_AUTH_HOSTHEADER: ${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}
      SWGW_AUTH_CERBOSADDR: http://cerbos:3592
    # No published port on purpose. The API is reached through the web tier at
    # http://localhost:${WEB_PORT:-8000}/api/v1, which is same-origin (the
    # controller ships no CORS middleware) AND lets this service scale: a fixed
    # host port would collide the moment CONTROLLER_REPLICAS > 1.
    volumes:
      - ./deploy/products:/etc/softwaregateway/products:ro
    expose:
      - "8080"
    deploy:
      # podman-compose only scales when mode is explicit; docker compose
      # defaults it to replicated but podman-compose does not.
      mode: replicated
      replicas: ${CONTROLLER_REPLICAS:-1}
    healthcheck:
      # READINESS, not liveness, and that is what every depends_on in this file
      # is waiting for. `--health-check` asks this process's own /readyz over
      # the loopback - the runtime image is distroless, so there is no shell,
      # no wget and no curl, and the only thing that can probe this process is
      # this process. Ready here means: the database answers, its schema is the
      # one this build expects, and the product configuration loaded.
      #
      # Liveness is a separate endpoint (/healthz, /livez) and is deliberately
      # NOT used here: compose does not restart on unhealthy, so wiring the
      # weaker probe in would only make dependents start against a Coordinator
      # that cannot serve them.
      test: ["CMD", "/coordinator", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Migrations run at startup and a first boot applies all of them.
      # Failures inside the start period do not count against retries, so this
      # is a budget for a slow first start rather than added latency.
      start_period: 30s

  # --- the data plane --------------------------------------------------------
  # Stateless by design: workers stream blobs registry to registry and hold
  # nothing, so scaling them is only ever a number.
  worker:
    image: ${WORKER_IMAGE:-software-gateway-worker:local}
    build:
      context: .
      dockerfile: build/Dockerfile.worker
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25.14}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
        # A build container inherits NOTHING from the host, so a corporate
        # proxy must be handed to it explicitly or every fetch times out.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
      secrets:
        - netrc
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
      # For the credentials below. A worker that starts before they are written
      # authenticates with nothing, is refused, and retries until it happens to
      # succeed - which works, and spends the first minutes of every fresh
      # stack looking broken.
      zitadel-init:
        condition: service_completed_successfully
    environment:
      SWGW_WORKER_COORDINATORENDPOINT: http://controller:8080
      # NO DATABASE. A worker holds no database credentials and contains no
      # SQL (docs/design/00 section 5.2) - it leases over HTTP and streams
      # blobs registry to registry. The DSN that used to be here was never
      # read, and handing the data plane a database password to ignore is a
      # credential in one more place for no reason at all.
    # A worker must see the SAME product configuration as the controller, or it
    # leases jobs it cannot execute and says so rather than failing quietly.
    volumes:
      - ./deploy/products:/etc/softwaregateway/products:ro
      # WHO THIS WORKER IS. A machine account in the identity provider, written
      # by the seeder, mounted read-only, identical for every replica. Nothing
      # to configure and nothing to rotate by hand: scaling the fleet is a
      # number. See pkg/authz/workload.go for why it is a mounted file rather
      # than an environment variable.
      - workercreds:/etc/softwaregateway/credentials:ro
    deploy:
      # podman-compose only scales when mode is explicit; docker compose
      # defaults it to replicated but podman-compose does not.
      mode: replicated
      replicas: ${WORKER_REPLICAS:-2}
    healthcheck:
      # HEALTHY HERE MEANS REGISTERED: the Coordinator has accepted this
      # worker's lease call, so it is reachable, this worker authenticated, and
      # it is in the fleet. `docker compose ps` and `podman ps` therefore answer
      # "is the deployment actually working", which is the question anybody
      # reading them is asking.
      #
      # It used to mean only that the process was up and the control plane
      # answered a probe, and that reported a green fleet over a deployment
      # where every single lease was being refused for want of a credential.
      #
      # An idle queue is still healthy - a worker that asks and is told there is
      # nothing has been accepted, which is the whole test. See
      # internal/worker/pulse.go, Loop.Registered.
      #
      # Liveness is a SEPARATE endpoint and deliberately not this one: a worker
      # the Coordinator refuses must not be restarted, because restarting fixes
      # none of the causes and turns a bad credential into a crash loop.
      test: ["CMD", "/worker", "--health-check"]
      interval: 10s
      timeout: 5s
      # Fifty seconds of refusal before the container is called unhealthy, which
      # covers a Coordinator being rolled without flapping the fleet, and is
      # short enough that somebody who has just deployed and is watching gets a
      # truthful answer while they are still watching. It was ten retries when
      # green meant only that the process had started; that is a hundred seconds
      # of a red fleet reading green, and the whole point of this probe is now
      # the opposite.
      retries: 5
      # Enough for the identity provider, a token, and the first lease. Failures
      # inside this window do not count against retries, so it is a budget for a
      # slow first start rather than added latency: a worker that registers in
      # two seconds is healthy in two seconds.
      start_period: 45s

  # --- the UI ----------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-software-gateway-web:local}
    build:
      context: .
      dockerfile: build/Dockerfile.web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.2-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27.5-alpine}
        # A build container inherits NOTHING from the host, so a corporate
        # proxy must be handed to it explicitly or every fetch times out.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
      secrets:
        - npmrc
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
      # For the OIDC client id, which only the seeder knows. Already implied
      # through the controller, and stated because this service now reads a
      # FILE that step writes rather than only depending on it being done.
      zitadel-init:
        condition: service_completed_successfully
    environment:
      # Rendered into /runtime-config.json at container start so the SPA knows
      # where to send the browser for login. Public values only: a public OIDC
      # client has no secret. The client id is generated by ZITADEL and comes
      # Who somebody is told to ask when this deployment will not let them in.
      # An address or a URL; unset means the refusal names no route rather than
      # inventing one. See web/src/App.tsx.
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      # from the seeder through oidcshare; set OIDC_CLIENT_ID to override it.
      OIDC_ISSUER: http://${ZITADEL_EXTERNAL_DOMAIN:-localhost}:${ZITADEL_PORT:-8090}
    volumes:
      - oidcshare:/oidc:ro
    ports:
      - "${WEB_PORT:-8000}:80"
    # No healthcheck here: this image declares its own, and it is a better one
    # than a line in this file could be. See build/Dockerfile.web - it proves
    # nginx is serving, that the entrypoint published the SPA's runtime
    # configuration, and that the Coordinator answers through this tier's own
    # proxy. Overriding it here would replace three facts with one.

volumes:
  pgdata:
  patshare:
  # The SPA's OIDC client id, which ZITADEL generates and only the seeder ever
  # sees. Public values only - a public client has no secret - and a separate
  # volume from patshare so the web tier never mounts a credential.
  oidcshare:
  # The data plane's machine-account credentials, written by the seeder and
  # mounted read-only into every worker. Its own volume rather than a file in
  # oidcshare, which the web tier mounts and which is public values only.
  workercreds:

# Build credentials. See BUILDING UNDER PODMAN at the top of this file before
# changing anything here: under podman these files are copied into the build
# context by the client, so the builds that use them must not run concurrently.
secrets:
  # Points at an empty file by default, because compose refuses to start when
  # a declared secret's source is missing and most builds need no credentials.
  # For an authenticated registry: copy deploy/npm/npmrc.example to
  # deploy/npm/npmrc, fill it in, and set NPM_CONFIG_FILE=./deploy/npm/npmrc
  npmrc:
    file: ${NPM_CONFIG_FILE:-./deploy/npm/npmrc.default}
  # Same mechanism for a private Go module proxy.
  netrc:
    file: ${GO_NETRC_FILE:-./deploy/go/netrc.default}
