{{/*
The bundled database.

EXTERNAL IS THE RECOMMENDATION and the chart says so in values.yaml: Azure
Database for PostgreSQL solves backups, failover, patching and point-in-time
recovery, and this is the only stateful component in the system. What is here
is one instance, one PVC and no failover - enough for `helm install` to produce
something that works and for a lab namespace to run on, and it is labelled so
nobody promotes it by accident.
*/}}
{{- $ns := include "swgw.fullname" . -}}
{{- if not .Values.postgresql.external.enabled }}
{{- $password := .Values.postgresql.password.value -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ns }}-postgres
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  # ONE SECRET, WHICHEVER DATABASE. The Coordinator reads `dsn` and ZITADEL
  # takes the parts, so a rotation is one object either way and nothing
  # downstream knows whether the instance is bundled or managed.
  password: {{ $password | quote }}
  host: postgres
  port: "5432"
  user: swgw
  database: swgw
  sslmode: disable
  dsn: {{ printf "postgres://swgw:%s@postgres:5432/swgw?sslmode=disable" $password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ns }}-postgres-init
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
data:
  10-zitadel.sql: |
{{ .Files.Get "files/postgres/init-zitadel.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $ns }}-postgres
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    softwaregateway.io/note: >-
      One instance, one PVC, no automated failover. For evaluation and lab
      namespaces. Set postgresql.external.enabled for anything else.
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: swgw
            - name: POSTGRES_DB
              value: swgw
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $ns }}-postgres
                  key: password
            # The image's data directory must be a SUBDIRECTORY of the mount.
            # A PVC mounted straight at /var/lib/postgresql/data arrives with a
            # lost+found in it on many storage classes, and initdb refuses a
            # directory that is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U swgw -d swgw"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U swgw -d swgw"]
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ $ns }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.storage.className }}
        storageClassName: {{ .Values.postgresql.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
