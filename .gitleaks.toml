# What is allowed to look like a credential.
#
# This product ships a compliance scanner, so its test data is deliberately
# full of things that read as secrets - that is the fixture. Every entry below
# names the file and why the match is not a credential. Nothing here allows a
# real one: the rule in CLAUDE.md still holds, and config/secrets/secrets.yaml
# carries names, never values.

[extend]
useDefault = true

[allowlist]
description = "Fixtures, documentation examples, and non-secret identifiers"
paths = [
  # The compliance scanner's own corpus. Detecting these strings is the
  # feature under test, so the fixtures must contain them.
  '''internal/compliance/baseline/testdata/.*''',
  '''internal/compliance/cel/heuristics_test\.go''',
  # GODEBUG setting names (x509negativeserial=1), not keys.
  '''internal/platform/tlscompat/tlscompat(_test)?\.go''',
  # Worked examples. Written against example.com with invented values.
  '''docs/.*\.md''',
  '''deploy/.*\.md''',
]
regexes = [
  # The placeholder ZITADEL masterkey that `helm lint` and the chart tests
  # pass in. It is 32 bytes of hex counting from zero, it is in the Taskfile
  # and both workflows in plain sight, and a real one is generated by the
  # chart at install time and never written down here.
  '''0123456789abcdef0123456789abcdef''',
  # The all-zero OIDC client id the lab instance carries so that
  # `identity.sso.enabled=true` renders without a real tenant.
  '''0{8}-?0{4}-?0{4}-?0{4}-?0{12}''',
]
