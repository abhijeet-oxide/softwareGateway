# Source: bad-pdb/templates/rollout-stuck.yaml
# Both zero: a rolling update that can neither add a pod nor remove one.
apiVersion: apps/v1
kind: Deployment
metadata: {name: stuck, namespace: bad}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: stuck}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stuck}
    spec:
      containers:
        - name: stuck
          image: registry.acme.example/bad/stuck@sha256:5555555555555555555555555555555555555555555555555555555555555555
---
# Source: bad-pdb/templates/recreate.yaml
# Recreate stops every pod before starting any. For a workload with traffic
# that is a deliberate outage on every upgrade, and it is usually copied from a
# chart for something that had none. Also declares no progress deadline, so a
# stuck rollout reports progress forever.
apiVersion: apps/v1
kind: Deployment
metadata: {name: recreate, namespace: bad}
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: recreate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: recreate}
    spec:
      containers:
        - name: recreate
          image: registry.acme.example/bad/recreate@sha256:6666666666666666666666666666666666666666666666666666666666666666
---
# Source: bad-pdb/templates/recreate-service.yaml
apiVersion: v1
kind: Service
metadata: {name: recreate, namespace: bad}
spec:
  selector: {app.kubernetes.io/name: recreate}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
# Source: bad-pdb/templates/recreate-pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: recreate, namespace: bad}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: recreate}
