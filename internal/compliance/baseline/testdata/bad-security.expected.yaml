findings:
  - {check: SEC-01, kind: Deployment, name: loose, container: loose}
  - {check: SEC-03, kind: Deployment, name: loose, container: loose}
  # SEC-02, SEC-04 and SEC-05 are deliberately absent here. This container is
  # privileged, so the kernel grants it the full permission set whatever
  # capabilities.drop says, permits escalation whatever
  # allowPrivilegeEscalation says, and lets the process remount its own root
  # filesystem whatever readOnlyRootFilesystem says. All three stand down in
  # favour of SEC-03 and are recorded as skips naming it - see
  # TestAPrivilegedContainerGetsOneFinding.
  - {check: SEC-06, kind: Deployment, name: loose, container: loose}
  # The container runtime socket: reported as cluster-admin equivalence rather
  # than as a mount, because that is what it is.
  - {check: SEC-08, kind: Deployment, name: loose}
  # Gives up every permission and takes back the ability to trace other
  # processes, which is one of the ones that undoes container isolation.
  - {check: SEC-13, kind: Deployment, name: loose, container: loose}
  # Memory-backed scratch with no ceiling: filling it evicts every other pod on
  # the server.
  - {check: SEC-11, kind: Deployment, name: unbounded-scratch}
  - {check: SEC-02, kind: Deployment, name: unbounded-scratch, container: app}
  - {check: SEC-04, kind: Deployment, name: unbounded-scratch, container: app}
  - {check: SEC-05, kind: Deployment, name: unbounded-scratch, container: app}
  - {check: SEC-06, kind: Deployment, name: unbounded-scratch, container: app}
  # Says nothing at all about which user it runs as - which is not the same as
  # running as root, and is reported separately from SEC-01 for that reason.
  - {check: SEC-12, kind: Deployment, name: unbounded-scratch, container: app}
  # The middle tier: NET_RAW alone. It permits raw packet crafting and ARP and
  # DNS spoofing from inside the pod, and the single-tier rule said nothing
  # about it at all.
  - {check: SEC-14, kind: Job, name: adds-capabilities, container: worker}
  # A permission this standard has never classified. Nobody has assessed it,
  # which is a gap in the standard rather than in the chart - and the release
  # should not ship before somebody looks.
  - {check: SEC-15, kind: Job, name: adds-capabilities, container: worker}
  # Read-only program files and nowhere at all to write. The first temporary
  # file this container creates fails at run time.
  - {check: SEC-16, kind: Deployment, name: nowhere-to-write, container: app}
