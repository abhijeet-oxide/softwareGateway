# Placement: workloads that fit on one node, and workloads that fit nowhere.
---
# Source: bad-scheduling/templates/no-spread.yaml
# Three replicas the scheduler may put on one node.
apiVersion: apps/v1
kind: Deployment
metadata: {name: unspread, namespace: bad}
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: unspread}}
  template:
    metadata: {labels: {app.kubernetes.io/name: unspread}}
    spec:
      tolerations:
        # The node is out of memory and this pod insists on landing there
        # anyway, with nothing anywhere saying why.
        - {key: node.kubernetes.io/memory-pressure, operator: Exists, effect: NoSchedule}
        # Bounded, which is the shape SCH-07 asks for.
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 300}
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:aaaaaaaa11111111aaaaaaaa11111111aaaaaaaa11111111aaaaaaaa11111111
---
# Source: bad-scheduling/templates/loose-skew.yaml
# Constraints present, and permitting the imbalance they were added to prevent.
apiVersion: apps/v1
kind: Deployment
metadata: {name: loose-skew, namespace: bad}
spec:
  replicas: 4
  selector: {matchLabels: {app.kubernetes.io/name: loose-skew}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loose-skew, app.kubernetes.io/version: 1.4.2}}
    spec:
      tolerations:
        - {operator: Exists}
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 3
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/version: 1.4.2}
        - topologyKey: kubernetes.io/hostname
          maxSkew: 2
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/version: 1.4.2}
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:bbbbbbbb22222222bbbbbbbb22222222bbbbbbbb22222222bbbbbbbb22222222
---
# Source: bad-scheduling/templates/overconstrained.yaml
# Required node affinity, required pod anti-affinity, and DoNotSchedule. Each
# is reasonable; all three is a workload that is unschedulable after one node
# is cordoned.
apiVersion: apps/v1
kind: Deployment
metadata: {name: overconstrained, namespace: bad}
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: overconstrained}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: overconstrained}
      annotations:
        compliance.softwaregateway.io/toleration-rationale: >-
          Collects kernel logs off nodes that are already under disk pressure,
          which is the condition the logs are needed for. Approved by
          platform-sre 2026-04-11.
    spec:
      tolerations:
        # Declared above, so this one is allowed.
        - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
        # And this one is not bounded, so it never gives the node back.
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: topology.kubernetes.io/zone, operator: In, values: [zone-a, zone-b]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: overconstrained}
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: overconstrained}
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: overconstrained}
      containers:
        - name: app
          image: registry.acme.example/bad/app@sha256:cccccccc33333333cccccccc33333333cccccccc33333333cccccccc33333333
