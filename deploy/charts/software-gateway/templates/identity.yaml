{{- if and .Values.layers.application .Values.identity.enabled }}
{{- $full := include "swgw.fullname" . -}}
{{- $db := include "swgw.dbSecretName" . -}}
{{/*
ZITADEL, its sign-in screens, and the nginx that makes them one origin.

WHY ALL THREE. Since v3 the login UI is a separate Next.js service; the core
alone redirects to a page that does not exist. The two must share an ORIGIN
because the core's redirect to the login screen is relative and the login
screen's redirect back is absolute from ZITADEL's own external URL.

WHY THE SETUP JOB IS A HOOK. `zitadel start` refuses an unmigrated database, and
an upgrade needs `zitadel setup` before the new binary serves. Running it from
the Deployment would have every replica race for the migration lock. As a
pre-install/pre-upgrade hook, Helm waits for it and only then applies the
Deployments - so no ZITADEL pod is ever created against a schema it cannot use.

That requires the database to exist BEFORE this release is installed, which is
why `layers.database` is a separate release.
*/}}
{{/*
THE TWO ZITADEL VALUES THAT HAVE NO SAFE DEFAULT, and why this Secret is
generated rather than asked for.

`masterkey` is what ZITADEL encrypts its own database with. `rootPassword` is
the instance owner's. Neither can be re-derived, so a chart that generated a
fresh one on every render would produce a database nobody can decrypt after the
first upgrade.

So: generate ONCE, then read back. `lookup` returns what is already in the
cluster and the value is reused; only a namespace with no Secret gets a new one.
`helm.sh/resource-policy: keep` then stops `helm uninstall` taking it with the
release, because the database outlives the release and the key must outlive it
too.

ONE THING TO KNOW. `helm template` has no cluster to look in, so it renders a
fresh random value every time. That is harmless for rendering and for CI, and it
means `helm template | kubectl apply` is the one way to rotate this key by
accident. Install and upgrade through Helm or Flux, which have a cluster.

Read the key back at any time:

  kubectl -n <namespace> get secret <release>-identity \
    -o jsonpath='{.data.masterkey}' | base64 -d

Keep a copy somewhere the namespace's deletion cannot reach. Restoring the
database into a fresh namespace without it restores bytes nothing can read.
*/}}
{{- $identitySecret := printf "%s-identity" $full -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $identitySecret) -}}
{{- $held := dict -}}
{{- if $existing }}{{ $held = $existing.data }}{{ end -}}

{{- $needMasterkey := not .Values.identity.masterkey.existingSecret -}}
{{- $needRoot := not .Values.identity.rootPassword.existingSecret -}}
{{- $needAdmin := and .Values.identity.bootstrapAdmin.password (not .Values.identity.bootstrapAdmin.existingSecret) -}}

{{- if or $needMasterkey $needRoot $needAdmin }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $identitySecret }}
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "identity") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $needMasterkey }}
  {{- /* EXACTLY 32 BYTES. ZITADEL refuses to start otherwise, and says so from
         inside a migration failure - so the symptom names neither this setting
         nor its length. */}}
  masterkey: {{ .Values.identity.masterkey.value | default (get $held "masterkey" | b64dec) | default (randAlphaNum 32) | b64enc | quote }}
{{- end }}
{{- if $needRoot }}
  rootPassword: {{ .Values.identity.rootPassword.value | default (get $held "rootPassword" | b64dec) | default (randAlphaNum 24) | b64enc | quote }}
{{- end }}
{{- if $needAdmin }}
  adminPassword: {{ .Values.identity.bootstrapAdmin.password | b64enc | quote }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  # NOT release-prefixed: deploy/zitadel/nginx.conf proxies to `zitadel:8080`.
  name: zitadel
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      # ZITADEL's API is gRPC-Web and HTTP/2 over the same port, and several
      # ingress controllers key their backend protocol off this name.
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-login
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-login") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel-login") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-proxy
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-proxy") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel-proxy") | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # NAMED FOR WHAT IT MIGRATES TO: a new ZITADEL image is a new Job.
  name: {{ printf "%s-zitadel-setup-%s" $full (.Values.images.zitadel | sha256sum | trunc 8) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-setup") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-setup") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      serviceAccountName: {{ $full }}-seeder
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      initContainers:
        # The database is normally Ready before this release installs, but it
        # may be recovering or failing over.
        {{- include "swgw.waitForTCP" (dict "ctx" . "name" "database" "host" (include "swgw.dbHost" .) "port" .Values.database.port) | nindent 8 }}

        # `init zitadel`, not the full `init`. The database and its owner
        # already exist; `init database` would attempt CREATE DATABASE and
        # CREATE ROLE, which the application account cannot do and which fail as
        # `permission denied to create database (SQLSTATE 42501)`. Skipping this
        # step entirely fails later, inside setup, as
        # `relation "eventstore.events" does not exist`.
        - name: init-database
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.zitadel) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["init", "zitadel"]
          env:
            {{- include "swgw.zitadelEnv" . | nindent 12 }}
          securityContext:
            {{- include "swgw.containerSecurityContext" . | nindent 12 }}

        - name: setup
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.zitadel) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["setup", "--masterkeyFromEnv", "--init-projections=true", "--tlsMode", "disabled"]
          env:
            {{- include "swgw.zitadelEnv" . | nindent 12 }}
            # The machine account and its token, created with the first instance
            # and never again. It is the only write credential in the stack, and
            # no long-running service sees it: the container below moves it into
            # a Secret and the Job ends.
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: /pat/pat.txt
          volumeMounts:
            - {name: state, mountPath: /pat}
          securityContext:
            {{- include "swgw.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: publish
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.node) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["node", "/seeder/k8s-state.mjs", "push"]
          env:
            - name: K8S_STATE_SECRET
              value: {{ $full }}-state
            # node's fetch verifies the API server against the service account's
            # own CA; without this it reports a self-signed certificate.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            - {name: state, mountPath: /pat}
            - {name: seeder, mountPath: /seeder, readOnly: true}
          securityContext:
            {{- include "swgw.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: state
          emptyDir: {medium: Memory}
        - name: seeder
          configMap:
            name: {{ $full }}-seeder
            defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-zitadel
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel") | nindent 4 }}
spec:
  replicas: {{ .Values.identity.zitadel.replicas }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- include "swgw.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel") | nindent 8 }}
    spec:
      # REQUIRED, not hygiene. The `zitadel` Service makes Kubernetes inject
      # ZITADEL_PORT=tcp://10.x.x.x:8080, which ZITADEL reads as its own `Port`
      # setting and rejects with `'Port' cannot parse value as 'uint16'`.
      enableServiceLinks: false
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The schema is already migrated: the setup hook ran to completion before
        # Helm applied this. This covers the connection itself, so a pod created
        # during a failover waits for the new primary instead of exiting.
        {{- include "swgw.waitForTCP" (dict "ctx" . "name" "database" "host" (include "swgw.dbHost" .) "port" .Values.database.port) | nindent 8 }}
      containers:
        - name: zitadel
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.zitadel) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # `start`, not `start-from-init`: the Job above owns migrations.
          #
          # `--tlsMode disabled` means ZITADEL itself serves plain HTTP; TLS, if
          # any, terminates at the entry point. It does NOT change the issuer,
          # which follows access.identityUrl through ZITADEL_EXTERNALSECURE.
          args: ["start", "--masterkeyFromEnv", "--tlsMode", "disabled"]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "swgw.zitadelEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /debug/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /debug/healthz, port: http}
            periodSeconds: 20
            failureThreshold: 5
          startupProbe:
            httpGet: {path: /debug/ready, port: http}
            periodSeconds: 5
            failureThreshold: 120
          resources:
            {{- toYaml .Values.identity.zitadel.resources | nindent 12 }}
          securityContext:
            {{- include "swgw.containerSecurityContext" . | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-zitadel-login
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-login") | nindent 4 }}
spec:
  replicas: {{ .Values.identity.login.replicas }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- include "swgw.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel-login") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-login") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # BOTH HARD. This container reads its service-user token from a file at
        # startup and EXITS if it is not there, so without these a first install
        # restarts it every few seconds. It has no useful degraded mode: sign-in
        # screens that cannot drive a login are a 500 with a spinner.
        {{- include "swgw.waitForHTTP" (dict "ctx" . "name" "zitadel" "url" "http://zitadel:8080/debug/ready") | nindent 8 }}
        {{- include "swgw.waitForFile" (dict "ctx" . "name" "login-token" "path" "/pat/login-client.pat"
              "mounts" (printf "- name: pat\n  mountPath: /pat\n  readOnly: true")) | nindent 8 }}
      containers:
        - name: login
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.zitadelLogin) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server to server, so the internal name.
            - name: ZITADEL_API_URL
              value: http://zitadel:8080
            - name: NEXT_PUBLIC_BASE_PATH
              value: /ui/v2/login
            # The image ships HOSTNAME=:: and its Next.js server binds exactly
            # that, so on a node without IPv6 it restart-loops on
            # `listen EAFNOSUPPORT ... :::3000`.
            - name: HOSTNAME
              value: 0.0.0.0
            # A service user holding IAM_LOGIN_CLIENT and nothing else -
            # deliberately not the seeder's PAT, which can write every object in
            # the instance.
            - name: ZITADEL_SERVICE_USER_TOKEN_FILE
              value: /pat/login-client.pat
            # ZITADEL answers 404 to a Host it does not recognise as its own
            # external name, and this service reaches it as `zitadel:8080`.
            - name: CUSTOM_REQUEST_HEADERS
              value: {{ printf "Host:%s,X-Forwarded-Proto:%s" (include "swgw.identityHostHeader" .) (include "swgw.urlScheme" (include "swgw.identityUrl" .)) | quote }}
          readinessProbe:
            httpGet: {path: /ui/v2/login/healthy, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /ui/v2/login/healthy, port: http}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.identity.login.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: pat, mountPath: /pat, readOnly: true}
      volumes:
        - name: pat
          secret:
            secretName: {{ $full }}-state
            optional: true
            defaultMode: 0444
            items:
              - key: login-client.pat
                path: login-client.pat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-zitadel-proxy
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-proxy") | nindent 4 }}
spec:
  replicas: {{ .Values.identity.proxy.replicas }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- include "swgw.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "zitadel-proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "zitadel-proxy") | nindent 8 }}
      annotations:
        checksum/proxy-config: {{ .Files.Get "files/zitadel/nginx.conf" | sha256sum }}
        checksum/proxy-entrypoint: {{ printf "%s|%s" (.Files.Get "files/zitadel/docker-entrypoint.sh") (default "" .Values.supportContact) | sha256sum }}
    spec:
      enableServiceLinks: false
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "swgw.nginxPodSecurityContext" . | nindent 8 }}
      initContainers:
        # The front door proxies both upstreams and has nothing of its own to
        # serve. Hard on the core, soft on the screens: a console session is
        # still worth serving while the sign-in app comes up.
        {{- include "swgw.waitForTCP" (dict "ctx" . "name" "zitadel" "host" "zitadel" "port" 8080) | nindent 8 }}
        {{- include "swgw.waitForHTTP" (dict "ctx" . "name" "login-screens" "url" "http://zitadel-login:3000/ui/v2/login/healthy" "soft" true "timeout" 300) | nindent 8 }}
      containers:
        - name: proxy
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.nginx) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # The same entrypoint compose runs: it renders nginx's resolver from
          # /etc/resolv.conf and writes the rule naming who to ask on the
          # Account Not Found page.
          command: ["/bin/sh", "/entrypoint/docker-entrypoint.sh"]
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SUPPORT_CONTACT
              value: {{ default .Values.identity.bootstrapAdmin.email .Values.supportContact | quote }}
          readinessProbe:
            httpGet: {path: /debug/ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # TCP, not HTTP: every HTTP path here is proxied, so an HTTP probe
            # would restart the front door whenever ZITADEL was briefly
            # unavailable - which is when it is most needed.
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5; nginx -s quit"]
          resources:
            {{- toYaml .Values.identity.proxy.resources | nindent 12 }}
          securityContext:
            {{- include "swgw.nginxContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: entrypoint, mountPath: /entrypoint, readOnly: true}
            # The entrypoint renders the config into nginx's own directory,
            # because this mount is read-only.
            - {name: templates, mountPath: /etc/nginx/templates, readOnly: true}
      volumes:
        - name: entrypoint
          configMap:
            name: {{ $full }}-zitadel-proxy
            defaultMode: 0555
            items:
              - key: docker-entrypoint.sh
                path: docker-entrypoint.sh
        - name: templates
          configMap:
            name: {{ $full }}-zitadel-proxy
            items:
              - key: zitadel.conf
                path: zitadel.conf
{{- end }}
