# The shared good fixture.
#
# Every check in the shipped baseline runs against this, and it must produce
# ZERO failures. That is what makes "my new check has no false positives" a CI
# assertion rather than a claim by its author.
#
# It is deliberately a realistic release rather than a minimal one: a Service
# with a workload behind it, a PodDisruptionBudget, network policy, RBAC, a
# StatefulSet with persistent storage, a CronJob, and a custom resource with its
# own definition. A minimal fixture passes checks by not reaching them.
