apiVersion: softwaregateway.io/v1alpha1
kind: PolicyPack
metadata:
  name: sgw-baseline-metadata
  prefix: MTA
  version: 2.0.0
  description: >
    The names and notes attached to each object: whether the release can be
    found, grouped, reported on and upgraded.
  maintainer: platform-sre
  reference: docs/compliance/source-standards.md - 11. Metadata
spec:
  checks:
    - id: MTA-01
      title: Every workload can be identified by name
      description: >
        Every workload and Service carries the two standard identifying labels:
        app.kubernetes.io/name and app.kubernetes.io/instance.
      rationale: >
        These two are the ones other things depend on. Spreading rules, network
        rules, maintenance rules and Service selectors are all written against
        them, so a workload missing them cannot be targeted by any of those - and
        the failure is silent, because a rule that matches nothing looks exactly
        like a rule that is satisfied.
      severity: warn
      tier: 1
      category: Metadata
      subcategory: Standard labels
      keywords: [app.kubernetes.io/name, app.kubernetes.io/instance, labels, metadata.labels]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-01
      remediation: >
        Add the standard labels through the chart's shared labels helper, so
        every object gets them in one place.
      fixExample: |
        metadata:
          labels:
            app.kubernetes.io/name: my-service
            app.kubernetes.io/instance: my-release
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service, Job, CronJob]
      assert:
        required:
          - metadata.labels[app.kubernetes.io/name]
          - metadata.labels[app.kubernetes.io/instance]

    - id: MTA-09
      title: Workloads carry the labels reports and dashboards group by
      description: >
        Every workload and Service carries the four remaining standard labels:
        component, part-of, managed-by and version.
      rationale: >
        Nothing breaks without these, which is why they are recorded rather than
        warned about. What breaks is finding things: every dashboard, cost report
        and estate-wide query groups by them, so a release without them is
        invisible to all of it - and that is discovered during an incident, by
        somebody trying to work out what this release even is.
      severity: info
      tier: 1
      category: Metadata
      subcategory: Standard labels
      keywords: [app.kubernetes.io/component, app.kubernetes.io/part-of, app.kubernetes.io/managed-by, app.kubernetes.io/version, labels]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-01 (reporting labels)
      remediation: Add the remaining app.kubernetes.io labels in the chart's labels helper.
      fixExample: |
        metadata:
          labels:
            app.kubernetes.io/component: api
            app.kubernetes.io/part-of: my-platform
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/version: "1.4.2"
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service, Job, CronJob]
      assert:
        required:
          - metadata.labels[app.kubernetes.io/component]
          - metadata.labels[app.kubernetes.io/part-of]
          - metadata.labels[app.kubernetes.io/managed-by]
          - metadata.labels[app.kubernetes.io/version]

    - id: MTA-02
      title: Label values are ones Kubernetes will accept
      description: >
        Every label value is at most 63 characters and uses only the characters
        Kubernetes allows.
      rationale: >
        An invalid label is rejected when the release is installed, so this turns
        a failed installation in somebody else's cluster into a finding before it
        ships. There is no judgement in it: either the platform accepts the value
        or it refuses the whole object.
      severity: warn
      tier: 1
      category: Metadata
      subcategory: Label syntax
      keywords: [labels, metadata.labels, "RFC 1123", "63 characters", "invalid label"]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-02
      remediation: >
        Shorten the value, or move the content into an annotation, which has no
        such limit.
      fixExample: |
        metadata:
          labels:
            app.kubernetes.io/version: "1.4.2"          # short, valid
          annotations:
            example.com/build-description: "the long text goes here"
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service, Job, CronJob, ConfigMap, Secret]
        where: 'size(allLabels(self)) > 0'
      assert:
        expr: |
          allLabels(self).all(k,
            size(allLabels(self)[k]) <= 63 &&
            (allLabels(self)[k] == "" ||
             allLabels(self)[k].matches("^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$")))
        locus: metadata.labels
        expected: values of at most 63 characters, letters and digits with dashes, underscores and dots
        observed: |
          sorted(allLabels(self).filter(k, size(allLabels(self)[k]) > 63 ||
            (allLabels(self)[k] != "" &&
             !allLabels(self)[k].matches("^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$")))
            .map(k, k + "=" + allLabels(self)[k])).join(", ")

    - id: MTA-03
      title: Addressing uses names that do not change between releases
      description: >
        No workload, Service, network rule or maintenance rule selects on a label
        whose value changes with the version. Labels the platform assigns to
        identify an individual copy - a StatefulSet member's ordinal, for
        instance - are stable and are not reported.
      rationale: >
        A workload's own selector cannot be changed after it is created. A
        version in it means the next release cannot be upgraded at all: it can
        only be deleted and recreated, which for anything holding data means
        destroying its storage. This is discovered on the second release, in
        production, by whoever runs the upgrade.
      severity: block
      tier: 1
      category: Metadata
      subcategory: Selector labels
      keywords: [spec.selector, matchLabels, "immutable selector", app.kubernetes.io/version, helm.sh/chart, pod-template-hash]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: high
      reference: source-standards.md - MTA-03
      remediation: >
        Select on app.kubernetes.io/name and app.kubernetes.io/instance only, and
        put the version in the labels rather than in the selector.
      fixExample: |
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: my-service        # stable
              app.kubernetes.io/instance: my-release    # stable
          template:
            metadata:
              labels:
                app.kubernetes.io/name: my-service
                app.kubernetes.io/instance: my-release
                app.kubernetes.io/version: "1.4.2"      # a label, not a selector
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service, NetworkPolicy, PodDisruptionBudget]
      assert:
        expr: 'selectorKeys(self).all(k, !unstableLabelKey(k))'
        locus: spec.selector
        expected: selecting only on labels that stay the same between releases
        observed: '"selects on " + selectorKeys(self).filter(k, unstableLabelKey(string(k))).join(", ") + ", which changes with every release"'

    - id: MTA-04
      title: Notes on an object carry no credentials and are not enormous
      description: >
        No annotation value is over 8 kilobytes, and none is a credential written
        in plain text.
      rationale: >
        Annotations are readable by anybody who can read the object, which is a
        much wider group than can read a Secret. The size limit is not a
        preference: the platform caps the total size of an object's annotations,
        and an oversized one fails the installation.
      severity: warn
      tier: 1
      category: Metadata
      subcategory: Annotations
      keywords: [annotations, metadata.annotations, "8 KiB", credential, "size limit"]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-04
      remediation: >
        Move the value into a Secret and refer to it, or drop it.
      fixExample: |
        env:
          - name: API_TOKEN
            valueFrom:
              secretKeyRef: {name: my-service-api, key: token}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service, Job, CronJob, ConfigMap]
        where: 'value(self, "metadata.annotations") != null'
      assert:
        expr: |
          self.metadata.annotations.all(k,
            size(string(self.metadata.annotations[k])) <= 8192 &&
            !looksLikeCredential(k, string(self.metadata.annotations[k])))
        locus: metadata.annotations
        expected: no credential in an annotation, and none over 8 kilobytes
        observed: |
          sorted(self.metadata.annotations.filter(k,
            size(string(self.metadata.annotations[k])) > 8192 ||
            looksLikeCredential(k, string(self.metadata.annotations[k])))
            .map(k, size(string(self.metadata.annotations[k])) > 8192
                    ? k + " is " + string(size(string(self.metadata.annotations[k]))) + " bytes"
                    : k + " holds " + credentialClass(k, string(self.metadata.annotations[k]))))
            .join(", ")

    - id: MTA-05
      title: Custom labels carry a domain prefix
      description: >
        Label keys outside the well-known Kubernetes ones include a domain
        prefix.
      rationale: >
        An unprefixed key such as "version" or "team" collides with whatever else
        is installed in the namespace, and the collision is silent - one
        controller's label quietly becomes another's. Recorded rather than warned
        about, because the convention is not universal and several widely used
        charts predate it.
      severity: info
      tier: 1
      category: Metadata
      subcategory: Custom labels
      keywords: [labels, "domain prefix", "custom keys", metadata.labels]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-05
      remediation: 'Prefix custom keys with a domain the organization owns: acme.example/team.'
      fixExample: |
        metadata:
          labels:
            acme.example/team: platform-sre
            acme.example/cost-centre: "4417"
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Service]
        where: 'size(allLabels(self)) > 0'
      assert:
        expr: |
          allLabels(self).all(k,
            k.contains("/") ||
            k == "app" || k == "chart" || k == "release" || k == "heritage" || k == "component")
        locus: metadata.labels
        expected: a domain prefix on custom keys
        observed: |
          "unprefixed: " + sorted(allLabels(self).filter(k, !k.contains("/") &&
            k != "app" && k != "chart" && k != "release" && k != "heritage" && k != "component")).join(", ")

    - id: MTA-08
      title: One-off Helm tasks clean up after themselves and cannot run forever
      description: >
        Every object Helm runs as a task around install or upgrade also says when
        it should be removed, and task Jobs put a limit on retries and on total
        running time.
      rationale: >
        A task with no removal policy is still sitting there at the next upgrade,
        and Helm cannot create an object that already exists - so the SECOND
        upgrade fails, long after anybody tested the first. With no retry limit a
        failing task retries indefinitely and the upgrade never returns at all.
      severity: warn
      tier: 1
      category: Metadata
      subcategory: Helm hooks
      keywords: [helm.sh/hook, helm.sh/hook-delete-policy, backoffLimit, activeDeadlineSeconds, "hook Job", Helm]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - MTA-08
      remediation: >
        Add helm.sh/hook-delete-policy with before-hook-creation and
        hook-succeeded, and set backoffLimit and activeDeadlineSeconds on task
        Jobs.
      fixExample: |
        metadata:
          annotations:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        spec:
          backoffLimit: 2
          activeDeadlineSeconds: 600
      appliesTo:
        kinds: [Job, Pod, ConfigMap, Secret, ServiceAccount, Role, RoleBinding]
        annotations:
          helm.sh/hook: "*"
      assert:
        expr: |
          present(self, "metadata.annotations[helm.sh/hook-delete-policy]") &&
          (text(self, "kind") != "Job" ||
            (present(self, "spec.backoffLimit") && present(self, "spec.activeDeadlineSeconds")))
        locus: metadata.annotations[helm.sh/hook-delete-policy]
        expected: a removal policy, and bounded retries and running time on a task Job
        observed: |
          !present(self, "metadata.annotations[helm.sh/hook-delete-policy]")
            ? "no removal policy, so this object is still here at the next upgrade"
            : "no limit on retries or on how long the task may run"
