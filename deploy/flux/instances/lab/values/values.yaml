# yaml-language-server: $schema=../../../software/schema/values.schema.json
#
# LAB - only what differs from the chart's defaults.
#
# Every key not here is a chart default: `helm show values software-gateway`, or
# deploy/charts/software-gateway/values.yaml with the reasoning attached.
# Restating a default is a test failure, so this file answers one question -
# what is different here.
#
# The namespace is NOT here. It is a kustomize concern, written once in
# ../../kustomization.yaml.

supportContact: platform-team@example.internal

# THE TWO ADDRESSES A BROWSER USES. Two names on one private IP, served by the
# proxy this team already runs; the chart publishes nothing and that proxy is
# pointed at the `web` and `zitadel-proxy` Services.
#
# Two names rather than one with paths, because ZITADEL cannot serve under a path
# prefix and its address is stamped into every token's `iss`.
access:
  webUrl: https://gateway.lab.example.internal
  identityUrl: https://id.gateway.lab.example.internal

images:
  registry: contoso.azurecr.io
  mirror: contoso.azurecr.io/docker
  # Created by hand: `task flux:secrets -- lab` prints the command.
  pullSecrets: [registry-pull]

database:
  cluster:
    instances: 2
    storage: {size: 32Gi, className: managed-csi}
    walStorage: {size: 8Gi, className: managed-csi}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 2Gi}
    # With two instances a synchronous standby is the whole fleet, and a lab can
    # afford to lose the last few seconds.
    synchronousReplicas: 0

identity:
  # masterkey and rootPassword are generated on first install and read back on
  # every upgrade, so there is nothing to create.
  bootstrapAdmin:
    email: platform-team@example.internal
  # No single sign-on here: everybody in config/users/users.yaml signs in with
  # the password that file carries.
  zitadel: {replicas: 1}
  login: {replicas: 1}
  proxy: {replicas: 1}

cerbos:
  replicas: 1

# A lab is a place to read logs.
settings:
  SWGW_OBSERVABILITY_LOG_LEVEL: debug
