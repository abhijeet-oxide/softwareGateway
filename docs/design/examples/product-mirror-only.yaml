# ═══════════════════════════════════════════════════════════════════════════════
#  Product — a flow that is NOT the software flow
#
#  One team mirrors an upstream image into one internal repository. No external
#  landing zone, no lab, no promotion, no Quay, no scanning. The tool must not
#  make them carry any of it.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: softwaregateway.io/v1alpha2
kind: Product

metadata:
  name: openshift-cli
  owner: platform-tools

spec:
  # ONE stage. `mirror` is not a stage the site declared, so it is declared
  # here — verb, label and trigger included.
  pipeline:
    - stage: mirror
      target: internal
      action: download
      label: Mirror
      from: source
      trigger: auto

  sources:
    - name: upstream
      registry: quay-io
      repositories: ['openshift/cli']
      discovery:
        interval: 6h

  targets:
    - name: internal
      registry: artifactory
      repository: mirror/openshift-cli

  autoDownload:
    enabled: true
    rules:
      - name: stable
        tagPattern: '^4\.\d+$'

# The release page shows one button, `Mirror`, and never mentions onboarding or
# promotion — because this product has no second stage, not because anything
# was switched off.
