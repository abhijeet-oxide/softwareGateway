{{- if .Values.layers.application }}
{{- if and .Values.identity.enabled .Values.seed.enabled }}
{{- $full := include "swgw.fullname" . -}}
{{- $hash := include "swgw.identityHash" . -}}
{{/*
USER PROVISIONING, and the reason this is a Job with a hash in its name.

  IT RUNS WHEN THE PEOPLE CHANGE, AND NOT OTHERWISE. The name carries a hash of
  users.yaml, roles.yaml, the product names and the identity settings, so a
  release that only moved an image renders a Job that already exists and
  completed, and nothing runs.

  IT IS NOT A HELM HOOK. A hook would run on every upgrade and its failure would
  fail the release. A provisioning problem should be a failed Job somebody reads
  rather than a rolled-back deployment of unrelated code.

  IT RESTARTS NOTHING. Adding a person is ten seconds of a Job while every
  replica keeps serving. A REMOVAL is not instant: tokens are verified offline,
  so an issued one works until it expires.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-seed-%s" $full $hash | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "seed") | nindent 4 }}
  annotations:
    softwaregateway.io/identity-hash: {{ $hash | quote }}
spec:
  backoffLimit: {{ .Values.seed.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.seed.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "seed") | nindent 8 }}
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: {{ $full }}-seeder
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # HARD: the seeder authenticates with the machine token the setup hook
        # published and drives the management API.
        {{- include "swgw.waitForHTTP" (dict "ctx" . "name" "zitadel" "url" "http://zitadel:8080/debug/ready") | nindent 8 }}
      containers:
        - name: seed
          image: {{ include "swgw.mirroredImage" (dict "ctx" . "image" .Values.images.node) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # The middle step is byte for byte what `docker compose run --rm
            # zitadel-init` runs. The other two move its shared-volume outputs in
            # and out of a Secret, because a Job has no volume that outlives it.
            - |
              set -eu
              node /seeder/k8s-state.mjs pull
              node /seeder/bootstrap.mjs
              node /seeder/k8s-state.mjs push
          env:
            - {name: K8S_STATE_SECRET, value: {{ $full }}-state}
            - {name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
            - {name: ZITADEL_INTERNAL_URL, value: "http://zitadel:8080"}
            - {name: ZITADEL_HOST_HEADER, value: {{ include "swgw.identityHostHeader" . | quote }}}
            - {name: ZITADEL_PUBLIC_URL, value: {{ include "swgw.identityUrl" . | quote }}}
            - {name: WEB_PUBLIC_URL, value: {{ include "swgw.webUrl" . | quote }}}
            - {name: GATEWAY_TENANT, value: {{ .Values.tenant | quote }}}
            - {name: GATEWAY_CONFIG_DIR, value: /config}
            - {name: BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.identity.bootstrapAdmin.username | quote }}}
            - {name: BOOTSTRAP_ADMIN_EMAIL, value: {{ .Values.identity.bootstrapAdmin.email | quote }}}
            - {name: BOOTSTRAP_ADMIN_FIRST_NAME, value: {{ .Values.identity.bootstrapAdmin.firstName | quote }}}
            - {name: BOOTSTRAP_ADMIN_LAST_NAME, value: {{ .Values.identity.bootstrapAdmin.lastName | quote }}}
{{- if or .Values.identity.bootstrapAdmin.password .Values.identity.bootstrapAdmin.existingSecret }}
            # The seeder REFUSES to run with this set while SSO is configured,
            # so the local shortcut cannot follow you into production.
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-identity" $full) .Values.identity.bootstrapAdmin.existingSecret }}
                  key: adminPassword
{{- end }}
            - {name: SSO_ISSUER, value: {{ .Values.identity.sso.issuer | quote }}}
            - {name: SSO_CLIENT_ID, value: {{ .Values.identity.sso.clientId | quote }}}
{{- if .Values.identity.sso.existingSecret }}
            # NEVER FROM VALUES. A client secret in a values file is a client
            # secret in Git, in the HelmRelease, and in `helm get values`.
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.sso.existingSecret }}
                  key: {{ .Values.identity.sso.clientSecretKey }}
{{- end }}
            - {name: SSO_DISPLAY_NAME, value: {{ .Values.identity.sso.displayName | quote }}}
            - {name: SSO_ALLOW_PASSWORD_LOGIN, value: {{ .Values.identity.sso.allowPasswordLogin | quote }}}
            - {name: LOGIN_REQUIRE_MFA, value: {{ .Values.identity.sso.requireMfa | quote }}}
            - {name: ACCESS_TOKEN_LIFETIME, value: {{ .Values.identity.tokenLifetimes.accessToken | quote }}}
            - {name: ID_TOKEN_LIFETIME, value: {{ .Values.identity.tokenLifetimes.idToken | quote }}}
            - {name: REFRESH_TOKEN_IDLE, value: {{ .Values.identity.tokenLifetimes.refreshTokenIdle | quote }}}
            - {name: REFRESH_TOKEN_MAX, value: {{ .Values.identity.tokenLifetimes.refreshTokenMax | quote }}}
            - {name: BRANDING_PRIMARY_COLOR, value: {{ .Values.identity.branding.primaryColor | quote }}}
            - {name: BRANDING_PRIMARY_COLOR_DARK, value: {{ .Values.identity.branding.primaryColorDark | quote }}}
            - {name: BRANDING_LANGUAGES, value: {{ .Values.identity.branding.languages | quote }}}
            # Who the worker credentials are written for. The chown is a no-op
            # here - a Secret volume is owned by root - and the value is kept so
            # the two stacks agree.
            - {name: WORKER_UID, value: "65532"}
            - {name: WORKER_ROTATE_SECRET, value: {{ ternary "yes" "" .Values.seed.rotateWorkerSecret | quote }}}
          resources:
            {{- toYaml .Values.seed.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: seeder, mountPath: /seeder, readOnly: true}
            - {name: branding, mountPath: /branding, readOnly: true}
            # The administrator's directory, reassembled at the paths the
            # seeder reads: /config/users, /config/access, /config/products.
            - {name: identity, mountPath: /config/users/users.yaml, subPath: users.yaml, readOnly: true}
            - {name: identity, mountPath: /config/access/roles.yaml, subPath: roles.yaml, readOnly: true}
            - {name: products, mountPath: /config/products, readOnly: true}
            # The shared volumes, for the length of one Job.
            - {name: state, mountPath: /pat}
            - {name: oidc, mountPath: /oidc}
            - {name: workercreds, mountPath: /workercreds}
      volumes:
        - name: seeder
          configMap:
            name: {{ $full }}-seeder
            defaultMode: 0444
        - name: branding
          configMap:
            name: {{ $full }}-branding
            defaultMode: 0444
        - name: identity
          configMap:
            name: {{ $full }}-identity
        - name: products
          configMap:
            name: {{ $full }}-products
        # Memory-backed: a machine token and a client secret pass through here
        # and must not touch a node's disk.
        - name: state
          emptyDir: {medium: Memory}
        - name: oidc
          emptyDir: {medium: Memory}
        - name: workercreds
          emptyDir: {medium: Memory}
{{- end }}
{{- if .Values.identity.enabled }}
{{/*
THE SEEDER'S IDENTITY, AND WHY IT IS A HOOK TOO.

Helm applies every hook before the release's own resources, and the ZITADEL
setup hook authenticates as this account. As an ordinary resource it would not
exist yet, and the hook would fail naming a ServiceAccount rather than the
ordering that caused it. Recreating these on every install is safe: they hold no
state, and only two short-lived Jobs use them.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swgw.fullname" . }}-seeder
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "seed") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- include "swgw.imagePullSecrets" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "swgw.fullname" . }}-seeder
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "seed") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  # ONE SECRET, BY NAME, IN ONE NAMESPACE - the cluster's replacement for the
  # patshare, oidcshare and workercreds volumes in docker-compose.yml.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-state" (include "swgw.fullname" .) | quote }}]
    verbs: ["get", "patch"]
  # `create` cannot be limited to a resource name: the RBAC API has nothing to
  # match against before the object exists. That is why this account is used by
  # two short-lived Jobs and by nothing that keeps running.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "swgw.fullname" . }}-seeder
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "seed") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "swgw.fullname" . }}-seeder
subjects:
  - kind: ServiceAccount
    name: {{ include "swgw.fullname" . }}-seeder
{{- end }}
{{- end }}
