name: Toolchain
description: >-
  Go, and whichever of Task, Helm, kustomize, kubeconform and golangci-lint the
  job asks for. Released binaries rather than `go install`, because compiling
  golangci-lint from source costs about two minutes per job and this is eight
  jobs.

inputs:
  go-version:
    description: The Go toolchain
    required: true
  task:
    description: Install the Task CLI
    default: 'false'
  helm:
    default: 'false'
  kustomize:
    default: 'false'
  kubeconform:
    default: 'false'
  golangci-lint:
    description: >-
      Install golangci-lint. It refuses to run when built with a Go older than
      go.mod targets, so this version and GO_VERSION move together.
    default: 'false'
  mirror:
    description: >-
      A base URL to take the released binaries from instead of github.com and
      get.helm.sh, for a runner with no route to either. Each archive is
      fetched as <mirror>/<filename> - the file names below are already
      versioned and distinct, so the mirror is a flat directory. Empty, the
      default, fetches from upstream exactly as before.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    # GO HAS NO CREDENTIAL SETTING, and that is the whole reason this step
    # exists. GOPROXY_USERNAME and GOPROXY_TOKEN are read from the environment
    # rather than taken as inputs, because that is where GOPROXY itself is set:
    # one block per workflow configures the module network, instead of a pair
    # of lines repeated at every one of this action's call sites.
    # A module mirror that wants a credential gets it from a netrc and from
    # nothing else, so pointing GOPROXY at an authenticated Artifactory without
    # one fails every fetch with a 401 that names no setting to change.
    #
    # The alternative is credentials in the GOPROXY URL itself. It works and it
    # leaks: that URL is printed by `go env`, quoted back in module errors, and
    # inherited by every child process.
    - name: Authenticate the module mirror
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${GOPROXY_TOKEN:-}" ]; then
          echo "no module mirror credential; Go fetches anonymously"
          exit 0
        fi
        if [ -z "${GOPROXY_USERNAME:-}" ]; then
          echo "::error::a module mirror token was given with no username. Pass both, or neither."
          exit 1
        fi
        echo "::add-mask::$GOPROXY_TOKEN"

        # Every host the Go fetches could reach, from the URLs already
        # configured. GOPROXY is a list separated by "," or "|"; `direct` and
        # `off` are not URLs, and GOSUMDB is a name that may carry one after a
        # `+`. Credentials already embedded in a URL are stripped before the
        # host is read.
        hosts=$(printf '%s\n' "${GOPROXY:-}" "${GOSUMDB:-}" "${GOVULNDB:-}" \
          | tr ',|+' '\n\n\n' \
          | sed -n 's#^[[:space:]]*https\{0,1\}://##p' \
          | sed 's#[?/].*##; s#^[^@]*@##' \
          | sort -u)

        # A CREDENTIAL FOR AN INTERNAL MIRROR IS NEVER WRITTEN FOR A PUBLIC
        # HOST. With GOPROXY left at its default this step would otherwise put
        # the organisation's token in a netrc for proxy.golang.org, and Go
        # would send it there.
        netrc="$RUNNER_TEMP/netrc-toolchain"
        umask 077
        : > "$netrc"
        wrote=
        for host in $hosts; do
          case "$host" in
            proxy.golang.org|sum.golang.org|vuln.go.dev|*.googleapis.com|goproxy.io)
              echo "skipping $host: a public host gets no credential"
              continue
              ;;
          esac
          {
            echo "machine $host"
            echo "  login $GOPROXY_USERNAME"
            echo "  password $GOPROXY_TOKEN"
          } >> "$netrc"
          wrote="$wrote $host"
        done

        if [ -z "$wrote" ]; then
          rm -f "$netrc"
          echo "no private host among GOPROXY, GOSUMDB and GOVULNDB; nothing to authenticate"
          exit 0
        fi

        # NETRC, not ~/.netrc: Go reads this variable first, and a self-hosted
        # runner's home directory outlives the job.
        echo "NETRC=$netrc" >> "$GITHUB_ENV"
        echo "authenticated as $GOPROXY_USERNAME for:$wrote"

    - name: Install tools
      shell: bash
      env:
        TASK_VERSION: "3.45.4"
        HELM_VERSION: "3.21.3"
        KUSTOMIZE_VERSION: "5.7.1"
        KUBECONFORM_VERSION: "0.6.7"
        GOLANGCI_VERSION: "2.13.2"
        MIRROR: ${{ inputs.mirror }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/bin"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"

        # Three attempts each: a registry hiccup must not fail a build, and a
        # download that is genuinely gone must not retry forever.
        #
        # With MIRROR set, only the host and path change - the file name, the
        # retries and the failure message are the same, so a mirror that is
        # missing an archive reports the same way a bad version does.
        fetch() {
          url="$1"
          if [ -n "${MIRROR:-}" ]; then
            url="${MIRROR%/}/$(basename "$1")"
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "$2"; then
              return 0
            fi
            echo "download failed ($attempt/3): $url"
            sleep 5
          done
          echo "::error::could not download $url"
          return 1
        }

        if [ "${{ inputs.task }}" = "true" ]; then
          fetch "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz" /tmp/task.tgz
          tar -xzf /tmp/task.tgz -C "$bin" task
        fi

        if [ "${{ inputs.helm }}" = "true" ]; then
          fetch "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm "$bin/helm"
        fi

        if [ "${{ inputs.kustomize }}" = "true" ]; then
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" /tmp/kustomize.tgz
          tar -xzf /tmp/kustomize.tgz -C "$bin" kustomize
        fi

        if [ "${{ inputs.kubeconform }}" = "true" ]; then
          fetch "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" /tmp/kubeconform.tgz
          tar -xzf /tmp/kubeconform.tgz -C "$bin" kubeconform
        fi

        if [ "${{ inputs.golangci-lint }}" = "true" ]; then
          fetch "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_VERSION}/golangci-lint-${GOLANGCI_VERSION}-linux-amd64.tar.gz" /tmp/lint.tgz
          tar -xzf /tmp/lint.tgz -C /tmp "golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint"
          mv "/tmp/golangci-lint-${GOLANGCI_VERSION}-linux-amd64/golangci-lint" "$bin/golangci-lint"
        fi

        chmod +x "$bin"/* 2>/dev/null || true
        ls "$bin"
