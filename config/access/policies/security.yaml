apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: security_report
  importDerivedRoles: [gateway_common]
  rules:
    # org-security is the whole reason this tier exists: security detail for
    # every product in the tenant, including products added later.
    - actions: ["view", "export"]
      effect: EFFECT_ALLOW
      derivedRoles: [org_wide_security]
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles: [product_reader]
