# One of the ESTATE resources: the things that belong to the deployment rather
# than to any one product.
#
# THERE IS NO PRODUCT TIER on most of them, and that is the point rather than an
# omission. A fleet is a fleet; the rulebook is what WILL be checked, which a
# vendor asking before they ship has no release to point at yet. A caller
# holding only product roles is refused, because the alternative is handing them
# the whole estate so they can see their corner of it.
#
# The audit trail is the exception that proves the rule: it CAN be narrowed,
# the handler narrows it by product, so a product reader may view it and sees
# only their own products' events.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: audit_event
  importDerivedRoles: [gateway_common]
  rules:
    # org-security first: reading this is the whole reason that tier exists.
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles: [org_wide_security, org_wide_reader, product_reader]
