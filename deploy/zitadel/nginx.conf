# ZITADEL's front door.
#
# Since v3, ZITADEL's login screen is NOT served by the ZITADEL binary. It was
# split out into a standalone Next.js service (ghcr.io/zitadel/zitadel-login),
# and a proxy in front of both is how the two become one identity provider:
#
#   /ui/v2/login/*  -> zitadel-login:3000   the sign-in screens
#   everything else -> zitadel:8080         the APIs and the admin console
#
# Without it, a browser sent to sign in asks the core API for a page it does
# not own and gets `{"code":5,"message":"Not Found"}` - a bare gRPC NOT_FOUND
# where a login form should be. That is not a theoretical failure: the core
# redirects to `/ui/v2/login/login?authRequest=...` by DEFAULT on v4.
#
# ONE ORIGIN, and that is the whole reason this file exists rather than a
# second published port for the login service. The core's redirect to the
# login screen is RELATIVE, the login screen's redirect back into the core is
# absolute-from-ZITADEL's-own-external-URL, and every other part of this stack
# (SWGW_AUTH_ISSUER, the seeder's Host header, the SPA's issuer) already agrees
# on a single ZITADEL address. Splitting the login UI onto its own port would
# make that four things to keep in step instead of one.
server {
    listen 80;
    server_name _;

    # An access token carrying org-wide roles does not fit the 4k/8k defaults,
    # and the failure is a 400 from the proxy rather than anything ZITADEL says.
    # Same reason as deploy/web/nginx.conf.
    large_client_header_buffers 4 32k;

    # Resolve upstreams PER REQUEST. See deploy/web/nginx.conf for the full
    # reasoning: a literal hostname is resolved once at parse time, so this
    # container would refuse to start before ZITADEL does and would proxy to a
    # dead address after ZITADEL is replaced. The resolver's own address is
    # filled in at container start because Docker's and Podman's differ.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;

    # ZITADEL identifies its instance by the Host header and answers 404 to a
    # name it does not know, so the browser's Host is passed through untouched
    # to both upstreams. This is the same fact deploy/zitadel/bootstrap.mjs
    # sets a Host header for.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /ui/v2/login {
        set $login http://zitadel-login:3000;
        proxy_pass $login;
    }

    location / {
        set $core http://zitadel:8080;
        proxy_pass $core;
        # The console streams; buffering it delays the screen for no gain.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
