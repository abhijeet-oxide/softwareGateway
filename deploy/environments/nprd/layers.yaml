apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: software-gateway-lab-database
  namespace: flux-system
spec:
  # DEPLOY THE OPERATOR FIRST. This submits kind `Cluster`, which needs CloudNativePG
  dependsOn:
    - name: platform-operators
  interval: 10m
  retryInterval: 1m
  path: ./deploy/environments/nprd/database
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: software-gateway
    namespace: flux-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: swgw-db
      namespace: swgw-lab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: software-gateway-nprd-platform
  namespace: flux-system
spec:
  dependsOn:
    - name: software-gateway-nprd-database
  interval: 10m
  retryInterval: 1m
  path: ./deploy/environments/nprd/platform
  prune: true
  wait: true
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: software-gateway
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: software-gateway
      namespace: swgw-lab
