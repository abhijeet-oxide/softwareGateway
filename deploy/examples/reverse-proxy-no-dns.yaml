# yaml-language-server: $schema=../charts/software-gateway/values.schema.json
#
# ONE NGINX IN FRONT, ONE PRIVATE IP, A SELF-SIGNED CERTIFICATE, NO DNS.
#
# The shape of most internal labs: nothing is publicly resolvable, there is no
# certificate authority anybody trusts, and the whole external surface is one
# address on the corporate network.
#
# The chart publishes nothing (`expose.type: none`) - every Service stays
# ClusterIP and your nginx is the only way in. What the chart still needs to know
# is what a BROWSER types, because that string is stamped into every token's
# `iss` and is the Host header ZITADEL matches against.
#
# TWO ORIGINS ON ONE IP, by port. They cannot share one: ZITADEL owns paths the
# application also uses, and the identity address is stamped into tokens.
#
#   https://10.20.30.40        the Software Gateway UI
#   https://10.20.30.40:8443   the sign-in screens and the ZITADEL console
#
# The nginx that serves them is at the bottom of this file.

supportContact: platform-team@example.internal

access:
  # https, because that is what the BROWSER speaks to nginx. ZITADEL still serves
  # plain HTTP behind it - `--tlsMode disabled` - and that is a different
  # question. What must not happen is claiming https here while nginx serves
  # http: the coordinator checks the scheme in the token's issuer and refuses
  # every sign-in, with everything else green.
  scheme: https
  web:
    host: 10.20.30.40
    port: 443
  identity:
    host: 10.20.30.40
    port: 8443
  expose:
    # Nothing rendered. Your nginx reaches the Services by name inside the
    # cluster, and its own Service is what holds the private IP.
    #
    # For an nginx OUTSIDE the cluster, use `nodePort` instead and point it at
    # <node ip>:<port>; `access.*.port` is then the port the browser uses and
    # `expose.nodePort.*` the port on the node.
    type: none

image:
  registry: contoso.azurecr.io
images:
  mirror: contoso.azurecr.io/docker

imagePullSecrets:
  - registry-pull

# PostgreSQL in this namespace, run by the CloudNativePG operator. `database.host`
# and `database.existingSecret` are derived from the cluster's name, and the
# password is generated by the operator - it is in no values file and nothing
# rotates it by hand.
database:
  cluster:
    instances: 2
    image: contoso.azurecr.io/docker/cloudnative-pg/postgresql:16.10
    storage: {size: 32Gi, className: managed-csi}
    walStorage: {size: 8Gi, className: managed-csi}
    synchronousReplicas: 0

identity:
  # masterkey and rootPassword are generated on first install and read back from
  # the cluster on every upgrade. Nothing to create.
  bootstrapAdmin:
    email: platform-team@example.internal
  zitadel: {replicas: 1}
  login: {replicas: 1}
  proxy: {replicas: 1}

cerbos:
  replicas: 1

# ---------------------------------------------------------------------------
# THE NGINX IN FRONT. Not part of this chart - it is yours, and this is the
# configuration that works with the values above.
#
#   kubectl -n <namespace> create secret tls gateway-tls \
#     --cert=tls.crt --key=tls.key
#
# ---------------------------------------------------------------------------
# server {
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/tls/tls.crt;
#   ssl_certificate_key /etc/nginx/tls/tls.key;
#
#   location / {
#     proxy_pass http://web;
#
#     # $http_host, not $host: it preserves the PORT the browser sent, and both
#     # upstreams match on the whole thing.
#     proxy_set_header Host              $http_host;
#     proxy_set_header X-Forwarded-Proto https;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#
#     # Transfers stream and the UI long-polls.
#     proxy_read_timeout   3600;
#     proxy_request_buffering off;
#     client_max_body_size 0;
#   }
# }
#
# server {
#   listen 8443 ssl;
#   ssl_certificate     /etc/nginx/tls/tls.crt;
#   ssl_certificate_key /etc/nginx/tls/tls.key;
#
#   location / {
#     proxy_pass http://zitadel-proxy;
#     proxy_set_header Host              $http_host;
#     proxy_set_header X-Forwarded-Proto https;
#     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#
#     # A privileged user's token carries org-wide roles and does not fit the
#     # default header buffers. Without this the sign-in returns a 400 the
#     # application never sees.
#     proxy_buffer_size 32k;
#     proxy_buffers     8 32k;
#     proxy_read_timeout 3600;
#   }
# }
# ---------------------------------------------------------------------------
#
# A SELF-SIGNED CERTIFICATE IS FINE HERE, with one thing to know: a browser
# warns once per ORIGIN, and these are two origins. Somebody signing in for the
# first time accepts the warning on :443, is redirected to :8443, and accepts it
# again. Nothing inside the cluster is affected - the coordinator fetches
# ZITADEL's keys over plain HTTP at `zitadel:8080` and never sees this
# certificate.
