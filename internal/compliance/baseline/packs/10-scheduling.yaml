apiVersion: softwaregateway.io/v1alpha1
kind: PolicyPack
metadata:
  name: sgw-baseline
  prefix: SCH
  version: 2.0.0
  description: >
    Where copies of a service are allowed to run. These checks are about
    surviving the loss of one server, one rack or one data-centre zone, and
    about not painting a service into a corner it cannot be moved out of.
  maintainer: platform-sre
  reference: docs/compliance/source-standards.md - 1. Scheduling & Placement
spec:
  checks:
    - id: SCH-01
      title: Copies of a service are spread across servers and zones
      description: >
        A service running two or more copies tells the platform to place them on
        different servers, and in different data-centre zones.
      rationale: >
        Running a second copy only helps if the two copies cannot fail together.
        With no spreading rule the platform is free to put every copy on one
        server, so the service costs twice as much and survives exactly as much
        as one copy did. Nobody finds out until that server fails.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-01
      remediation: >
        Add topologySpreadConstraints - the field that tells the platform how to
        spread copies - for topology.kubernetes.io/zone and
        kubernetes.io/hostname, with whenUnsatisfiable set to ScheduleAnyway so
        a busy cluster still places the pods.
      fixExample: |
        spec:
          template:
            spec:
              topologySpreadConstraints:
                - topologyKey: topology.kubernetes.io/zone
                  maxSkew: 1
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: my-service
                - topologyKey: kubernetes.io/hostname
                  maxSkew: 1
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: my-service
      appliesTo:
        kinds: [Deployment, StatefulSet]
        where: 'replicas(self) >= 2'
      assert:
        expr: |
          value(self, "spec.template.spec.topologySpreadConstraints") != null &&
          self.spec.template.spec.topologySpreadConstraints.exists(c, c.topologyKey == "topology.kubernetes.io/zone") &&
          self.spec.template.spec.topologySpreadConstraints.exists(c, c.topologyKey == "kubernetes.io/hostname")
        locus: spec.template.spec.topologySpreadConstraints
        expected: spreading rules for both the data-centre zone and the server
        observed: |
          value(self, "spec.template.spec.topologySpreadConstraints") == null
            ? "no spreading rules at all"
            : "spreads only across " +
              self.spec.template.spec.topologySpreadConstraints.map(c, string(c.topologyKey)).join(" and ")
        message: |
          text(self, "metadata.name") + " runs " + string(replicas(self)) +
          " copies, and nothing stops the platform putting them all on the same server. " +
          (value(self, "spec.template.spec.topologySpreadConstraints") == null
            ? "The chart declares no spreading rules."
            : "Its spreading rules cover only " +
              self.spec.template.spec.topologySpreadConstraints.map(c, string(c.topologyKey)).join(" and ") + ".")

    - id: SCH-02
      title: Spreading rules actually even the copies out
      description: >
        Where a chart spreads copies across zones or servers, it allows a
        difference of at most one copy between them.
      rationale: >
        The allowed difference is what makes a spreading rule mean anything. Set
        higher than one, the rule permits exactly the pile-up it was added to
        prevent: it is present, it passes review, and it does nothing.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-02
      remediation: Set maxSkew to 1 on the zone and server spreading rules.
      fixExample: |
        topologySpreadConstraints:
          - topologyKey: kubernetes.io/hostname
            maxSkew: 1
            whenUnsatisfiable: ScheduleAnyway
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet]
        where: 'value(self, "spec.template.spec.topologySpreadConstraints") != null'
      assert:
        expr: |
          self.spec.template.spec.topologySpreadConstraints.all(c,
            (c.topologyKey != "topology.kubernetes.io/zone" && c.topologyKey != "kubernetes.io/hostname")
            || int(value(c, "maxSkew")) == 1)
        locus: spec.template.spec.topologySpreadConstraints[].maxSkew
        expected: a difference of at most one copy (maxSkew 1) between zones and between servers
        observed: |
          self.spec.template.spec.topologySpreadConstraints
            .filter(c, (c.topologyKey == "topology.kubernetes.io/zone" || c.topologyKey == "kubernetes.io/hostname")
                       && int(value(c, "maxSkew")) != 1)
            .map(c, string(c.topologyKey) + " allows a gap of " + string(value(c, "maxSkew")))
            .join(", ")

    - id: SCH-03
      title: Placement rules leave the platform somewhere to put a copy
      description: >
        A workload does not stack three strict placement demands at once: a
        required server type, a required separation from its own copies, and a
        spreading rule that refuses to place a copy rather than bend.
      rationale: >
        Each demand on its own is sensible. Together they can leave no legal
        place for a copy to run, so the moment one server is taken out for
        patching a copy is stuck waiting and never starts. The more rules were
        added to protect the service, the more thoroughly it is stuck.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-03
      remediation: >
        Relax one of the three. Usually the spreading rule: set
        whenUnsatisfiable to ScheduleAnyway so it is a preference rather than a
        refusal.
      fixExample: |
        topologySpreadConstraints:
          - topologyKey: kubernetes.io/hostname
            maxSkew: 1
            whenUnsatisfiable: ScheduleAnyway   # a preference, not a refusal
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet]
        containers: none
      assert:
        expr: |
          !(present(self, "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution")
            && present(self, "spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution")
            && value(self, "spec.template.spec.topologySpreadConstraints") != null
            && self.spec.template.spec.topologySpreadConstraints.exists(c, value(c, "whenUnsatisfiable") == "DoNotSchedule"))
        locus: spec.template.spec.affinity
        expected: at most two strict placement demands, so the platform keeps somewhere to put a copy
        observed: '"a required server type, required separation from its own copies, and a spreading rule that refuses to place"'

    - id: SCH-04
      title: Spreading rules use names that do not change between releases
      description: >
        The labels a spreading or separation rule matches on are ones whose
        value stays the same from one release to the next.
      rationale: >
        A rule that matches on the software version only ever sees copies of the
        version being installed. During an upgrade, when old and new copies are
        both running and the risk is highest, the rule spreads the new copies
        against each other and ignores the old ones - so there is effectively no
        rule at exactly the moment it was needed.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-04
      remediation: >
        Match on app.kubernetes.io/name and app.kubernetes.io/instance, which
        identify the service rather than the release.
      fixExample: |
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: my-service
            app.kubernetes.io/instance: my-release
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet]
        where: 'value(self, "spec.template.spec.topologySpreadConstraints") != null'
      assert:
        expr: |
          self.spec.template.spec.topologySpreadConstraints.all(c,
            value(c, "labelSelector.matchLabels") == null ||
            c.labelSelector.matchLabels.all(k, !unstableLabelKey(k)))
        locus: spec.template.spec.topologySpreadConstraints[].labelSelector
        expected: labels that identify the service, not the release
        observed: |
          self.spec.template.spec.topologySpreadConstraints
            .filter(c, value(c, "labelSelector.matchLabels") != null &&
                       c.labelSelector.matchLabels.exists(k, unstableLabelKey(k)))
            .map(c, sorted(c.labelSelector.matchLabels.filter(k, unstableLabelKey(k))).join(", "))
            .join("; ")

    - id: SCH-05
      title: The chart does not name specific data-centre zones
      description: >
        A strict server requirement does not list zone names such as "eu-west-1a"
        as literal values.
      rationale: >
        Zone names belong to the cluster, not to the software. A chart that names
        them cannot be installed anywhere whose zones are called something else,
        and the failure happens at install time in somebody else's data centre,
        where the person running it cannot fix the chart.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-05
      remediation: >
        Express zone distribution with a spreading rule, which names the kind of
        boundary (topology.kubernetes.io/zone) rather than the individual zones.
      fixExample: |
        topologySpreadConstraints:
          - topologyKey: topology.kubernetes.io/zone   # the boundary, not its names
            maxSkew: 1
            whenUnsatisfiable: ScheduleAnyway
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet]
        where: 'present(self, "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution")'
      assert:
        expr: |
          self.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
            .nodeSelectorTerms.all(t,
              value(t, "matchExpressions") == null ||
              t.matchExpressions.all(e, value(e, "key") != "topology.kubernetes.io/zone"))
        locus: spec.template.spec.affinity.nodeAffinity
        expected: no strict requirement naming individual zones
        observed: '"a strict server requirement matches on topology.kubernetes.io/zone"'

    # ------------------------------------------------------------------
    # Running on a server that has reported trouble.
    #
    # A server can put up a sign saying "stay away". A chart can overrule that
    # sign. The two checks below split those signs by what the server means,
    # because the right answer differs:
    #
    #   "I am out of memory / out of disk / being drained" means the server is
    #   ALREADY in trouble. A service that overrules this is placed on a server
    #   that has said it cannot take any more work, which makes the trouble
    #   worse and takes the service down with the server. There are real
    #   exceptions - an agent that has to run everywhere to collect logs off a
    #   failing server is the obvious one - and an exception nobody wrote down
    #   is indistinguishable from a mistake. So it is allowed, and it has to be
    #   declared.
    #
    #   "I have stopped answering" is different. Overruling that is ordinary and
    #   often right: moving every copy the instant a server misses one heartbeat
    #   causes a restart storm out of a network blip. What is not right is
    #   overruling it FOREVER, which is what leaving out the time limit means.
    # ------------------------------------------------------------------

    - id: SCH-08
      title: Running on a server that reported trouble is a stated choice
      description: >
        A workload that agrees to run on a server reporting low memory, low disk,
        no process slots, no network or "being drained" carries an annotation -
        compliance.softwaregateway.io/toleration-rationale - saying why. A blanket
        agreement with no conditions covers all of them and counts here too.
      rationale: >
        These signs are the server reporting its own condition. Agreeing to them
        does not make the server healthy; it makes the platform put work on a
        server that has already said it cannot take any, so the service lands on
        a machine out of memory and goes down with it. Some workloads genuinely
        must run there, which is why this asks for a sentence rather than
        forbidding it outright.
      severity: block
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-08
      remediation: >
        Remove the toleration, or annotate the workload - or its pod template -
        with compliance.softwaregateway.io/toleration-rationale, saying which
        condition is being overruled and why this workload has to run on a server
        in that state.
      fixExample: |
        metadata:
          annotations:
            compliance.softwaregateway.io/toleration-rationale: >
              Log collector: must keep running on a node under disk pressure,
              because that is when its output matters most.
      appliesTo:
        subject: podSpec
        where: 'value(self, "tolerations") != null'
      assert:
        expr: |
          !self.tolerations.exists(t,
            (text(t, "effect") == "" || text(t, "effect") == "NoSchedule") &&
            (text(t, "key") == "" ||
             text(t, "key") in ["node.kubernetes.io/memory-pressure",
                                "node.kubernetes.io/disk-pressure",
                                "node.kubernetes.io/pid-pressure",
                                "node.kubernetes.io/network-unavailable",
                                "node.kubernetes.io/unschedulable"]))
          ||
          ("compliance.softwaregateway.io/toleration-rationale" in allAnnotations(owner) &&
           size(allAnnotations(owner)["compliance.softwaregateway.io/toleration-rationale"]) > 0)
        locus: tolerations
        expected: no agreement to run on a server in trouble, or a written reason for one
        observed: |
          "agrees to run on a server reporting: " +
          self.tolerations.filter(t,
            (text(t, "effect") == "" || text(t, "effect") == "NoSchedule") &&
            (text(t, "key") == "" ||
             text(t, "key") in ["node.kubernetes.io/memory-pressure",
                                "node.kubernetes.io/disk-pressure",
                                "node.kubernetes.io/pid-pressure",
                                "node.kubernetes.io/network-unavailable",
                                "node.kubernetes.io/unschedulable"]))
            .map(t, text(t, "key") == "" ? "any condition at all" : text(t, "key")).join(", ") +
          "; no written reason"
        message: |
          text(owner, "kind") + " " + text(owner, "metadata.name") +
          " agrees to run on a server that has reported " +
          self.tolerations.filter(t,
            (text(t, "effect") == "" || text(t, "effect") == "NoSchedule") &&
            (text(t, "key") == "" ||
             text(t, "key") in ["node.kubernetes.io/memory-pressure",
                                "node.kubernetes.io/disk-pressure",
                                "node.kubernetes.io/pid-pressure",
                                "node.kubernetes.io/network-unavailable",
                                "node.kubernetes.io/unschedulable"]))
            .map(t, text(t, "key") == "" ? "any problem at all" : text(t, "key")).join(", ") +
          ", and the chart does not say why it has to run there. Without a stated reason " +
          "this cannot be told apart from a copied-in mistake."

    - id: SCH-09
      title: Waiting for an unresponsive server has a time limit
      description: >
        Where a chart says its copies may stay on a server that has stopped
        answering, it also says for how long.
      rationale: >
        With no time limit the agreement never expires, so a copy stays attached
        to a dead server - not moved, not restarted, and still counted as a
        healthy copy by everything that reads the service. Kubernetes supplies a
        five-minute limit when a chart says nothing at all; writing the agreement
        without a limit REPLACES that five minutes with "forever", which is the
        opposite of what the author almost always meant.
      severity: warn
      tier: 1
      category: Scheduling & Placement
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - SCH-09
      remediation: >
        Add tolerationSeconds to the not-ready and unreachable tolerations - 300
        is the Kubernetes default and a reasonable starting point - or drop the
        tolerations entirely and let the default apply.
      fixExample: |
        tolerations:
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 300
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 300
      appliesTo:
        subject: podSpec
        where: 'value(self, "tolerations") != null'
      assert:
        expr: |
          self.tolerations.all(t,
            !((text(t, "effect") == "" || text(t, "effect") == "NoExecute") &&
              (text(t, "key") == "" ||
               text(t, "key") in ["node.kubernetes.io/not-ready",
                                  "node.kubernetes.io/unreachable"]))
            || value(t, "tolerationSeconds") != null)
        locus: tolerations[].tolerationSeconds
        expected: a time limit (tolerationSeconds) on every agreement to stay on an unresponsive server
        observed: |
          self.tolerations.filter(t,
            (text(t, "effect") == "" || text(t, "effect") == "NoExecute") &&
            (text(t, "key") == "" ||
             text(t, "key") in ["node.kubernetes.io/not-ready",
                                "node.kubernetes.io/unreachable"]) &&
            value(t, "tolerationSeconds") == null)
            .map(t, (text(t, "key") == "" ? "any unresponsive server" : text(t, "key")) + ": no limit")
            .join(", ")
        message: |
          text(owner, "kind") + " " + text(owner, "metadata.name") +
          " lets its copies stay on a server that has stopped answering, with no time limit. " +
          "They will sit there unreachable for as long as the server object exists, while the " +
          "service still counts them as healthy."
