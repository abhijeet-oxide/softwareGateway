# WHAT IS HAPPENING TO THIS ENVIRONMENT, said out loud.
#
# The pipeline moves one line in Git and stops; Flux does the deployment. So
# without this, the only place a deploy exists is `flux get` on somebody's
# laptop, and the first anybody hears of a failed upgrade is a user. The
# notification-controller is what closes that: it watches the same objects Flux
# reconciles and posts what they do.
#
# TWO ALERTS, NOT ONE, and the split is the point. A deploy is routine and its
# stream is noisy - progressing, applied, upgraded, healthy - and a failure is
# neither. Sending both to one channel means the failures arrive in a scroll of
# successes and are read on Monday.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: deploys-prod
  namespace: flux-system
spec:
  # Microsoft Teams, because this estate's directory is Entra and its people
  # are already there. Every other target is the same three lines with a
  # different `type` - slack, discord, generic (any webhook), githubdispatch.
  type: msteams
  # The webhook URL, from the credential backend like everything else - it is
  # in config/secrets/secrets.yaml as `flux-notifications`, so it is one more
  # entry in the one list rather than a secret somebody created by hand and
  # nobody can find later.
  secretRef:
    name: flux-notifications
  # Stamped on every message, because a person reading a channel that carries
  # more than one cluster needs to know which one is talking.
  channel: production
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: deploys-prod
  namespace: flux-system
spec:
  providerRef:
    name: deploys-prod
  # info carries the whole life of a reconciliation - started, applied,
  # upgraded, healthy - so this is the running commentary of a deploy.
  eventSeverity: info
  eventSources:
    # THE WHOLE CHAIN, so the sequence is legible: the operator becomes ready,
    # then the database layer, then the platform layer. Somebody watching sees
    # the dependencies working rather than gaps followed by activity - and on a
    # cluster where a bootstrap step was skipped, sees exactly which link never
    # closed.
    - kind: Kustomization
      name: platform-operators
      namespace: flux-system
    - kind: Kustomization
      name: software-gateway-prod-database
      namespace: flux-system
    - kind: Kustomization
      name: software-gateway-prod-platform
      namespace: flux-system
    - kind: HelmRelease
      name: software-gateway
      namespace: swgw
  # Health-check progress is emitted every few seconds while a rollout runs and
  # says nothing a person can act on. The events that matter - the upgrade
  # starting, finishing, or being rolled back - are not filtered.
  #
  # "dependencies do not meet ready condition" IS NOT EXCLUDED, and that is a
  # correction rather than an oversight. It is the message a cluster emits when
  # the operator layer was never applied, and excluding it made the one failure
  # that waits forever the one failure nobody was told about. It repeats, which
  # is the cost; a channel saying "waiting for platform-operators" every minute
  # is how somebody works out that they skipped a bootstrap step.
  exclusionList:
    - "health check.*in progress"
  summary: "software-gateway (production)"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: deploys-prod-failures
  namespace: flux-system
spec:
  providerRef:
    name: deploys-prod
  eventSeverity: error
  # WIDER THAN THE ALERT ABOVE. A failure is worth hearing about from anything
  # that can break this environment, including the things a deploy does not
  # touch: a source that cannot be fetched, a chart that cannot be pulled from
  # the internal registry, a credential the operator could not resolve.
  eventSources:
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    - kind: HelmRepository
      name: "*"
      namespace: flux-system
    # NAMED, NOT GLOBBED. `software-gateway-prod-*` matched the two layers and
    # missed the two objects most likely to be the actual cause: the root
    # Kustomization, which is what times out when a layer never becomes ready,
    # and the operator layer, without which the database layer waits forever.
    - kind: Kustomization
      name: software-gateway
      namespace: flux-system
    - kind: Kustomization
      name: software-gateway-prod-database
      namespace: flux-system
    - kind: Kustomization
      name: software-gateway-prod-platform
      namespace: flux-system
    - kind: Kustomization
      name: platform-operators
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: swgw
  summary: "FAILED - software-gateway (production)"
