# Every spelling of a PodDisruptionBudget that stops a node drain forever, plus
# the false positive a naive selector implementation produces.
#
# The four deadlock spellings are the point: maxUnavailable 0, maxUnavailable
# "0%", minAvailable "100%", and minAvailable equal to the replica count all
# mean "refuse every eviction", and an implementation that catches one of them
# passes the other three.
---
# Source: bad-pdb/templates/deadlock-absolute.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: deadlock-absolute, namespace: bad}
spec:
  maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
---
# Source: bad-pdb/templates/deadlock-percent.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: deadlock-percent, namespace: bad}
spec:
  maxUnavailable: "0%"
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
---
# Source: bad-pdb/templates/deadlock-hundred.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: deadlock-hundred, namespace: bad}
spec:
  minAvailable: "100%"
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
---
# Source: bad-pdb/templates/deadlock-allreplicas.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: deadlock-allreplicas, namespace: bad}
spec:
  minAvailable: 3
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
---
# Source: bad-pdb/templates/single-replica.yaml
# A budget over a one-replica workload permits no eviction either.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: over-singleton, namespace: bad}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: singleton}
---
# Source: bad-pdb/templates/expressions-ok.yaml
# This one is CORRECT and must not fire. It selects the quorum StatefulSet with
# matchExpressions - the spelling the inherited pdb.rego ignores entirely, and
# the false positive this fixture exists to catch.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: quorum-ok, namespace: bad}
spec:
  minAvailable: 2
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [quorum]}
---
