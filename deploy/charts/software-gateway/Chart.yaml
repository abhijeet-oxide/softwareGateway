apiVersion: v2
name: software-gateway
description: >-
  Software Gateway - the coordinator, the worker fleet, the web tier, the policy
  decision point and the identity provider, configured from one directory that a
  laptop, a compose stack and a cluster all read.
type: application
kubeVersion: ">=1.28.0-0"

home: https://github.com/abhijeet-oxide/softwareGateway
sources:
  - https://github.com/abhijeet-oxide/softwareGateway

# Both are stamped by the release pipeline; these are what `helm package` from a
# working tree produces.
#
#   version     the CHART's version, bumped on every release.
#   appVersion  the IMAGE version, and the default tag for all three of this
#               product's images. It moves only when code changes, which is what
#               lets a new product ship as a chart that reuses running images.
version: 0.0.0
appVersion: "0.0.0"

annotations:
  softwaregateway.io/images: "coordinator, worker, web"

maintainers:
  - name: Software Gateway
