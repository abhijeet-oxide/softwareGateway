apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-operators
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./deploy/flux/platform/operators/namespace-scoped/nprd
  sourceRef:
    kind: GitRepository
    name: software-gateway-platform
  # PRUNE IS OFF, Pruning removes objects that have left Git.
  # For CloudNativePG that is every `Cluster`, which is every database.
  # So a mistake that would cost an application a restart costs this one all of
  # the data. Removing an operator is a deliberate act with a maintenance window
  prune: false
  wait: true
  timeout: 10m
