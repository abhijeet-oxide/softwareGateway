name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request, one per push to main, one per manual dispatch.
  #
  # A pull request cancels its own superseded run: pushing a fix abandons the
  # run for the commit nobody is going to merge.
  #
  # Main does not, so a run that has STARTED always finishes. It is still not
  # one run per commit: only one run per group may be pending, so five merges
  # in a minute leave the newest queued and cancel the four behind it. That is
  # the trade, and it is the right one here - those four would each re-prove a
  # tree that the fifth supersedes before any of them finished.
  #
  # A manual dispatch gets its own group so it cannot cancel, or be cancelled
  # by, the push run for the same ref.
  group: >-
    ci-${{ github.event.pull_request.number
    || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PNPM_VERSION: "12.3.4"
  GODEBUG: http2client=0
  GOPROXY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  GOPROXY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
  HTTP_PROXY: ${{ vars.HTTP_PROXY }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
  NO_PROXY: ${{ vars.NO_PROXY }},localhost,127.0.0.1,::1
  GOPROXY: ${{ vars.GOPROXY }}
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}

jobs:
  # --------------------------------------------------------------- what changed
  changes:
    name: What changed
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      go: ${{ steps.f.outputs.go }}
      web: ${{ steps.f.outputs.web }}
      deploy: ${{ steps.f.outputs.deploy }}
      taskfile: ${{ steps.f.outputs.taskfile }}
      binaries: ${{ steps.f.outputs.binaries }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - id: f
        name: Decide which jobs are relevant
        # Through `env`, not interpolated into the script: a `${{ }}` inside a
        # `run:` block is a template substitution, so a ref name is shell.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            pull_request)
              base="$BASE"
              ;;
            workflow_dispatch)
              # A human asked for a run. Diffing against HEAD^ would prove only
              # the last commit, which is never what the button means.
              base=""
              ;;
            *)
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
              ;;
          esac

          # A workflow change, a first commit, or a base we cannot resolve: run
          # everything. Guessing narrower is how a change ships untested.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="ALL"
          else
            # Compare against the merge base, not the base tip. Otherwise a
            # base branch that moved after the pull request opened shows up as
            # this pull request's changes.
            merge_base="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"
            files="$(git diff --name-only "$merge_base" HEAD)"
          fi

          has() {
            [ "$files" = "ALL" ] && return 0
            grep -qE "$1" <<<"$files"
          }

          # .github always runs everything: a workflow that changed is a workflow
          # nothing has proved yet.
          if has '^\.github/'; then
            files="ALL"
          fi

          set_out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }

          # config/ feeds the Go tests, the chart and the seeder, so it counts
          # for both.
          has '(\.go$|^go\.(mod|sum)$|^db/|^config/|^Taskfile\.yml$)' \
            && set_out go true    || set_out go false
          has '^web/' \
            && set_out web true   || set_out web false
          has '(^deploy/|^config/)' \
            && set_out deploy true || set_out deploy false
          has '^Taskfile\.yml$' \
            && set_out taskfile true || set_out taskfile false
          # Cross-compiling six targets is slow and only the binaries' own build
          # can break it - or the Taskfile rule that cross-compiles them.
          has '(^cmd/|^internal/|^pkg/|^go\.(mod|sum)$|^Taskfile\.yml$)' \
            && set_out binaries true || set_out binaries false

  # ------------------------------------------------------------------ the code
  #
  # BUILD AND TEST ARE TWO JOBS, and nothing embeds the frontend into a binary,
  # so neither waits on the other. Serially they were the critical path: the
  # race detector on internal/store's scale tests is minutes on its own, and
  # the build behind it was minutes of a runner doing nothing.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-build-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - uses: ./.github/actions/web-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          registry: ${{ env.NPM_REGISTRY }}
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Locate the pnpm store
        id: pnpm
        working-directory: web
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4 # PIN
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: task build

      - name: Run Go vet
        run: task vet

      - name: Verify built binaries
        run: |
          set -euo pipefail
          ./bin/coordinator --version
          ./bin/worker --version
          ./bin/transferctl version --client

  web:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/web-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          registry: ${{ env.NPM_REGISTRY }}
          token: ${{ secrets.REGISTRY_TOKEN }}

      - name: Locate the pnpm store
        id: pnpm
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4 # PIN
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Typecheck
        id: typecheck
        if: '!cancelled()'
        run: pnpm run typecheck

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-test-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Run automated tests
        run: task test

  lint:
    name: Go static analysis
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'
          golangci-lint: 'true'

      - name: Cache Go modules and analysis output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-lint-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Verify go.mod and go.sum are tidy
        run: |
          set -euo pipefail

          cp go.mod "$RUNNER_TEMP/go.mod.orig"
          cp go.sum "$RUNNER_TEMP/go.sum.orig"

          go mod tidy

          if ! diff -u "$RUNNER_TEMP/go.mod.orig" go.mod ||
             ! diff -u "$RUNNER_TEMP/go.sum.orig" go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

          go mod verify

      - run: task lint

  config:
    name: Product configuration
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-config-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-config-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Validate product files
        run: task validate

      - name: Verify invalid configuration is rejected
        run: task validate:rejects-broken

  schema:
    name: Coordinator smoke test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-schema-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-schema-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Start coordinator and verify health endpoints
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/coordinator.log"
          bin="$RUNNER_TEMP/coordinator-ci"

          go build -o "$bin" ./cmd/coordinator

          "$bin" --config ./config/config.yaml > "$log" 2>&1 &
          COORD=$!

          # Any exit from here - assertion failure, timeout, or success - stops
          # the coordinator, and a FAILING exit prints why it failed.
          cleanup() {
            rc=$?
            kill "$COORD" 2>/dev/null || true
            wait "$COORD" 2>/dev/null || true
            if [ "$rc" -ne 0 ]; then
              echo "::group::coordinator log"
              cat "$log" || true
              echo "::endgroup::"
            fi
          }
          trap cleanup EXIT

          ready=false

          for _ in $(seq 1 60); do
            # A coordinator that died is not a coordinator that is still
            # starting. Fail now instead of burning the whole window.
            if ! kill -0 "$COORD" 2>/dev/null; then
              echo "::error::coordinator exited before it became ready"
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              ready=true
              break
            fi

            sleep 0.5
          done

          if [ "$ready" != true ]; then
            echo "::error::coordinator did not become ready within 30s"
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/metrics | grep -q 'softwaregateway_build_info'
          # Asserts a product was LOADED and serialised, not merely that the
          # route answers.
          curl -fsS http://127.0.0.1:8080/api/v1/products | grep -q '"productId"'
          echo "coordinator booted, migrated and served products"

  postgres:
    name: PostgreSQL integration tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    # SQLite does not cover PostgreSQL-specific query behaviour.
    services:
      postgres:
        # Pulled from the internal mirror by default. A self-hosted runner
        # behind the corporate proxy cannot be assumed to reach Docker Hub.
        image: ${{ vars.POSTGRES_IMAGE || 'postgres:16' }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-postgres-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-postgres-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Run PostgreSQL test suite
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: task test:postgres

  # --------------------------------------------------------------- performance
  #
  # BACKEND CHANGES ONLY, which is what `changes.outputs.go` already means: Go
  # sources, the migrations, go.mod and config/. A frontend-only pull request
  # does not pay for this, and neither does a documentation one.
  #
  # Two measurements, because "is it fast" is two questions. See Taskfile's
  # bench section and test/load/README.md.
  bench:
    name: Performance
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-bench-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-bench-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      # WHAT A QUERY COSTS. Recorded rather than gated: ns/op on a shared
      # runner is too noisy to fail a pull request on, and a benchmark that
      # fails for the weather is one that gets deleted. It is in the job
      # summary so a reviewer can see what a change did to it.
      - name: Benchmark the polled queries
        run: |
          set -euo pipefail
          task bench -- -benchtime 20x | tee "$RUNNER_TEMP/bench.txt"
          {
            echo '### Query cost'
            echo
            echo '```'
            grep -E '^Benchmark' "$RUNNER_TEMP/bench.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # WHAT THE SERVICE DOES UNDER LOAD. This one IS gated, on thresholds an
      # order of magnitude above where the code sits - see test/load/api.js for
      # why they are loose and what that buys.
      - name: Load-test the read path
        run: task bench:api

      - name: Keep the k6 summary
        if: '!cancelled()'
        uses: actions/upload-artifact@v4 # PIN
        with:
          name: bench-summary
          path: dev/bench-summary.json
          if-no-files-found: warn

  # ------------------------------------------------------------- the deployment
  deploy:
    name: Chart and manifests
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'
          helm: 'true'
          kustomize: 'true'
          kubeconform: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-deploy-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-deploy-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Compile chartstage
        run: go build -o "$RUNNER_TEMP/chartstage" ./deploy/chartstage/cmd/chartstage

      # Helm packages a directory, so stage the shared config into the chart.
      - name: Stage chart configuration
        run: task chart:stage

      - name: Lint the chart
        run: task chart:lint

      # Both layers of every instance, with the one values file Flux puts in a
      # ConfigMap. The configurations the chart must REFUSE are covered by
      # TestTheChartRefusesWhatCannotWork, beside the chart, where a renamed
      # value breaks them in the same commit.
      #
      # Rendered under $RUNNER_TEMP, not /tmp: a self-hosted runner that is not
      # ephemeral shares /tmp between concurrent jobs and across runs.
      - name: Render every instance
        run: |
          set -euo pipefail

          rendered=0

          for instance in $("$RUNNER_TEMP/chartstage" -instances | awk '{print $1}'); do
            "$RUNNER_TEMP/chartstage" -values "$instance" \
              > "$RUNNER_TEMP/$instance-values.yaml"

            for layer in database application; do
              db=false; app=false
              [ "$layer" = database ] && db=true || app=true

              helm template swgw deploy/charts/software-gateway \
                --values "$RUNNER_TEMP/$instance-values.yaml" \
                --set "layers.database=$db" --set "layers.application=$app" \
                > "$RUNNER_TEMP/$instance-$layer.yaml"

              echo "$instance/$layer: $(grep -c '^kind:' "$RUNNER_TEMP/$instance-$layer.yaml") objects"
              rendered=$((rendered + 1))
            done
          done

          # A chartstage that silently lists nothing would otherwise make this
          # job pass by rendering zero manifests.
          if [ "$rendered" -eq 0 ]; then
            echo "::error::chartstage listed no instances - nothing was rendered or validated"
            exit 1
          fi

      - name: Build every Flux kustomization
        run: task flux:build

      # Validates EVERY rendered instance. Naming lab explicitly meant a second
      # instance could be rendered and never schema-checked.
      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail

          manifests=()
          while IFS= read -r -d '' file; do
            manifests+=("$file")
          done < <(
            find "$RUNNER_TEMP" -maxdepth 1 -type f \
              \( -name '*-application.yaml' -o -name '*-database.yaml' \) \
              -print0
          )

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no rendered manifests found to validate"
            exit 1
          fi

          printf 'validating %s\n' "${manifests[@]}"

          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.29.0 "${manifests[@]}"

      - name: Deployment invariants
        run: go test ./deploy/... -count=1

  # --------------------------------------------------------------- portability
  cross-compile:
    name: Cross-platform binaries
    needs: changes
    # Six targets, and only the binaries' own build can break it. On a pull
    # request that does not touch them it is four minutes of nothing.
    if: needs.changes.outputs.binaries == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      # Six GOOS/GOARCH pairs each get their own compile cache entries, so this
      # is the job that benefits most from a warm cache.
      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-cross-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-cross-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Build Linux, macOS, and Windows binaries
        run: task build:all

      - name: Verify Windows binary extensions
        run: |
          set -uo pipefail
          missing=0
          for arch in amd64 arm64; do
            for bin in coordinator worker transferctl; do
              if [ ! -f "dist/windows-$arch/$bin.exe" ]; then
                echo "::error::dist/windows-$arch/$bin.exe is missing"
                missing=1
              fi
              if [ -f "dist/windows-$arch/$bin" ]; then
                echo "::error::dist/windows-$arch/$bin has no .exe suffix"
                missing=1
              fi
            done
          done
          exit $missing

      - uses: actions/upload-artifact@v7 # PIN
        if: github.ref == 'refs/heads/main'
        with:
          name: binaries
          path: dist/
          retention-days: 7

  portable:
    name: Taskfile portability
    needs: changes
    if: needs.changes.outputs.taskfile == 'true'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # PIN

      - uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          task: 'true'

      - name: Cache Go modules and build output
        uses: actions/cache@v4 # PIN
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-portable-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-portable-
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Warm the module cache
        run: go mod download

      # Run selected tasks with a Windows-like PATH to catch Unix-only commands.
      - name: Validate commands with a restricted PATH
        run: |
          set -uo pipefail

          winpath="$RUNNER_TEMP/winpath"
          mkdir -p "$winpath"

          for t in go gofmt git task; do
            ln -sf "$(command -v $t)" "$winpath/$t"
          done

          for t in build:backend vet validate; do
            echo "--- task $t"
            if ! env -i \
                 PATH="$winpath" \
                 HOME="$HOME" \
                 GOCACHE="$(go env GOCACHE)" \
                 GOMODCACHE="$(go env GOMODCACHE)" \
                 task "$t"; then
              echo "::error::task $t needs a command Windows does not have."
              echo "::error::Gate it with 'platforms:' or use a template function."
              exit 1
            fi
          done
          echo "every task ran with only go, gofmt, git and task on PATH"

  # -------------------------------------------------------------------- the gate
  ci:
    # THE ONE REQUIRED CHECK. A skipped job never reports, so making each job
    # required would block every pull request that legitimately skipped one.
    # This always runs and fails if anything that DID run failed.
    name: CI
    if: always()
    needs:
      - changes
      - build
      - web
      - test
      - lint
      - config
      - schema
      - postgres
      - deploy
      - cross-compile
      - portable
      - bench
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # `changes` decides what every other job does. If it did not succeed, the
      # downstream jobs are all 'skipped', which the check below reads as fine.
      - name: The change detector must have succeeded
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the 'What changed' job did not succeed (${{ needs.changes.result }})"
          echo "::error::every downstream job was skipped, so nothing was proved"
          exit 1
      - name: Every job that ran must have passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a CI job failed or was cancelled"
          exit 1
      - run: echo "CI is green"
