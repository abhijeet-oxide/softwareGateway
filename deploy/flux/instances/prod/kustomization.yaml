apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# THE NAMESPACE, and the only place it is written. It renames namespace.yaml and
# stamps every other object, so `kubectl create namespace` before the first
# install must use this exact name - the Secrets have to land in it.
namespace: swgw

resources:
  - namespace.yaml
  - 0-secrets
  - release

# THE ONE FILE. Both HelmReleases read this ConfigMap, so an instance states its
# differences once.
#
# The name is fixed rather than hashed, because the HelmReleases reference it by
# name. An edit is therefore applied at the next HelmRelease reconciliation
# (5 minutes), or at once with:
#
#   flux -n <namespace> reconcile helmrelease software-gateway --with-source
configMapGenerator:
  - name: software-gateway-values
    files:
      - values.yaml=values/values.yaml
generatorOptions:
  disableNameSuffixHash: true
