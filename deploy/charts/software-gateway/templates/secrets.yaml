{{/*
CREDENTIALS, FROM ONE INVENTORY, THROUGH EITHER OPERATOR.

config/secrets/secrets.yaml lists the secrets this deployment needs: a name, its
keys, and a relative path. No values, ever. This file turns that list into
whichever operator the cluster runs, and the Secret that lands in the namespace
is IDENTICAL either way - same name, same keys - so everything above this line
is unaware of the choice, and switching backends is one value.

  vault  VaultStaticSecret, read by the Vault Secrets Operator. The Secret is
         produced whether or not a pod is running, refreshed on a timer, and a
         rotation reaches the projected volume without a restart.

  azure  SecretProviderClass, read by the Azure Key Vault CSI driver. Same
         result with one caveat that is worth knowing before choosing it and is
         explained at the SecretProviderClass below.

  none   the Secrets are already in the namespace. Nothing is rendered and the
         projected volume finds them by name.

WHAT IS NOT HERE. No branch on "which cloud are we", no per-environment copy of
the list, and no path spelled out twice. The environment supplies the ROOT
(vault.pathPrefix, azure.keyvaultName); the inventory supplies the leaf.
*/}}
{{- $inv := .Files.Get "files/config/secrets/secrets.yaml" | fromYaml -}}
{{- $entries := default (list) $inv.secrets -}}
{{- $pull := .Values.secrets.registryPullSecret -}}

{{- if eq .Values.secrets.backend "vault" }}
{{- range $entries }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "swgw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    softwaregateway.io/keys: {{ join ", " (default (list) .keys) | quote }}
{{- if .description }}
    softwaregateway.io/description: {{ .description | quote }}
{{- end }}
spec:
  mount: {{ $.Values.secrets.vault.mount }}
  type: {{ $.Values.secrets.vault.type }}
  path: {{ printf "%s/%s" (trimSuffix "/" $.Values.secrets.vault.pathPrefix) .path }}
  # The refresh is what makes a rotation arrive without a rollout. The operator
  # rewrites the Secret; the kubelet updates the projected volume; the process
  # reads the file when it next needs a token. Nothing restarts.
  refreshAfter: {{ $.Values.secrets.vault.refreshAfter }}
{{- if $.Values.secrets.vault.connectionRef }}
  vaultAuthRef: {{ $.Values.secrets.vault.authRef }}
{{- else }}
  vaultAuthRef: {{ $.Values.secrets.vault.authRef }}
{{- end }}
  destination:
    name: {{ .name }}
    create: true
{{- if and $pull.enabled (eq .name $pull.from) }}
    # The kubelet's pull credentials. The vault entry holds a ready-made
    # .dockerconfigjson, which is one value in one place rather than a template
    # in this chart assembling a credential it should never see.
    type: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}
{{- end }}

{{- if eq .Values.secrets.backend "azure" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "swgw.fullname" . }}-secrets
  labels:
    {{- include "swgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    softwaregateway.io/note: >-
      The CSI driver produces a Kubernetes Secret only while a pod that mounts
      this class is running, so the coordinator Deployment mounts it. That is
      the honest arrangement rather than a workaround - it is also what makes
      the Secret disappear if every mounting pod is deleted, which is the one
      behavioural difference from the Vault path and is why that one is the
      default recommendation.
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "secrets.azure.clientId is required for the azure backend (workload identity)" .Values.secrets.azure.clientId | quote }}
    keyvaultName: {{ required "secrets.azure.keyvaultName is required for the azure backend" .Values.secrets.azure.keyvaultName | quote }}
    tenantId: {{ required "secrets.azure.tenantId is required for the azure backend" .Values.secrets.azure.tenantId | quote }}
    objects: |
      array:
{{- range $entries }}
{{- $entry := . }}
{{- range .keys }}
        - |
          objectName: {{ printf "%s%s-%s" $.Values.secrets.azure.objectPrefix $entry.name (. | replace "." "-") }}
          objectType: secret
          objectAlias: {{ printf "%s__%s" $entry.name . }}
{{- end }}
{{- end }}
  # The Secrets the driver SYNCS out of what it mounted. These are what the
  # projected volume in every workload actually reads, and they carry the same
  # names and keys the Vault path produces.
  secretObjects:
{{- range $entries }}
{{- $entry := . }}
    - secretName: {{ .name }}
{{- if and $pull.enabled (eq .name $pull.from) }}
      type: kubernetes.io/dockerconfigjson
{{- else }}
      type: Opaque
{{- end }}
      data:
{{- range .keys }}
        - objectName: {{ printf "%s__%s" $entry.name . }}
          key: {{ . }}
{{- end }}
{{- end }}
{{- end }}
