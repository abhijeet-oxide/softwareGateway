# Health probes: the ways a container is reported healthy when it is not, and
# the ways it is restarted when it is merely busy.
---
# Source: bad-probes/templates/service.yaml
apiVersion: v1
kind: Service
metadata: {name: api, namespace: bad}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Source: bad-probes/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: api}}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        # Behind a Service, declares a port, and has no readiness probe: every
        # rollout drops the requests that arrive before it is listening.
        - name: unprobed
          image: registry.acme.example/bad/api@sha256:1111000011110000111100001111000011110000111100001111000011110000
          ports: [{name: http, containerPort: 8080}]
        # Liveness and readiness are the same handler, so a slow dependency
        # restarts the pod instead of removing it from the endpoint list.
        - name: same-handler
          image: registry.acme.example/bad/api@sha256:2222000022220000222200002222000022220000222200002222000022220000
          ports: [{name: alt, containerPort: 8081}]
          readinessProbe:
            httpGet: {path: /health, port: 8081, scheme: HTTP}
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8081, scheme: HTTP}
            timeoutSeconds: 2
            # More sensitive than readiness, so liveness reacts first.
            periodSeconds: 2
            failureThreshold: 1
        # A blind minute at start-up instead of a startup probe, a probe
        # pointing at a port this container does not declare, timings outside
        # the bounds, and a preStop sleep longer than the grace period.
        - name: misconfigured
          image: registry.acme.example/bad/api@sha256:3333000033330000333300003333000033330000333300003333000033330000
          ports: [{name: own, containerPort: 8082}]
          readinessProbe:
            # A NAME this container does not declare. It can never resolve, so
            # the copy never becomes ready. (A numeric port would resolve
            # whether or not it appears in the ports list, which is why numbers
            # are no longer reported.)
            httpGet: {path: /ready, port: metrics, scheme: HTTP}
            timeoutSeconds: 30
            periodSeconds: 60
          livenessProbe:
            httpGet: {path: /alive, port: 8082, scheme: HTTP}
            initialDelaySeconds: 120
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "600"]
---
# Source: bad-probes/templates/task.yaml
# A one-off task carrying checks meant for something that keeps running, and a
# startup allowance too short to be worth having.
apiVersion: batch/v1
kind: Job
metadata: {name: migrate, namespace: bad}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: migrate}}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: migrate
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          # A restart check can kill this just before it finishes, and the
          # install then fails in a way that does not reproduce.
          livenessProbe:
            httpGet: {path: /livez, port: 8080}
            periodSeconds: 10
---
# Source: bad-probes/templates/slowstart.yaml
apiVersion: apps/v1
kind: Deployment
metadata: {name: slowstart, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: slowstart}}
  template:
    metadata: {labels: {app.kubernetes.io/name: slowstart}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: slowstart
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          # Three attempts, five seconds apart: fifteen seconds of protection
          # for a service that takes a minute to start. It looks like a startup
          # allowance and still kills the container mid-start.
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
            failureThreshold: 3
---
# Source: bad-probes/templates/numeric-port.yaml
# A numeric probe port, and a container that declares no ports at all. This
# resolves perfectly well at runtime - containerPort is documentation - and it
# must NOT be reported.
apiVersion: apps/v1
kind: Deployment
metadata: {name: numeric-probe-port, namespace: bad}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: numeric-probe-port}}
  template:
    metadata: {labels: {app.kubernetes.io/name: numeric-probe-port}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: numeric
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          readinessProbe:
            httpGet: {path: /ready, port: 8443, scheme: HTTPS}
            timeoutSeconds: 2
            periodSeconds: 5
