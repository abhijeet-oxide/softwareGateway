apiVersion: softwaregateway.io/v1alpha1
kind: Product
metadata:
  name: nokia-cmm
  displayName: Nokia Cloud Mobility Manager
  owner: mobility-core
spec:
  sources:
    - name: vendor
      registry: registry.nokia.example.com:9443
      repository: nokia/cmm
      anonymous: true
      discovery:
        enabled: true
        interval: 30m
  targets:
    - name: jfrog-lab
      registry: artifactory.internal.example.com:9444
      repository: nokia-lab/cmm
      type: artifactory
      xrayEnabled: true
      xrayEndpoint: https://artifactory.internal.example.com:9444
      credentialsRef:
        secretName: internal-registry
      default: true
      environment: lab

    # Production on the SAME Artifactory, which is the ordinary deployment and
    # the one native promotion exists for: two repositories of one instance, so
    # JFrog relocates the release server-side.
    - name: jfrog-prod
      registry: artifactory.internal.example.com:9444
      repository: nokia-prod/cmm
      type: jfrog
      environment: production
      promotionOnly: true
      credentialsRef:
        secretName: internal-registry

    # And a DR site on another host, so the dialog has something to explain:
    # two Artifactories cannot relocate between themselves, and the release is
    # copied instead.
    - name: jfrog-dr
      registry: registry.ericsson.example.com:9443
      repository: nokia-dr/cmm
      type: jfrog
      environment: production
      promotionOnly: true
      anonymous: true
  network:
    tls:
      # Development only: dev/fakeregistry issues its own certificate.
      insecureSkipVerify: true
