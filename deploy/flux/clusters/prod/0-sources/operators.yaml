# THE OPERATORS, AS A LAYER AN INSTANCE CAN DEPEND ON.
#
# Separate from the objects beside it so that `dependsOn: platform-operators`
# means something: with `wait: true` this reconciler is not Ready until
# CloudNativePG is, and no instance is applied before its CRDs exist.
#
# `prune: false` - pruning would remove those CRDs, and deleting a CRD deletes
# every object of that kind. Removing an operator is a maintenance window.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-operators
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  path: ./deploy/flux/clusters/prod/0-sources/operators
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: software-gateway
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
