apiVersion: softwaregateway.io/v1alpha1
kind: PolicyPack
metadata:
  name: sgw-baseline-probes
  prefix: PRB
  version: 2.0.0
  description: >
    Health checks. Whether the platform can tell that a service is ready to take
    traffic, and whether it restarts one that is merely busy.
  maintainer: platform-sre
  reference: docs/compliance/source-standards.md - 3. Health Probes & Lifecycle
spec:
  checks:
    - id: PRB-01
      title: Traffic only reaches copies that say they are ready
      description: >
        A container that opens a port, in a service that receives traffic,
        declares a readiness check - the test the platform runs before sending it
        any requests.
      rationale: >
        Without one, the platform starts sending requests the moment the process
        exists, which is before it is listening. Every update drops the requests
        that arrive in that window. Helper containers are deliberately left out
        of this check: a finding on a sidecar is noise, and noise is what gets a
        check switched off.
      severity: block
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Readiness probe
      keywords: [readinessProbe, probe, Service, endpoints, traffic, rollout]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: medium
      reference: source-standards.md - PRB-01
      remediation: >
        Add a readinessProbe that only answers once the container can actually
        serve a request.
      fixExample: |
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
          timeoutSeconds: 2
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: main
        where: 'size(servicesFor(owner)) > 0 && value(self, "ports") != null'
      assert:
        required: [readinessProbe]

    - id: PRB-02
      title: A slow-starting service is given time to start
      description: >
        A container that makes its restart check wait more than 30 seconds before
        the first attempt declares a startup check instead.
      rationale: >
        A long initial delay is somebody working around slow start-up by making
        the restart check blind for the first minute. A startup check says the
        same thing without leaving the container unwatched, and without killing
        it if start-up takes longer than the delay somebody guessed.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Startup probe
      keywords: [startupProbe, livenessProbe, initialDelaySeconds, "slow start", CrashLoopBackOff]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-02
      remediation: >
        Replace the long initialDelaySeconds with a startupProbe, and lower the
        restart check's delay.
      fixExample: |
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
          failureThreshold: 24        # up to two minutes to start
        livenessProbe:
          httpGet: {path: /livez, port: http}
          periodSeconds: 10
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob]
        containers: all
        where: 'present(self, "livenessProbe.initialDelaySeconds") && int(value(self, "livenessProbe.initialDelaySeconds")) > 30'
      assert:
        required: [startupProbe]

    - id: PRB-03
      title: The restart check is more patient than the traffic check
      description: >
        Where a container has both, the check that restarts it runs less often,
        and tolerates more failures, than the check that decides whether to send
        it traffic.
      rationale: >
        The traffic check takes a copy out of rotation; the restart check kills
        it. If the killing one reacts first, a slow dependency restarts the
        process instead of quietly removing it from rotation - and because every
        copy depends on the same slow thing, they all restart together. A
        degraded service becomes a crash loop.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe timing
      keywords: [livenessProbe, readinessProbe, periodSeconds, failureThreshold, "restart loop", probe]
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-03
      remediation: >
        Raise the restart check's periodSeconds and failureThreshold above the
        traffic check's.
      fixExample: |
        readinessProbe:
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          periodSeconds: 10       # runs half as often
          failureThreshold: 6     # and tolerates twice as many failures
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "livenessProbe") && present(self, "readinessProbe")'
      assert:
        expr: |
          (!present(self, "livenessProbe.periodSeconds") || !present(self, "readinessProbe.periodSeconds") ||
             int(value(self, "livenessProbe.periodSeconds")) >= int(value(self, "readinessProbe.periodSeconds"))) &&
          (!present(self, "livenessProbe.failureThreshold") || !present(self, "readinessProbe.failureThreshold") ||
             int(value(self, "livenessProbe.failureThreshold")) >= int(value(self, "readinessProbe.failureThreshold")))
        locus: livenessProbe
        expected: the restart check running no more often, and tolerating no fewer failures, than the traffic check
        observed: |
          "restart check every " + text(self, "livenessProbe.periodSeconds") + "s after " +
          text(self, "livenessProbe.failureThreshold") + " failures; traffic check every " +
          text(self, "readinessProbe.periodSeconds") + "s after " +
          text(self, "readinessProbe.failureThreshold") + " failures"

    - id: PRB-04
      title: The restart check and the traffic check ask different questions
      description: >
        A container's restart check and traffic check do not call exactly the
        same thing. The comparison is on what each check actually calls - the
        address, or the command - and ignores how often it runs.
      rationale: >
        Two identical checks are one decision wearing two hats. A slow dependency
        then restarts the copy rather than taking it out of rotation, and every
        copy does it at once because they all depend on the same slow thing. The
        fix is that the restart check should test only whether this process is
        alive, and the traffic check whether it can serve.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe handlers
      keywords: [livenessProbe, readinessProbe, httpGet, exec, tcpSocket, grpc, "probe handler", endpoint]
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: application
      fixEffort: medium
      reference: source-standards.md - PRB-04
      remediation: >
        Point the restart check at something that tests only the process, and the
        traffic check at something that tests whether it can serve a request.
      fixExample: |
        livenessProbe:
          httpGet: {path: /livez, port: http}    # is the process alive?
        readinessProbe:
          httpGet: {path: /readyz, port: http}   # can it serve a request?
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "livenessProbe") && present(self, "readinessProbe")'
      assert:
        expr: |
          probeHandler(value(self, "livenessProbe")) == "" ||
          probeHandler(value(self, "livenessProbe")) != probeHandler(value(self, "readinessProbe"))
        locus: livenessProbe
        expected: a restart check that calls something different from the traffic check
        observed: '"both call " + probeHandler(value(self, "livenessProbe"))'
        message: |
          "the restart check and the traffic check for this container both call " +
          probeHandler(value(self, "livenessProbe")) +
          ". A slow dependency will therefore restart the copy instead of taking it out of rotation."

    - id: PRB-05
      title: Health checks are given a sensible time limit for their kind
      description: >
        A traffic check's time limit and how often it runs are within the bounds
        this organization sets. Checks that run a script get a wider band than
        checks that make a request inside the cluster, because starting a shell
        costs time before the check itself begins.
      rationale: >
        A time limit longer than the gap between attempts queues checks up
        against a service that is already struggling, and failure detection stops
        having any bounded time at all. The bands differ by kind on purpose:
        holding a script-based check to the latency budget of a local web request
        misreads what the check is doing, and reporting it would be wrong about
        roughly nine out of ten script checks.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe timing
      keywords: [timeoutSeconds, periodSeconds, readinessProbe, "exec probe", httpGet, probe]
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-05
      remediation: >
        For a check that makes a request - web, TCP or gRPC - bring
        timeoutSeconds into 1 to 3 and periodSeconds into 5 to 10. For a check
        that runs a script, the bands are 1 to 10 and 5 to 30.
      fixExample: |
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          timeoutSeconds: 2      # request-based check: 1-3
          periodSeconds: 5       #                      5-10
        # a script-based check may take longer:
        # readinessProbe:
        #   exec: {command: ["/bin/check.sh"]}
        #   timeoutSeconds: 8    # script check: 1-10
        #   periodSeconds: 20    #               5-30
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "readinessProbe")'
      assert:
        expr: |
          (!present(self, "readinessProbe.timeoutSeconds") ||
            (int(value(self, "readinessProbe.timeoutSeconds")) >= 1 &&
             int(value(self, "readinessProbe.timeoutSeconds")) <= (present(self, "readinessProbe.exec") ? 10 : 3))) &&
          (!present(self, "readinessProbe.periodSeconds") ||
            (int(value(self, "readinessProbe.periodSeconds")) >= 5 &&
             int(value(self, "readinessProbe.periodSeconds")) <= (present(self, "readinessProbe.exec") ? 30 : 10)))
        locus: readinessProbe
        expected: a time limit and frequency inside the band for this kind of check
        observed: |
          (present(self, "readinessProbe.exec") ? "script check: " : "request check: ") +
          "gives up after " + (present(self, "readinessProbe.timeoutSeconds") ? text(self, "readinessProbe.timeoutSeconds") : "1 (default)") +
          "s, runs every " + (present(self, "readinessProbe.periodSeconds") ? text(self, "readinessProbe.periodSeconds") : "10 (default)") + "s"

    - id: PRB-06
      title: A health check points at a port the container really has
      description: >
        Where a health check names its port by name rather than by number, that
        name is one the same container declares.
      rationale: >
        A named port is looked up in the container's own list of ports. A name
        that is not there resolves to nothing, so the check can never succeed and
        the copy never becomes ready - an install that hangs with no useful
        error. Numeric ports are not checked, because a number always resolves:
        the port list is documentation, and a check aimed at 8443 reaches
        whatever is listening on 8443.
      severity: block
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe target port
      keywords: [httpGet.port, tcpSocket.port, containerPort, "named port", "probe port", readinessProbe]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-06
      remediation: >
        Use a port name this container declares, or the port number. Port names
        are limited to 15 characters, and a name silently truncated to fit is a
        common cause.
      fixExample: |
        ports:
          - name: http
            containerPort: 8080
        readinessProbe:
          httpGet: {path: /readyz, port: http}    # a name this container declares
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "readinessProbe.httpGet.port") || present(self, "readinessProbe.tcpSocket.port")'
      assert:
        expr: |
          (!present(self, "readinessProbe.httpGet.port") || declaresPort(self, value(self, "readinessProbe.httpGet.port"))) &&
          (!present(self, "readinessProbe.tcpSocket.port") || declaresPort(self, value(self, "readinessProbe.tcpSocket.port")))
        locus: readinessProbe.httpGet.port
        expected: a port name this container declares
        observed: |
          "the check looks for a port called \"" +
          text(self, "readinessProbe.httpGet.port") + text(self, "readinessProbe.tcpSocket.port") +
          "\", which this container does not declare"
        message: |
          "the traffic check for this container names a port the container does not have, so it can " +
          "never succeed and the copy will never become ready. Port names are capped at 15 characters, " +
          "so check for a truncated name."

    - id: PRB-07
      title: A pause before shutdown fits inside the time allowed for shutdown
      description: >
        Where a container waits for a fixed time before shutting down, that wait
        is shorter than the shutdown time the workload declares.
      rationale: >
        A wait longer than the allowed shutdown time guarantees the service is
        killed part way through shutting down, every single time. The pause was
        added to make shutdown graceful and is the thing making it abrupt.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Lifecycle hooks
      keywords: [preStop, lifecycle, sleep, terminationGracePeriodSeconds, SIGKILL]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-07
      remediation: >
        Shorten the wait, or raise terminationGracePeriodSeconds above it.
      fixExample: |
        spec:
          template:
            spec:
              terminationGracePeriodSeconds: 45   # longer than the pause below
              containers:
                - name: app
                  lifecycle:
                    preStop:
                      exec: {command: ["sleep", "10"]}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "lifecycle.preStop.exec.command")'
      assert:
        expr: |
          !self.lifecycle.preStop.exec.command.exists(a, string(a) == "sleep") ||
          (podField(owner, "terminationGracePeriodSeconds") == null ? 30 : int(podField(owner, "terminationGracePeriodSeconds"))) >
            int(self.lifecycle.preStop.exec.command[size(self.lifecycle.preStop.exec.command) - 1])
        locus: lifecycle.preStop
        expected: a pause shorter than the workload's shutdown time
        observed: |
          "waits " + string(self.lifecycle.preStop.exec.command[size(self.lifecycle.preStop.exec.command) - 1]) +
          "s before shutting down, out of " +
          (podField(owner, "terminationGracePeriodSeconds") == null
            ? "the platform's default 30" : string(podField(owner, "terminationGracePeriodSeconds"))) + "s allowed"

    - id: PRB-08
      title: A health check finishes before the next one starts
      description: >
        A check's time limit is shorter than the gap between attempts.
      rationale: >
        If a check is allowed longer than the gap before the next one, the checks
        overlap and pile up against a service that is already slow. How long it
        takes to notice a failure then has no upper bound at all, which defeats
        the point of having the check.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe timing
      keywords: [timeoutSeconds, periodSeconds, probe, overlap, livenessProbe, startupProbe]
      confidence: confirmed
      whenItBites: on-failure
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-05 (structural half)
      remediation: Set timeoutSeconds below periodSeconds on every check.
      fixExample: |
        readinessProbe:
          timeoutSeconds: 2
          periodSeconds: 5     # always larger than the time limit
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: |
          (present(self, "readinessProbe.timeoutSeconds") && present(self, "readinessProbe.periodSeconds")) ||
          (present(self, "livenessProbe.timeoutSeconds") && present(self, "livenessProbe.periodSeconds")) ||
          (present(self, "startupProbe.timeoutSeconds") && present(self, "startupProbe.periodSeconds"))
      assert:
        expr: |
          ["readinessProbe", "livenessProbe", "startupProbe"].all(p,
            !present(self, p + ".timeoutSeconds") || !present(self, p + ".periodSeconds") ||
            int(value(self, p + ".timeoutSeconds")) < int(value(self, p + ".periodSeconds")))
        locus: readinessProbe.timeoutSeconds
        expected: a time limit shorter than the gap between attempts
        observed: |
          ["readinessProbe", "livenessProbe", "startupProbe"]
            .filter(p, present(self, p + ".timeoutSeconds") && present(self, p + ".periodSeconds") &&
                       int(value(self, p + ".timeoutSeconds")) >= int(value(self, p + ".periodSeconds")))
            .map(p, p + ": gives up after " + text(self, p + ".timeoutSeconds") +
                    "s but runs every " + text(self, p + ".periodSeconds") + "s")
            .join("; ")

    - id: PRB-09
      title: One-off tasks do not carry checks meant for long-running services
      description: >
        A container in a one-off task, and any container that runs before the
        main one, does not declare a restart check or a traffic check.
      rationale: >
        These checks exist to watch something that is meant to keep running. On a
        task designed to finish and exit, a restart check can kill it just before
        it completes, so the installation fails in a way that looks random and
        does not reproduce.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Probe applicability
      keywords: [livenessProbe, readinessProbe, initContainers, Job, CronJob, probe]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-01 (applicability half)
      remediation: >
        Remove the restart and traffic checks from one-off tasks and from
        containers that run before the main one. If the task needs to wait for
        something, have it wait in its own command.
      fixExample: |
        initContainers:
          - name: wait-for-db
            command: ["/bin/wait", "--for", "db:5432"]   # waits in the command
            # no livenessProbe, no readinessProbe
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: |
          text(address, "containerType") == "init" ||
          text(owner, "kind") == "Job" || text(owner, "kind") == "CronJob"
      assert:
        expr: '!present(self, "livenessProbe") && !present(self, "readinessProbe")'
        locus: livenessProbe
        expected: no restart or traffic check on a container that is meant to finish
        observed: |
          (present(self, "livenessProbe") ? "has a restart check" : "") +
          (present(self, "livenessProbe") && present(self, "readinessProbe") ? " and " : "") +
          (present(self, "readinessProbe") ? "has a traffic check" : "")

    - id: PRB-11
      title: A startup allowance is long enough to be useful
      description: >
        Where a container declares a startup check, the total time it allows -
        how many attempts, times how often they run - is at least 30 seconds.
      rationale: >
        A startup allowance shorter than the real start-up time is worse than
        none at all: it looks like protection while still killing the service
        part way through starting, which presents as a crash loop nobody can
        explain. Cover the worst start-up you have seen, with room on top.
      severity: warn
      tier: 1
      category: Health Probes & Lifecycle
      subcategory: Startup probe
      keywords: [startupProbe, failureThreshold, periodSeconds, "startup budget", probe]
      confidence: confirmed
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PRB-02 (budget half)
      remediation: >
        Raise failureThreshold or periodSeconds so that failureThreshold times
        periodSeconds covers the slowest start-up, plus a margin. Two minutes is
        a common starting point.
      fixExample: |
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
          failureThreshold: 24     # 5 x 24 = 120 seconds to start
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        containers: all
        where: 'present(self, "startupProbe")'
      assert:
        expr: |
          (present(self, "startupProbe.failureThreshold") ? int(value(self, "startupProbe.failureThreshold")) : 3) *
          (present(self, "startupProbe.periodSeconds") ? int(value(self, "startupProbe.periodSeconds")) : 10) >= 30
        locus: startupProbe.failureThreshold
        expected: at least 30 seconds of start-up allowance in total
        observed: |
          "allows " +
          string((present(self, "startupProbe.failureThreshold") ? int(value(self, "startupProbe.failureThreshold")) : 3) *
                 (present(self, "startupProbe.periodSeconds") ? int(value(self, "startupProbe.periodSeconds")) : 10)) +
          "s to start"
