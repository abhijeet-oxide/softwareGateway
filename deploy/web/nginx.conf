# The web tier. Serves the built SPA and proxies the API on the SAME ORIGIN.
#
# Same-origin is not a convenience: the Coordinator installs no CORS
# middleware (web/vite.config.ts says so, and that is the right production
# posture), so the browser MUST reach /api/v1 on the origin that served the
# page. Vite proxies it in development; this does the same job in a container,
# which is why dev and production agree.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A privileged user's token carries org-wide roles. Default buffers are
    # 4k/8k and reject it. See docs/design/24 section 5.1.
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers on the old bundle pointing at new API shapes.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # Resolve the upstream PER REQUEST, not once at startup.
        #
        # nginx resolves a literal upstream hostname when it parses the config
        # and then caches that address for the life of the process. Two
        # failures follow: the container refuses to START if the controller is
        # not up yet (a restart ordering problem that depends_on cannot fully
        # remove), and if the controller is later replaced with a new IP the
        # web tier proxies to a dead address until someone restarts it.
        # Assigning to a variable forces runtime resolution through Docker's
        # embedded DNS instead.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $upstream      http://controller:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        # Server-sent events and long polls must not be buffered or the UI
        # shows nothing until the response completes.
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }

    # Client-side router: every unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
