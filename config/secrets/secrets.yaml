# THE CREDENTIALS THIS DEPLOYMENT NEEDS, named once.
#
# A product that is not `anonymous: true` names a secret:
#
#   credentialsRef:
#     secretName: internal-registry
#
# and every runtime resolves it to <config dir>/secrets/<secretName>/<key>.
# That is a projected Kubernetes Secret volume, and it is a directory of files
# on a laptop - the same path, the same code (internal/product/secrets.go).
#
# WHAT IS MISSING WITHOUT THIS FILE is the list itself. The products say which
# secrets they need; nothing said which secrets EXIST, where their values come
# from, or which keys they carry. So a fresh cluster produced a deployment that
# came up healthy, loaded three products, marked one invalid for a file nobody
# had been told to create, and reported it in a log line.
#
# This is that list. It carries NO VALUES and never will - a name, the keys, and
# where the backend should look. From it:
#
#   the chart      renders one VaultStaticSecret (Vault Secrets Operator) or one
#                  SecretProviderClass (Azure Key Vault CSI driver) per entry -
#                  `secrets.backend` in values.yaml picks which, and the Secret
#                  that lands in the namespace is identical either way
#   `task secrets:scaffold`
#                  writes the empty local layout under secrets/local/ so a
#                  developer fills in files rather than guessing paths
#   go test ./deploy/...
#                  fails when a product references a secret that is not here,
#                  on the pull request rather than in the cluster
#
# THE PATH IS RELATIVE, deliberately. `path` here is the leaf; the backend's
# root is a per-environment setting (secrets.vault.pathPrefix,
# secrets.azureKeyVault.name) because lab and production read from different
# mounts and this file is shared by both. Writing the full path here would fork
# it per environment, which is the thing this directory exists to avoid.
apiVersion: softwaregateway.io/v1alpha1
kind: SecretInventory

secrets:
  # THE CREDENTIAL THE CLUSTER PULLS THIS PRODUCT WITH, and it is the same one
  # the pipeline pushes with. One JFrog account, held in the vault once, read by
  # Flux to fetch the chart and by the kubelet to fetch the images.
  #
  # ONE KEY, and it is a whole docker config rather than a username and a
  # password. Kubernetes' dockerconfigjson type carries the file, not the
  # fields, so assembling it from parts would mean this chart templating a
  # credential it has no business seeing. Store it already assembled:
  #
  #   kubectl create secret docker-registry jfrog --dry-run=client -o json \
  #     --docker-server=artifactory.internal.example.com \
  #     --docker-username="$JFROG_USERNAME" --docker-password="$JFROG_TOKEN" \
  #   | jq -r '.data[".dockerconfigjson"]' | base64 -d
  #
  # and put THAT string in the vault under the path below.
  - name: jfrog
    description: >-
      Pull credentials for the internal Artifactory that holds this product's
      images and its chart. Referenced by secrets.registryPullSecret in values.
    keys: [".dockerconfigjson"]
    path: jfrog

  # The example estate in config/products is anonymous throughout, so nothing
  # here is required to make it run. This entry is the shape, and it is the one
  # a real deployment starts from.
  - name: internal-registry
    description: >-
      Service account for the internal Artifactory that products push to.
      Referenced by credentialsRef.secretName on a target.
    keys: [username, password]
    path: internal-registry

  # Credentials read a key at a time, so a client certificate is not a special
  # case: it is a secret whose keys happen to be PEM. The mount is the same, and
  # `network.tls` on the product decides whether they are used.
  #
  # Commented out because no product in config/products references it. Uncomment
  # it with the product that needs it, in the same pull request, so the two
  # halves of the change are reviewed together.
  #
  # - name: vendor-registry-mtls
  #   description: Client certificate for a vendor registry that requires mTLS.
  #   keys: [tls.crt, tls.key, ca.crt]
  #   path: vendor-registry-mtls
