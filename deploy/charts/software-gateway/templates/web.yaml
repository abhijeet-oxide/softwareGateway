{{- if .Values.layers.application }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swgw.fullname" . }}-web
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "swgw.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swgw.fullname" . }}-web
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    {{- include "swgw.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swgw.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
      annotations:
        # The SPA's runtime configuration is rendered by the entrypoint at
        # container start, so a change to what feeds it has to roll these pods.
        checksum/runtime-config: {{ printf "%s|%s|%s" (include "swgw.identityUrl" .) .Values.supportContact (default "" .Values.identity.sso.displayName) | sha256sum }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "swgw.fullname" . }}-web
      {{- include "swgw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "swgw.nginxPodSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # BOTH SOFT: this tier renders the page that explains why the rest of
        # the system is unavailable, so it must come up when the rest has not.
        # The waits only order a first install - the entrypoint reads the OIDC
        # client id once, at container start.
        {{- include "swgw.waitForHTTP" (dict "ctx" . "name" "coordinator" "url" "http://controller:8080/healthz" "soft" true "timeout" 120) | nindent 8 }}
{{- if .Values.identity.enabled }}
        {{- include "swgw.waitForFile" (dict "ctx" . "name" "oidc-client" "path" "/oidc/web.json" "soft" true "timeout" 300
              "mounts" (printf "- name: oidc\n  mountPath: /oidc\n  readOnly: true")) | nindent 8 }}
{{- end }}
      containers:
        - name: web
          image: {{ include "swgw.image" (dict "ctx" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # Public values only: a public OIDC client has no secret, which is
            # why these end up in a file every browser fetches.
            - name: OIDC_ISSUER
              value: {{ include "swgw.identityUrl" . | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ printf "%s/auth/callback" (include "swgw.webUrl" .) | quote }}
            - name: SUPPORT_CONTACT
              value: {{ default .Values.identity.bootstrapAdmin.email .Values.supportContact | quote }}
            - name: SSO_DISPLAY_NAME
              value: {{ if .Values.identity.sso.issuer }}{{ .Values.identity.sso.displayName | quote }}{{ else }}""{{ end }}
            # The client id ZITADEL generated for the SPA, read from the file the
            # seeder publishes.
            - name: OIDC_CONFIG_FILE
              value: /oidc/web.json
          # LIVENESS IS LOCAL: /healthz answers from nginx itself, so a
          # Coordinator outage cannot restart the tier that renders the page
          # explaining it. Readiness proxies to the Coordinator.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              # Endpoint removal and connection draining propagate at different
              # speeds; sleeping through the gap is what drops zero requests.
              exec:
                command: ["/bin/sh", "-c", "sleep 5; nginx -s quit"]
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "swgw.nginxContainerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: oidc
              mountPath: /oidc
              readOnly: true
      volumes:
        - name: oidc
          secret:
            secretName: {{ include "swgw.fullname" . }}-state
            # Optional: the UI must LOAD before anybody can be told why they
            # cannot sign in.
            optional: true
            items:
              - key: web.json
                path: web.json
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "swgw.fullname" . }}-web
  labels:
    {{- include "swgw.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "swgw.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
{{- end }}
{{- end }}
