# Source: good-app/templates/db-secret.yaml
# An empty shell. The release ships the object so that everything referring to
# it resolves, and the platform's secret store fills it in at install time -
# so no credential ever travels inside the chart.
apiVersion: v1
kind: Secret
metadata:
  name: good-app-db
  namespace: good
  labels:
    app.kubernetes.io/name: good-app
    app.kubernetes.io/instance: good-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: good-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.4.2
  annotations:
    acme.example/populated-by: platform-vault
type: Opaque
stringData:
  # The key is declared so everything referring to it resolves; the value is
  # written at install time by the platform's secret store. Nothing sensitive
  # travels inside the chart.
  password: ""
