apiVersion: softwaregateway.io/v1alpha1
kind: PolicyPack
metadata:
  name: sgw-baseline-disruption
  prefix: PDB
  version: 2.0.0
  description: >
    Staying available while the platform is maintained. These checks are about
    what happens when a server is taken out for patching, and about whether an
    update can start, finish, and be seen to have finished.
  maintainer: platform-sre
  reference: docs/compliance/source-standards.md - 2. Disruption & Availability
spec:
  checks:
    - id: PDB-01
      title: A service with more than one copy survives planned maintenance
      description: >
        A service running two or more copies ships a rule saying how many copies
        must stay running while servers are patched. Kubernetes calls that rule a
        PodDisruptionBudget.
      rationale: >
        When a server is taken offline for patching, the platform asks each
        service how many copies it can spare. A service that has not answered is
        assumed to be able to spare all of them, so every copy can be stopped at
        the same moment. The service goes fully offline during what was meant to
        be routine, non-disruptive maintenance, and the maintenance itself
        reports success.
      severity: critical
      tier: 1
      category: Disruption & Availability
      subcategory: PodDisruptionBudget
      keywords: [PodDisruptionBudget, PDB, policy/v1, eviction, "node drain", minAvailable, maxUnavailable, replicas]
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-01
      remediation: >
        Ship a PodDisruptionBudget whose selector matches this workload's pod
        labels, allowing at most one copy to be unavailable at a time.
      fixExample: |
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        metadata:
          name: my-service
        spec:
          maxUnavailable: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: my-service
              app.kubernetes.io/instance: my-release
      appliesTo:
        kinds: [Deployment, StatefulSet]
        where: 'replicas(self) >= 2'
      assert:
        expr: 'size(pdbFor(self)) > 0'
        locus: metadata.labels
        expected: a rule in this release saying how many copies must stay running during maintenance
        observed: '"no such rule matches this workload"'
        message: |
          text(self, "metadata.name") + " runs " + string(replicas(self)) +
          " copies, and the chart does not tell the platform how many must stay running during " +
          "maintenance. When a server is drained for patching, all " + string(replicas(self)) +
          " copies can be stopped at once and the service goes fully offline."

    - id: PDB-02
      title: No rule makes maintenance impossible
      description: >
        A maintenance rule always leaves the platform at least one copy it may
        move. The allowance is computed from the rule and the copy count, so the
        percentage forms are covered as well as the plain numbers.
      rationale: >
        A rule that leaves no copy movable can never be satisfied, because
        moving a copy means stopping it first. Maintenance on any server hosting
        this service waits for permission that will never be granted, so a
        cluster-wide patch stalls until an engineer intervenes by hand.

        The percentages are where this actually happens. "At most 10% may be
        unavailable" reads as generous, and on a service running one copy it
        rounds down to none at all - so the rule that looks the most permissive
        in the chart is the one that stops the drain. Kubernetes rounds the
        minimum up and the maximum down, and both roundings land on zero for
        small services.
      severity: critical
      tier: 1
      category: Disruption & Availability
      subcategory: PodDisruptionBudget
      keywords: [PodDisruptionBudget, PDB, maxUnavailable, minAvailable, eviction, "node drain", deadlock, percentage]
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-02
      remediation: >
        Set the rule so that at least one copy can be moved: maxUnavailable 1,
        or a minimum below the copy count. Check the arithmetic on a percentage -
        10% of one copy is none.
      fixExample: |
        spec:
          maxUnavailable: 1     # one copy may be moved at a time
      appliesTo:
        kinds: [PodDisruptionBudget]
      assert:
        # Computed, not pattern-matched. Matching the literal `minAvailable: 1`
        # reports the configuration this organization's own standard recommends
        # for a two-copy service, and misses `maxUnavailable: 10%` over one copy,
        # which is a real deadlock.
        expr: 'disruptionsAllowed(self) != 0'
        locus: spec
        expected: a rule that leaves at least one copy movable
        observed: |
          "allows " + string(disruptionsAllowed(self)) + " of the covered copies to be moved: " +
          (present(self, "spec.maxUnavailable")
            ? "at most " + text(self, "spec.maxUnavailable") + " may be unavailable"
            : "at least " + text(self, "spec.minAvailable") + " must stay running")
        effective: |
          "0 copies may be moved" +
          (text(self, "spec.maxUnavailable").endsWith("%") || text(self, "spec.minAvailable").endsWith("%")
            ? " - the percentage rounds down to zero against the number of copies this service runs"
            : "")
        message: |
          "the rule " + text(self, "metadata.name") + " leaves no copy the platform may move" +
          (text(self, "spec.maxUnavailable").endsWith("%") || text(self, "spec.minAvailable").endsWith("%")
            ? " - the percentage rounds to zero against the number of copies this service runs, so it " +
              "reads as permissive and is absolute"
            : "") +
          ". Patching any server that hosts this service will wait for permission that can never be " +
          "granted, and a cluster upgrade stalls until somebody intervenes."

    - id: PDB-11
      title: A maintenance rule actually protects something
      description: >
        A maintenance rule does not allow every copy to be moved at once -
        a minimum of zero, or an allowance that reaches the whole copy count.
      rationale: >
        A rule like this is a no-op. It is in the chart, it appears in
        inventories, it passes review - and it permits exactly what it looks
        like it prevents. That is more dangerous than having no rule at all,
        because a missing rule is visible and a useless one is not: the drain
        that takes the service fully offline is approved by a policy somebody
        wrote to stop it.
      severity: warning
      tier: 1
      category: Disruption & Availability
      subcategory: PodDisruptionBudget
      keywords: [PodDisruptionBudget, PDB, minAvailable, maxUnavailable, "node drain", eviction, no-op]
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-02 (the other end of the same range)
      remediation: >
        Set the minimum to the number of copies that must keep serving, or the
        maximum to the number that may go at once. On a service running three
        copies, minAvailable 2 or maxUnavailable 1.
      fixExample: |
        spec:
          minAvailable: 2       # of three copies, two keep serving
      appliesTo:
        kinds: [PodDisruptionBudget]
        # -1 is a rule stating neither bound and -2 one that selects nothing;
        # both are other checks' to report. A rule over a single copy is
        # PDB-03's: there is nothing to protect either way, and reporting it
        # twice with one fix between the two is the pattern this pack removed
        # everywhere else.
        where: |
          disruptionsAllowed(self) >= 0 &&
          covers(self).exists(w, declaresReplicas(w) && replicas(w) >= 2)
      assert:
        expr: |
          covers(self).all(w, !declaresReplicas(w) || disruptionsAllowed(self) < replicas(w))
        locus: spec
        expected: a rule that keeps at least one copy running
        observed: |
          "allows every copy to be moved at once: " +
          (present(self, "spec.minAvailable")
            ? "at least " + text(self, "spec.minAvailable") + " must stay running"
            : "at most " + text(self, "spec.maxUnavailable") + " may be unavailable")
        message: |
          "the rule " + text(self, "metadata.name") + " allows every copy of " +
          sorted(covers(self).filter(w, declaresReplicas(w))
                      .map(w, string(value(w, "metadata.name")))).join(", ") +
          " to be moved at the same time. It exists, it appears in inventories and it passes review, " +
          "and it will not stop a drain from taking the service fully offline."

    - id: PDB-03
      title: A single copy is not given a rule that cannot help it
      description: >
        A maintenance rule does not cover a service that runs only one copy,
        where the rule still permits that copy to be moved. Where it does NOT
        permit it, that is a deadlock and PDB-02 reports it instead.
      rationale: >
        A rule over a single copy has no availability to protect: there is
        nothing to keep running while the copy moves. At best it is a rule that
        does nothing, in a chart where somebody believed it did something; at
        worst - a minimum of one, a percentage that rounds up - it refuses every
        move and stalls maintenance, which is the more serious finding and is
        reported separately.
      severity: warning
      tier: 1
      category: Disruption & Availability
      subcategory: PodDisruptionBudget
      keywords: [PodDisruptionBudget, PDB, minAvailable, "single replica", eviction, "node drain"]
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-03
      remediation: >
        Either run two or more copies, so the rule has something to protect, or
        drop the rule and accept a brief restart during maintenance.
      fixExample: |
        # Either raise the copy count...
        spec:
          replicas: 2
        # ...or drop the PodDisruptionBudget for this workload entirely.
      appliesTo:
        kinds: [PodDisruptionBudget]
        # A rule that leaves no copy movable is a deadlock, and PDB-02 owns it.
        # Two findings on one decision, with one fix between them, is how a
        # report doubles its count and halves its credibility.
        where: 'disruptionsAllowed(self) != 0'
      assert:
        expr: 'covers(self).all(w, !declaresReplicas(w) || replicas(w) >= 2)'
        locus: spec.selector
        expected: covering only services that run two or more copies
        observed: 'sorted(covers(self).filter(w, declaresReplicas(w) && replicas(w) < 2).map(w, string(value(w, "metadata.name")) + " runs a single copy")).join(", ")'
        effective: |
          "no eviction can ever be approved for " +
          sorted(covers(self).filter(w, declaresReplicas(w) && replicas(w) < 2)
                      .map(w, string(value(w, "metadata.name")))).join(", ") +
          ", because there is no second copy to keep running"
        message: |
          "the rule " + text(self, "metadata.name") + " protects " +
          sorted(covers(self).filter(w, declaresReplicas(w) && replicas(w) < 2)
                      .map(w, string(value(w, "metadata.name")))).join(", ") +
          ", which runs a single copy. It reads as a guarantee that the service stays up during " +
          "maintenance. In practice there is no second copy to keep running, so the platform can " +
          "never be given permission to move the one that exists - maintenance on its node waits " +
          "for somebody to intervene. Either run two copies and allow one to be unavailable, or " +
          "remove the rule and accept a brief restart."

    - id: PDB-05
      title: An update can always get started
      description: >
        A service that replaces its copies one at a time allows either a
        temporary extra copy or a temporarily missing one - at least one of the
        two.
      rationale: >
        If neither is allowed, the update has nowhere to begin. It cannot start a
        new copy without room for it, and it cannot stop an old one without
        breaking its own availability promise. The update reports that it is
        progressing, forever, and never progresses.
      severity: critical
      tier: 1
      category: Disruption & Availability
      subcategory: Rollout strategy
      keywords: [RollingUpdate, maxSurge, maxUnavailable, spec.strategy, rollout, rollingUpdate]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-05
      remediation: Set maxSurge to 1, or maxUnavailable to 1.
      fixExample: |
        spec:
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1          # one extra copy while updating
              maxUnavailable: 0
      appliesTo:
        kinds: [Deployment]
        where: 'text(self, "spec.strategy.type") == "RollingUpdate"'
      assert:
        expr: |
          text(self, "spec.strategy.rollingUpdate.maxSurge") != "0" ||
          text(self, "spec.strategy.rollingUpdate.maxUnavailable") != "0"
        locus: spec.strategy.rollingUpdate
        expected: room for either one extra copy or one missing copy during an update
        observed: '"no extra copy allowed and no missing copy allowed"'

    - id: PDB-06
      title: Updates do not take the service offline
      description: >
        A service that receives traffic starts its new copies before stopping the
        old ones, rather than stopping all of them first.
      rationale: >
        Stopping every copy before starting any is a complete outage on every
        single update, by design - not a risk, a certainty. It lasts from the
        moment the last old copy stops until the first new one is ready. It is
        usually copied from a chart for something that had no traffic.
      severity: critical
      tier: 1
      category: Disruption & Availability
      subcategory: Rollout strategy
      keywords: [Recreate, RollingUpdate, spec.strategy.type, rollout, downtime]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-06
      remediation: Set the update strategy to RollingUpdate.
      fixExample: |
        spec:
          strategy:
            type: RollingUpdate
            rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
      appliesTo:
        kinds: [Deployment]
        where: 'size(servicesFor(self)) > 0'
      assert:
        expr: 'text(self, "spec.strategy.type") != "Recreate"'
        locus: spec.strategy.type
        expected: new copies started before old ones stop (RollingUpdate)
        observed: '"Recreate - every copy stops before any new one starts"'
        message: |
          text(self, "metadata.name") + " receives live traffic and is set to stop every copy " +
          "before starting any new one. Every update to it is a full outage, every time."

    - id: PDB-07
      title: A stuck update is reported instead of hanging
      description: >
        A service states how long an update may take before the platform declares
        it failed.
      rationale: >
        Without a deadline, an update that will never succeed is reported as
        still in progress, and anything waiting on it waits forever rather than
        failing and telling somebody. The release appears to be mid-deployment
        for hours.
      severity: warning
      tier: 1
      category: Disruption & Availability
      subcategory: Rollout strategy
      keywords: [progressDeadlineSeconds, rollout, ProgressDeadlineExceeded, "stuck deployment"]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-07
      remediation: >
        Set spec.progressDeadlineSeconds to comfortably more than a normal update
        takes - 600 is a common starting point.
      fixExample: |
        spec:
          progressDeadlineSeconds: 600
      appliesTo:
        kinds: [Deployment]
      assert:
        required: [spec.progressDeadlineSeconds]

    - id: PDB-08
      title: Shutdown time is stated rather than left to the platform
      description: >
        A workload says how long it needs to finish work in progress before it is
        stopped, instead of relying on the platform's 30-second default.
      rationale: >
        Thirty seconds is usually enough, so this is a documentation gap rather
        than a defect - which is why it is recorded and not a warning. It matters
        where requests can take longer than that: those requests are cut off part
        way through on every restart, update and maintenance event, and nothing
        in the chart records that the author had considered it.
      severity: inform
      tier: 1
      category: Disruption & Availability
      subcategory: Graceful shutdown
      keywords: [terminationGracePeriodSeconds, SIGTERM, "grace period", "graceful shutdown"]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-08
      remediation: >
        Set terminationGracePeriodSeconds to at least as long as the longest
        piece of work the service can be in the middle of.
      fixExample: |
        spec:
          template:
            spec:
              terminationGracePeriodSeconds: 45
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob, Pod]
        subject: podSpec
      assert:
        expr: 'present(self, "terminationGracePeriodSeconds")'
        locus: terminationGracePeriodSeconds
        expected: a stated shutdown time
        observed: '"not declared, so the platform allows 30 seconds"'
        message: |
          text(owner, "kind") + " " + text(owner, "metadata.name") +
          " does not say how long it needs to finish work in progress before being stopped. " +
          "The platform will allow 30 seconds. Declare the value if anything this service does " +
          "can take longer than that."

    - id: PDB-09
      title: Every maintenance rule protects a real service
      description: >
        A maintenance rule's selector matches at least one workload in the
        release.
      rationale: >
        A rule whose labels match nothing protects nothing. It is in the chart,
        it passes review, and it provides exactly zero protection - which is the
        most dangerous kind of failure, because everything about it looks
        correct. It is discovered when a drain succeeds that should have been
        refused.
      severity: warning
      tier: 1
      category: Disruption & Availability
      subcategory: PodDisruptionBudget
      keywords: [PodDisruptionBudget, PDB, spec.selector, matchLabels, orphan, eviction]
      confidence: confirmed
      whenItBites: node-maintenance
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-09 (proposed addition)
      remediation: >
        Make the rule's selector match the labels on the workload's pod template -
        the labels under spec.template.metadata.labels, which are often not the
        same as the workload's own labels.
      fixExample: |
        spec:
          maxUnavailable: 1
          selector:
            matchLabels:                          # must match the POD labels
              app.kubernetes.io/name: my-service
              app.kubernetes.io/instance: my-release
      appliesTo:
        kinds: [PodDisruptionBudget]
      assert:
        expr: 'size(covers(self)) > 0'
        locus: spec.selector
        expected: a selector matching at least one workload in this release
        observed: 'selectorKeys(self).size() == 0 ? "no selector at all" : "selects on " + selectorKeys(self).join(", ") + ", which matches nothing here"'
        message: |
          "the rule " + text(self, "metadata.name") + " matches no workload in this release, so it " +
          "protects nothing. It will look correct in review and provide no protection at all during " +
          "maintenance."

    - id: PDB-10
      title: No service is stopped instantly
      description: >
        No workload sets its shutdown time to zero.
      rationale: >
        Zero means the service is killed outright the moment it is asked to stop,
        with no chance to finish the request it is handling, flush what it has
        buffered, or release a lock it holds. It is a common leftover from a
        debugging session, and it turns every ordinary restart into data loss.
      severity: warning
      tier: 1
      category: Disruption & Availability
      subcategory: Graceful shutdown
      keywords: [terminationGracePeriodSeconds, SIGKILL, "grace period", "graceful shutdown"]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - PDB-08 (the explicit-zero half)
      remediation: >
        Set terminationGracePeriodSeconds to the time the service needs to finish
        what it is doing. Thirty seconds is the platform default and a reasonable
        starting point.
      fixExample: |
        spec:
          template:
            spec:
              terminationGracePeriodSeconds: 30
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, Job, CronJob, Pod]
        subject: podSpec
      assert:
        expr: '!present(self, "terminationGracePeriodSeconds") || int(value(self, "terminationGracePeriodSeconds")) > 0'
        locus: terminationGracePeriodSeconds
        expected: a shutdown time above zero
        observed: '"0 - the service is killed immediately and work in progress is lost"'
        message: |
          text(owner, "kind") + " " + text(owner, "metadata.name") +
          " is killed the instant it is asked to stop. Whatever request it was handling is dropped, " +
          "on every restart, update and maintenance event."
