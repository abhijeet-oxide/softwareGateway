# What Flux applies in this cluster for this product, and nothing else. Flux
# reconciles many applications here; this is the one directory that is ours.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: software-gateway
  namespace: flux-system
spec:
  interval: 5m
  # A failed apply is retried in a minute rather than waiting out the interval
  # above, so a transient admission or registry error costs a minute.
  retryInterval: 1m
  path: ./deploy/environments/prod
  # PRUNE. An object removed from Git is removed from the cluster. Without it,
  # deleting a manifest leaves it running forever and Git stops being the
  # answer to "what is deployed".
  prune: true
  wait: true
  # Long enough for the database layer to bootstrap and the platform layer to
  # roll: both are waited on, and both are waited on in sequence.
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: software-gateway
  healthChecks:
    # THE TWO LAYERS, not the workloads. This reconciler's job is to create the
    # ordered pair below it; each of those waits for its own contents, and the
    # platform one will not begin until the database one reports Ready.
    #
    #   software-gateway-prod-database   the CloudNativePG Cluster
    #   software-gateway-prod-platform   dependsOn the above; the Helm release
    #
    # So "this cluster is up to date" means both layers converged, which is the
    # question somebody watching a deploy is actually asking.
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: software-gateway-prod-database
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: software-gateway-prod-platform
      namespace: flux-system
