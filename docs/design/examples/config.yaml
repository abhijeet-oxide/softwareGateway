# Example release route for a site configuration.
#
# Targets declare the registry locations for each stage. These tasks define the
# ordered moves a release may make through those stages.
stage:
  tasks:
    - name: download
      displayName: Download
      from: source
      to: external
      verify: enforce
      compliance: enforce
      scanners:
        - xray
        - anchore

    - name: onboard
      displayName: Onboard to Lab
      from: external
      to: lab
      purge: true
      compliance: enabled
      scanners:
        - xray
        - anchore

    - name: promote
      displayName: Promote to Prod
      from: lab
      to: prod
      scanners:
        - xray