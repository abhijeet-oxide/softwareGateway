# LAB. Deployed from branch `lab`, into namespace swgw-lab.
#
# This is the same chart, the same images and the same config/ that production
# runs. What differs is stated below and nowhere else - if a difference is not
# in this file, it does not exist.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: software-gateway
  namespace: swgw-lab
spec:
  interval: 10m
  releaseName: swgw
  chart:
    spec:
      chart: software-gateway
      # THE DEPLOYMENT POINTER. One line, moved by the release pipeline on
      # every merge to `lab`, and by a person in a pull request to pin or roll
      # back. `git log -p` on this file is the deployment history.
      #
      # A version and not a range: `>=1.0.0` would have Flux deploy whatever
      # appeared in the registry, which is a deployment nobody performed.
      version: 0.0.0
      sourceRef:
        kind: HelmRepository
        name: software-gateway
        namespace: flux-system
      interval: 0s   # the pipeline pushes the pointer; no registry polling

  install:
    remediation:
      retries: 3
    # The seeding Job and the ZITADEL setup Job take a few minutes on a first
    # install, and Flux waits for every object to be ready.
    timeout: 20m
  upgrade:
    # WHAT MAKES A BAD RELEASE HARMLESS. maxUnavailable is 0, so a replica is
    # only replaced once its successor is READY - and readiness on the
    # Coordinator means the database answers, the schema matches the binary and
    # products loaded. A broken image therefore stalls with the old pods still
    # serving, this timeout fires, and Flux puts the previous release back.
    # Nothing went down at any point.
    timeout: 15m
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: rollback
    # Drift is corrected rather than reported: a `kubectl edit` on a Deployment
    # here is undone on the next reconcile, which is what makes Git the answer
    # to "what is running".
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  test:
    enable: false

  values:
    # --- where it is ------------------------------------------------------
    externalUrls:
      web: https://swgw-lab.example.com
      identity: https://id-swgw-lab.example.com
    tenant: default

    ingress:
      enabled: true
      className: nginx
      app:
        host: swgw-lab.example.com
        tls: {enabled: true, secretName: swgw-lab-tls}
      identity:
        host: id-swgw-lab.example.com
        tls: {enabled: true, secretName: id-swgw-lab-tls}

    # --- images -----------------------------------------------------------
    image:
      registry: artifactory.internal.example.com
      repository: swgw
    secrets:
      backend: vault
      vault:
        authRef: vault-auth
        mount: kv
        # THE ONE LINE THAT SEPARATES LAB CREDENTIALS FROM PRODUCTION'S.
        # config/secrets/secrets.yaml carries the leaf; this is the root.
        pathPrefix: softwaregateway/lab
      registryPullSecret:
        enabled: true
        name: jfrog
        from: jfrog

    # --- size -------------------------------------------------------------
    # Smaller than production, and deliberately NOT a single replica of
    # anything that takes traffic: a lab that runs one coordinator cannot
    # demonstrate that a rollout drops no requests, which is most of what a lab
    # is for.
    coordinator:
      replicas: 2
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 512Mi}
    worker:
      replicas: 2
      resources:
        requests: {cpu: 250m, memory: 256Mi}
        limits: {memory: 512Mi}
    web:
      replicas: 2
      # Who somebody is told to ask when this deployment will not let them in.
      supportContact: swgw-admin@example.com
    cerbos:
      replicas: 1

    # --- data -------------------------------------------------------------
    # The CloudNativePG Cluster is applied by the layer BEFORE this one, so
    # there is nothing to deploy here - only the Secret it publishes. The
    # operator generates the password, so it appears in no file.
    database:
      existingSecret: swgw-db-app
      host: swgw-db-rw

    # --- identity ---------------------------------------------------------
    identity:
      enabled: true
      masterkey:
        existingSecret: swgw-zitadel
        key: masterkey
      rootPassword:
        existingSecret: swgw-zitadel
        key: rootPassword
      bootstrapAdmin:
        username: admin
        email: swgw-admin@example.com
      sso:
        issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
        clientId: "00000000-0000-0000-0000-000000000000"
        existingSecret: swgw-sso
        displayName: Microsoft

    metrics:
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
      allowFromNamespaces: [monitoring]

    settings:
      # Lab is where a change to scheduling behaviour is watched, so it ticks
      # faster and says more. Neither is a difference in what the software
      # does, which is the rule for anything that may differ between here and
      # production.
      SWGW_OBSERVABILITY_LOG_LEVEL: debug
