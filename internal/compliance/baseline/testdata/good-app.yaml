      annotations:
        checksum/config: "3a1f0c9d6b2e4857aa019f3c4d5e6b7089ac1d2e3f405162738495a6b7c8d9e0"
    spec:
      serviceAccountName: good-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: good-db
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: good-db
      volumes:
        - name: config
          configMap:
            name: good-app-config
            items:
              - {key: log.level, path: log.level}
      initContainers:
        - name: wait-for-config
          image: registry.acme.example/good/wait@sha256:c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00
          command: ["/bin/wait", "--for", "/etc/db/config/log.level"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /var/lib/db
            - name: config
              mountPath: /etc/db/config
      containers:
        - name: db
          image: registry.acme.example/good/db@sha256:9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0
          ports:
            - name: pg
              containerPort: 5432
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: pg
            timeoutSeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
            # A data volume and read-only program files are independent: the
            # database writes to /var/lib/db, which is a mount, not its own
            # root filesystem.
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/db
  volumeClaimTemplates:
    - metadata:
        name: data
