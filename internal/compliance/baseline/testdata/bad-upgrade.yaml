# What the release does outside the ordinary install: the tasks Helm runs, and
# the definitions it would take away with it.
---
# Source: bad-upgrade/templates/hook-rollback-only.yaml
# The finding this fixture exists for. This task runs ONLY when Helm rolls
# back. This platform reconciles a declared state forward and never issues a
# rollback, so the task never runs - including when the release is moved to an
# earlier version, which arrives here as an ordinary upgrade. Whatever it was
# written to undo does not get undone.
apiVersion: batch/v1
kind: Job
metadata:
  name: undo-migration
  namespace: bad
  annotations:
    helm.sh/hook: pre-rollback,post-rollback
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: undo-migration}}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: undo
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
---
# Source: bad-upgrade/templates/hook-misspelled.yaml
# "post-instal" is not a moment Helm recognises, so this task simply never
# runs - and the upgrade reports success anyway.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-service
  namespace: bad
  annotations:
    helm.sh/hook: post-instal
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: register-service}}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: register
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
---
# Source: bad-upgrade/templates/hook-forcing.yaml
# A task that forces its way past the platform's own safeguards, including the
# maintenance rules the disruption checks are about.
apiVersion: batch/v1
kind: Job
metadata:
  name: clear-the-way
  namespace: bad
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: clear-the-way}}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: clear
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
          command: ["kubectl", "delete", "pod", "-l", "app=old", "--force", "--grace-period=0"]
---
# Source: bad-upgrade/templates/crd.yaml
# No keep policy: uninstalling this release deletes every Gadget in the
# cluster, including ones belonging to other teams.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.acme.example
spec:
  group: acme.example
  names:
    kind: Gadget
    plural: gadgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
