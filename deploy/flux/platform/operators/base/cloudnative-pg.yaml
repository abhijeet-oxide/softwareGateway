apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  releaseName: cloudnative-pg
  storageNamespace: cnpg-system

  chart:
    spec:
      chart: cloudnative-pg
      version: 0.27.1
      sourceRef:
        kind: HelmRepository
        name: internal-charts
        namespace: flux-system
      interval: 0s

  install:
    crds: Create
    timeout: 10m
  upgrade:
    # THE ONE THAT IS NOT A DEFAULT. `helm upgrade` does not touch CRDs at all -
    # it installs them once and never again - so an operator upgraded to a
    # version whose Cluster schema gained a field would run against the old CRD,
    # and the new field would be silently dropped by the API server on every
    # apply. CreateReplace moves them with the operator.
    crds: CreateReplace
    timeout: 10m
    remediation:
      # NO AUTOMATIC ROLLBACK, deliberately.
      retries: 0
  driftDetection:
    mode: enabled

  values:
    image:
      repository: artifactory.internal.example.com/docker/cloudnative-pg/cloudnative-pg
    imagePullSecrets:
      - name: artifactory-secret
    replicaCount: 1
    resources:
      requests: {cpu: 100m, memory: 200Mi}
      limits: {memory: 400Mi}
