# Source: bad-pdb/templates/recreate.yaml
# Recreate stops every pod before starting any. For a workload with traffic
# that is a deliberate outage on every upgrade, and it is usually copied from a
# chart for something that had none. Also declares no progress deadline, so a
# stuck rollout reports progress forever.
apiVersion: apps/v1
kind: Deployment
metadata: {name: recreate, namespace: bad}
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: recreate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: recreate}
    spec:
      containers:
        - name: recreate
          image: registry.acme.example/bad/recreate@sha256:6666666666666666666666666666666666666666666666666666666666666666
