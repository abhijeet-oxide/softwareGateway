# equally as Kubernetes requires for extended resources.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: good-dataplane
  namespace: good
  labels:
    app.kubernetes.io/name: good-dataplane
    app.kubernetes.io/instance: good-app
    app.kubernetes.io/component: dataplane
    app.kubernetes.io/part-of: good-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.4.2
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: good-dataplane
      app.kubernetes.io/instance: good-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: good-dataplane
        app.kubernetes.io/instance: good-app
        app.kubernetes.io/component: dataplane
        app.kubernetes.io/part-of: good-platform
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: 1.4.2
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      serviceAccountName: good-dataplane
      nodeSelector:
        acme.example/dataplane: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: acme.example/dataplane, operator: In, values: ["true"]}
      tolerations:
        - {key: acme.example/dataplane, operator: Exists, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        # Access to the shared folder by group membership, rather than by owning
        # its files - which is what keeps a start-up ownership rewrite from ever
        # being needed.
        supplementalGroups: [20001]
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      volumes:
        # Memory-backed scratch, with a ceiling. Without one it is bounded only
        # by the server's memory, and filling it evicts every other pod there.
        - name: fastpath-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: shared-state
          persistentVolumeClaim:
            claimName: good-dataplane-shared
      containers:
        - name: dataplane
          image: registry.acme.example/good/dataplane@sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          volumeMounts:
            - {name: fastpath-scratch, mountPath: /run/fastpath}
