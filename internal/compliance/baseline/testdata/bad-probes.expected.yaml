findings:
  # Behind a Service, declares a port, no readiness probe.
  - {check: PRB-01, kind: Deployment, name: api, container: unprobed}
  # A 120-second blind liveness delay with no startup probe.
  - {check: PRB-02, kind: Deployment, name: api, container: misconfigured}
  # Liveness more sensitive than readiness: period 2 against readiness' 5.
  - {check: PRB-03, kind: Deployment, name: api, container: same-handler}
  # And again here - liveness period 10 against readiness' 60, which is the
  # same defect arrived at by tuning readiness up rather than liveness down.
  - {check: PRB-03, kind: Deployment, name: api, container: misconfigured}
  # Identical handlers.
  - {check: PRB-04, kind: Deployment, name: api, container: same-handler}
  # timeoutSeconds 30 and periodSeconds 60, both outside the bounds.
  - {check: PRB-05, kind: Deployment, name: api, container: misconfigured}
  # Probe port 9999 is not declared by this container.
  - {check: PRB-06, kind: Deployment, name: api, container: misconfigured}
  # A 600-second preStop sleep against a 20-second grace period: SIGKILL every
  # time, guaranteed.
  - {check: PRB-07, kind: Deployment, name: api, container: misconfigured}
  # A time limit longer than the gap between attempts: the checks overlap and
  # failure detection stops having any upper bound.
  - {check: PRB-08, kind: Deployment, name: api, container: same-handler}
  # A restart check on a task that is meant to finish and exit.
  - {check: PRB-09, kind: Job, name: migrate, container: migrate}
  # Fifteen seconds of start-up allowance: it looks like protection and still
  # kills the container mid-start.
  - {check: PRB-11, kind: Deployment, name: slowstart, container: slowstart}
  # And nothing from numeric-probe-port: a numeric probe port resolves whether
  # or not the container lists it, so reporting one is a finding with no fix.
