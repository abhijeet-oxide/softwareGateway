apiVersion: softwaregateway.io/v1alpha1
kind: PolicyPack
metadata:
  name: sgw-baseline-config
  prefix: CFG
  version: 2.0.0
  description: >
    What the release puts where other people can read it, and whether a change to
    its settings actually reaches the running software.
  maintainer: platform-sre
  reference: docs/compliance/source-standards.md - 6. Configuration & Secrets
spec:
  checks:
    # ------------------------------------------------------------------
    # How a credential is recognised.
    #
    # The four checks below share one detector, and it looks at the VALUE
    # first. A value shaped like a private key, a signed token, a cloud access
    # key, a connection string with the password in it, or a well-known
    # placeholder is reported whatever the field is called - which is the half
    # that a name-driven detector misses entirely.
    #
    # The field name is used only to corroborate the one case where the shape
    # is not conclusive: an ordinary-looking literal in a field named for a
    # credential. Before that name is trusted at all, fields naming a
    # parameter ABOUT a credential are excluded - a retry count, a cache
    # lifetime, a minimum length, a file path, a class name - because those are
    # the ordinary way to configure credential handling and every one of them
    # was previously reported as a leaked credential.
    #
    # No finding ever prints the value it found. A compliance report is itself
    # something that gets forwarded, and a report quoting the password has
    # copied the exposure rather than described it.
    # ------------------------------------------------------------------

    - id: CFG-01
      title: No credential is written into ordinary configuration
      description: >
        No value in a ConfigMap is a password, token, key or connection string
        written in plain text.
      rationale: >
        A ConfigMap is readable by anybody who can read the namespace, which is a
        far wider group than can read a Secret, and it appears in backups, in
        exports and in every copy of the release anybody has taken. A credential
        there has to be treated as compromised from the moment it was written.
      severity: critical
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials in configuration
      keywords: [ConfigMap, data, password, token, "api key", plaintext, credential]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: medium
      reference: source-standards.md - CFG-01
      remediation: >
        Move the value into a Secret and refer to it with secretKeyRef, or fetch
        it from the organization's secret store when the release is installed.
      fixExample: |
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef: {name: my-service-db, key: password}
      appliesTo:
        kinds: [ConfigMap]
        where: 'value(self, "data") != null'
      assert:
        expr: 'self.data.all(k, !looksLikeCredential(k, string(self.data[k])))'
        locus: data
        expected: no credential material in ordinary configuration
        observed: |
          sorted(self.data.filter(k, looksLikeCredential(k, string(self.data[k])))
            .map(k, k + " holds " + credentialClass(k, string(self.data[k])))).join(", ")
        message: |
          "ConfigMap " + text(self, "metadata.name") + " holds " +
          sorted(self.data.filter(k, looksLikeCredential(k, string(self.data[k])))
            .map(k, credentialClass(k, string(self.data[k])) + " under the key \"" + k + "\"")).join(", ") +
          ". Anybody who can read this namespace can read it, and it is in every copy and backup of " +
          "this release. Treat it as already exposed."

    - id: CFG-13
      title: No credential is written into a container's environment
      description: >
        No environment variable is given a password, token, key or connection
        string as a literal value. Only values that are recognisably credential
        material are reported here - a private key, a signed token, a cloud
        access key, a connection string with the password in it, or a well-known
        placeholder.
      rationale: >
        A literal in the environment is part of the object that describes the
        pod, so it is visible to anybody who can read that object, it is printed
        by ordinary troubleshooting commands, and it is captured in crash
        reports and by any code that logs its own environment on start-up. A
        reference to a Secret is not: only the running process ever sees the
        value.
      severity: critical
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials in the environment
      keywords: [env, value, secretKeyRef, password, token, credential, "environment variable"]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-01 (environment half)
      remediation: >
        Replace the literal with a secretKeyRef pointing at a Secret.
      fixExample: |
        env:
          - name: API_TOKEN
            valueFrom:
              secretKeyRef: {name: my-service-api, key: token}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: 'present(self, "env")'
      assert:
        expr: |
          self.env.all(e,
            !present(e, "value") ||
            string(value(e, "name")).matches("(?i)(tls|ssl)?_?(cert|certificate|key|pem|ca_?bundle)$") ||
            credentialShape(string(value(e, "value"))) == "")
        locus: env
        expected: credentials referenced from a Secret, not written out
        observed: |
          sorted(self.env.filter(e, present(e, "value") &&
                             !string(value(e, "name")).matches("(?i)(tls|ssl)?_?(cert|certificate|key|pem|ca_?bundle)$") &&
                             credentialShape(string(value(e, "value"))) != "")
            .map(e, string(value(e, "name")) + " holds " +
                    credentialShape(string(value(e, "value"))))).join(", ")

    - id: CFG-16
      title: An opaque value in a credential-named variable is what it looks like
      description: >
        Where an environment variable is named for a credential and holds an
        opaque literal that is not recognisably credential material, it is
        reported for review. Values that match the name of a Secret or ConfigMap
        the release ships are treated as references and are not reported.
      rationale: >
        This is an inference about a value, not a reading of one, so it is
        separated from CFG-13 and rated for what it is. A variable called
        APP_SESSION_SECRET holding "session-store-v1" follows the naming
        convention of the other objects in the release rather than the shape of
        credential material - it is almost certainly the name of something the
        application resolves at run time. Reporting that at the highest severity
        AND the highest confidence at once is how a report loses an argument it
        should not have started.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials in the environment
      keywords: [env, value, secretKeyRef, password, token, credential, entropy, reference]
      confidence: needs-review
      whenItBites: continuously
      fixOwner: needs-decision
      fixEffort: low
      reference: source-standards.md - CFG-01 (the inferred half)
      remediation: >
        Confirm what the value is. If it is a credential, move it into a Secret
        and reference it with secretKeyRef; if it names something the
        application looks up, no change is needed.
      fixExample: |
        env:
          # A reference, which is what this usually turns out to be:
          - name: APP_SESSION_STORE
            value: session-store-v1
          # A credential, which is not:
          - name: APP_SESSION_SECRET
            valueFrom:
              secretKeyRef: {name: session-signing, key: secret}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: 'present(self, "env")'
      assert:
        expr: |
          self.env.all(e,
            !present(e, "value") ||
            credentialShape(string(value(e, "value"))) != "" ||
            shippedObjectName(string(value(e, "value"))) ||
            !looksLikeCredential(string(value(e, "name")), string(value(e, "value"))))
        locus: env
        expected: a credential-named variable holding something identifiable
        observed: |
          sorted(self.env.filter(e, present(e, "value") &&
                             credentialShape(string(value(e, "value"))) == "" &&
                             !shippedObjectName(string(value(e, "value"))) &&
                             looksLikeCredential(string(value(e, "name")), string(value(e, "value"))))
            .map(e, string(value(e, "name")) + " holds an opaque literal")).join(", ")
        message: |
          "in this container, " +
          sorted(self.env.filter(e, present(e, "value") &&
                             credentialShape(string(value(e, "value"))) == "" &&
                             !shippedObjectName(string(value(e, "value"))) &&
                             looksLikeCredential(string(value(e, "name")), string(value(e, "value"))))
            .map(e, string(value(e, "name")))).join(", ") +
          " is named for a credential and holds a literal. It does not have the shape of credential " +
          "material and it does not name anything this release ships, so somebody who knows this " +
          "workload has to say which it is."

    - id: CFG-14
      title: The chart does not carry credentials inside it
      description: >
        No Secret in the release ships with credential material already in it.
        Values are decoded first, and a configuration file shipped as one value
        is read field by field - so a template whose password fields are empty,
        waiting to be filled in at install time, passes.
      rationale: >
        Anything inside a chart is in version control, in every mirror, in every
        archive anybody has taken, and readable by everyone who can read the
        repository. A credential shipped this way has to be assumed compromised
        from the moment it was committed, and rotating it means rebuilding and
        redistributing the chart rather than changing one value.

        Base64 is encoding, not encryption: decoding it is one command, so a
        value that looks opaque in the manifest is plain text to anybody who
        wants it.
      severity: critical
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials in the chart
      keywords: [Secret, data, stringData, base64, ExternalSecret, GitOps, credential, "private key"]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: medium
      reference: source-standards.md - CFG-01, SUP-10
      remediation: >
        Ship the Secret empty and have the platform's secret store fill it in at
        install time, or reference an existing Secret by name through a chart
        value.
      fixExample: |
        apiVersion: external-secrets.io/v1beta1
        kind: ExternalSecret
        metadata:
          name: my-service-db
        spec:
          secretStoreRef: {name: platform-vault, kind: ClusterSecretStore}
          target: {name: my-service-db}
          data:
            - secretKey: password
              remoteRef: {key: my-service/db, property: password}
      appliesTo:
        kinds: [Secret]
        where: 'value(self, "data") != null || value(self, "stringData") != null'
      assert:
        # On the CONTENTS, not on the presence of contents. Firing on presence
        # produced 56 findings on a real release of which 14 were genuine: the
        # rest were usernames, hostnames, object names, and configuration
        # templates whose credential fields are deliberately empty. Rating those
        # Critical tells a team to fix something that is already correct.
        expr: |
          (value(self, "data") == null ||
            self.data.all(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) == "")) &&
          (value(self, "stringData") == null ||
            self.stringData.all(k, secretMaterialClass(k, string(self.stringData[k])) == ""))
        locus: data
        # The field the finding is ACTUALLY about, down to the key.
        #
        # A Secret whose content is under `stringData` was reported at `data`,
        # so the path did not resolve, the evidence window fell back to leading
        # with the object, and a reviewer opening the finding saw apiVersion,
        # kind and metadata - none of which the finding concerns. The footer
        # then said "data is not in this manifest", about a finding whose
        # subject was stringData. Naming the first offending key puts the
        # window on the line and the note on the right field.
        locusExpr: |
          (value(self, "data") != null &&
           self.data.exists(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) != ""))
            ? "data[" + sorted(self.data
                .filter(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) != ""))[0] + "]"
            : ((value(self, "stringData") != null &&
                self.stringData.exists(k, secretMaterialClass(k, string(self.stringData[k])) != ""))
              ? "stringData[" + sorted(self.stringData
                  .filter(k, secretMaterialClass(k, string(self.stringData[k])) != ""))[0] + "]"
              : (value(self, "data") != null ? "data" : "stringData"))
        expected: no credential material travelling inside the chart
        observed: |
          sorted(
            (value(self, "data") == null ? [] :
              self.data.filter(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) != "")
                .map(k, k + ": " + secretMaterialClass(k, decodeBase64(string(self.data[k]))))) +
            (value(self, "stringData") == null ? [] :
              self.stringData.filter(k, secretMaterialClass(k, string(self.stringData[k])) != "")
                .map(k, k + ": " + secretMaterialClass(k, string(self.stringData[k]))))
          ).join(", ")
        message: |
          "Secret " + text(self, "metadata.name") + " ships with " +
          sorted(
            (value(self, "data") == null ? [] :
              self.data.filter(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) != "")
                .map(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) + " under \"" + k + "\"")) +
            (value(self, "stringData") == null ? [] :
              self.stringData.filter(k, secretMaterialClass(k, string(self.stringData[k])) != "")
                .map(k, secretMaterialClass(k, string(self.stringData[k])) + " under \"" + k + "\""))
          ).join(", ") +
          ". Base64 is encoding, not encryption - decoding it is one command. Everything in a chart is " +
          "in version control and in every mirror and archive of the release, so this has to be treated " +
          "as exposed from the moment it was committed, and changing it means rebuilding and " +
          "redistributing the chart."

    - id: CFG-15
      title: A Secret that ships values says what they are
      description: >
        A Secret carrying inline values that are not recognisably credentials is
        recorded, so somebody confirms what is travelling in the chart. Recorded
        on a pass as well, so the report lists every Secret that ships contents
        rather than only the ones that alarm it.
      rationale: >
        Not everything in a Secret is a credential - service names, hostnames
        and usernames all appear there legitimately, and none of them is worth
        blocking a release over. But something IS being shipped inside the
        chart, and the only way to know it is harmless is for a person to look.
        This is the inventory that makes that possible, at the severity the
        condition deserves.
      severity: inform
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials in the chart
      keywords: [Secret, data, stringData, base64, inventory, inline]
      confidence: needs-review
      whenItBites: continuously
      fixOwner: needs-decision
      fixEffort: low
      reference: source-standards.md - CFG-01 (the remainder)
      remediation: >
        Confirm the values are not sensitive. If any of them is, move it into
        the platform's secret store; if none is, consider a ConfigMap, which
        says plainly that the contents are not secret.
      fixExample: |
        # If the values are not sensitive, say so by where you put them:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: my-service-endpoints
        data:
          upstream.host: db.internal.example
      appliesTo:
        kinds: [Secret]
        # Not the ones CFG-14 already reports. A Secret shipping a private key
        # is a critical finding, not an inventory entry, and two rows on one
        # object with one fix between them is the pattern this pack removed
        # everywhere else.
        where: |
          (value(self, "data") != null || value(self, "stringData") != null) &&
          (value(self, "data") == null ||
            self.data.all(k, secretMaterialClass(k, decodeBase64(string(self.data[k]))) == "")) &&
          (value(self, "stringData") == null ||
            self.stringData.all(k, secretMaterialClass(k, string(self.stringData[k])) == ""))
      assert:
        observeOnPass: true
        expr: |
          (value(self, "data") == null ||
            self.data.all(k, decodeBase64(string(self.data[k])).trim() == "")) &&
          (value(self, "stringData") == null ||
            self.stringData.all(k, string(self.stringData[k]).trim() == ""))
        locus: data
        expected: an empty Secret, filled in at install time
        observed: |
          "ships values for: " +
          sorted(
            (value(self, "data") == null ? [] :
              self.data.filter(k, decodeBase64(string(self.data[k])).trim() != "").map(k, k)) +
            (value(self, "stringData") == null ? [] :
              self.stringData.filter(k, string(self.stringData[k]).trim() != "").map(k, k))
          ).join(", ")
        message: |
          "Secret " + text(self, "metadata.name") + " ships values inside the chart. None of them looks " +
          "like a credential, so this is recorded rather than reported - but something is travelling in " +
          "version control and somebody should confirm it is meant to."

    - id: CFG-02
      title: No credential is passed on a command line
      description: >
        No container start-up command or argument carries a password, token, key
        or similar as a literal value.
      rationale: >
        Command-line arguments are visible to every process in the same container
        through an ordinary process listing, they are stored in the object that
        describes the pod, and they are captured in crash reports. A credential
        passed this way leaks to anything that gets a foothold anywhere in the
        pod, including a helper container from a different team.
      severity: critical
      tier: 1
      category: Configuration & Secrets
      subcategory: Credentials on the command line
      keywords: [args, command, --password, --token, "process listing", credential]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-02
      remediation: >
        Pass the value through an environment variable sourced from a Secret, or
        as a mounted file the program reads.
      fixExample: |
        command: ["/opt/app/bin/start"]
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef: {name: my-service-db, key: password}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: 'present(self, "args") || present(self, "command")'
      assert:
        expr: |
          ((present(self, "args") ? self.args : []) +
           (present(self, "command") ? self.command : []))
            .all(a,
              !string(a).matches("(?i)^--?[a-z0-9._-]*(password|passwd|token|secret|api[-_]?key|credential)=[^{$\\s]") &&
              credentialClass("commandline", string(a)) == "")
        locus: args
        expected: no credential written into the start-up command
        observed: |
          "carries a credential: " +
          sorted(((present(self, "args") ? self.args : []) +
                  (present(self, "command") ? self.command : []))
            .filter(a,
              string(a).matches("(?i)^--?[a-z0-9._-]*(password|passwd|token|secret|api[-_]?key|credential)=[^{$\\s]") ||
              credentialClass("commandline", string(a)) != "")
            .map(a, string(a).split("=")[0] + "=…")).join(", ")

    - id: CFG-03
      title: Configuration that is in use cannot be edited in place
      description: >
        A ConfigMap is marked as unchangeable.
      rationale: >
        A changeable ConfigMap can be edited directly in the cluster, and the
        services reading it do not restart - so the settings actually running
        drift away from the settings the release declares, with nothing anywhere
        recording that they have. Marking it unchangeable forces a change to
        become a new object and a proper rollout, which is visible and
        reversible.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: ConfigMap immutability
      keywords: [ConfigMap, immutable, "configuration drift"]
      confidence: confirmed
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-03
      remediation: >
        Set immutable to true, and give the ConfigMap a name suffix derived from
        its contents so an update creates a new object rather than editing one.
      fixExample: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: my-service-config-8f3a21c
        immutable: true
      appliesTo:
        kinds: [ConfigMap]
      assert:
        equals:
          immutable: true

    - id: CFG-04
      title: A change to the settings actually restarts the service
      description: >
        A workload that reads a ConfigMap or a Secret carries a checksum
        annotation on its pod template, so that changing those settings changes
        the pod and triggers a rollout.
      rationale: >
        Changing a ConfigMap does not restart anything. Without a trigger, an
        upgrade that changes the settings appears to succeed and nothing actually
        changes - until some unrelated event restarts one copy, at which point
        some copies are running the new settings and some the old. That produces
        intermittent behaviour that is extremely hard to reproduce, and it is the
        single most common "the change did not take effect" in Helm-packaged
        software.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: Configuration rollout
      keywords: [checksum/config, "checksum annotation", ConfigMap, Secret, rollout, "helm upgrade"]
      confidence: probable
      whenItBites: upgrade
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-04
      remediation: >
        Add a checksum annotation on the pod template, computed from the
        configuration files the chart renders. Charts that reload configuration
        without restarting should record that instead.
      fixExample: |
        spec:
          template:
            metadata:
              annotations:
                checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
        where: 'size(configRefs(self)) > 0'
      assert:
        expr: 'allAnnotations(self).exists(k, k.startsWith("checksum/"))'
        locus: spec.template.metadata.annotations
        expected: a checksum annotation over the settings this workload reads
        observed: |
          "reads " + configRefs(self).map(r, string(r.kind) + " " + string(r.name)).join(", ") +
          " and carries no checksum annotation, so changing them will not restart anything"

    - id: CFG-11
      title: Every configuration reference points at something that exists
      description: >
        Every ConfigMap and Secret a workload asks for is either shipped by this
        release or explicitly marked optional.
      rationale: >
        A reference to something that is not there is not a warning at
        installation time - the copy never starts at all, and stays in a
        configuration error indefinitely. Nothing in the chart hints at which of
        the six places a pod can name a ConfigMap the name came from, so this is
        typically half an hour of reading templates to find one typo.

        It is a warning rather than a blocking finding because the chart is not
        the only thing that can put an object in the namespace: an installer,
        an operator or a platform team may supply it, and this tool sees only
        what the chart renders. Objects the cluster creates in every namespace
        by itself - kube-root-ca.crt among them - are excluded outright, since
        no chart could ship those and reporting them sends somebody looking for
        a template that will never exist.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: Configuration references
      keywords: [configMapRef, secretRef, configMapKeyRef, secretKeyRef, optional, CreateContainerConfigError]
      confidence: probable
      whenItBites: install
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-11 (proposed addition)
      remediation: >
        Ship the missing object, correct the name, or mark the reference optional
        if the workload can genuinely start without it.
      fixExample: |
        envFrom:
          - configMapRef:
              name: my-service-config
              optional: true      # only if the workload really can start without it
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob]
        where: 'size(configRefs(self)) > 0'
      assert:
        expr: |
          configRefs(self).all(r,
            r.optional ||
            resourcesIn([string(r.kind)]).exists(o, text(o, "metadata.name") == string(r.name)))
        locus: spec.template.spec
        expected: every ConfigMap and Secret it reads shipped by this release, or marked optional
        observed: |
          "missing: " + configRefs(self)
            .filter(r, !r.optional &&
                       !resourcesIn([string(r.kind)]).exists(o, text(o, "metadata.name") == string(r.name)))
            .map(r, string(r.kind) + " " + string(r.name)).join(", ")
        effective: |
          "the pods stay in CreateContainerConfigError until something else supplies " +
          configRefs(self)
            .filter(r, !r.optional &&
                       !resourcesIn([string(r.kind)]).exists(o, text(o, "metadata.name") == string(r.name)))
            .map(r, string(r.kind) + " " + string(r.name)).join(", ")
        message: |
          text(self, "kind") + " " + text(self, "metadata.name") + " asks for " +
          configRefs(self)
            .filter(r, !r.optional &&
                       !resourcesIn([string(r.kind)]).exists(o, text(o, "metadata.name") == string(r.name)))
            .map(r, string(r.kind) + " " + string(r.name)).join(", ") +
          ", which nothing in this release creates. If an installer or a platform team supplies it " +
          "before start-up this is fine; if nothing does, its copies will never start. They will sit " +
          "in CreateContainerConfigError indefinitely - the event log names the missing object but " +
          "not why it was expected, and nothing in the chart says which of the six places a pod can " +
          "name one the reference came from."

    - id: CFG-06
      title: Certificates and keys arrive as files, not environment variables
      description: >
        No environment variable carries a certificate or a private key; that
        material is mounted as a read-only file instead.
      rationale: >
        A private key in an environment variable is part of the object describing
        the pod, so it is in every crash report and in any log line that prints
        the environment. Mounted as a file it is readable only by the process
        that needs it, and it can be replaced without changing the workload.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: TLS material
      keywords: [tls.crt, tls.key, certificate, "private key", env, volumeMounts, kubernetes.io/tls]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-06
      remediation: Mount the certificate Secret as a read-only volume.
      fixExample: |
        volumeMounts:
          - {name: tls, mountPath: /etc/tls, readOnly: true}
        # volumes:
        #   - name: tls
        #     secret: {secretName: my-service-tls}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: 'present(self, "env")'
      assert:
        expr: |
          self.env.all(e,
            !string(value(e, "name")).matches("(?i)(tls|ssl)?_?(cert|certificate|key|pem|ca_?bundle)$") ||
            !present(e, "value"))
        locus: env
        expected: certificates and keys mounted as files
        observed: |
          "passed in the environment: " +
          self.env.filter(e,
            string(value(e, "name")).matches("(?i)(tls|ssl)?_?(cert|certificate|key|pem|ca_?bundle)$") &&
            present(e, "value")).map(e, string(value(e, "name"))).join(", ")

    - id: CFG-07
      title: A container is given the credentials it needs, not all of them
      description: >
        Whole Secrets are not handed to a container wholesale through envFrom.
      rationale: >
        The container receives every key in the Secret, including the ones added
        next release for a different component. If that container is ever
        compromised, what leaks is everything the Secret happened to hold rather
        than the one value this workload needed.
      severity: warning
      tier: 1
      category: Configuration & Secrets
      subcategory: Secret scoping
      keywords: [envFrom, secretRef, items, "whole secret", secretKeyRef]
      confidence: confirmed
      whenItBites: continuously
      fixOwner: chart-template
      fixEffort: low
      reference: source-standards.md - CFG-07
      remediation: >
        Name the keys with secretKeyRef, or list them under items on the volume.
      fixExample: |
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef: {name: my-service-db, key: password}
      appliesTo:
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob, Pod]
        containers: all
        where: 'present(self, "envFrom")'
      assert:
        expr: '!self.envFrom.exists(e, has(e.secretRef))'
        locus: envFrom
        expected: named keys rather than whole Secrets
        observed: |
          "takes every key from " +
          self.envFrom.filter(e, has(e.secretRef)).map(e, string(e.secretRef.name)).join(", ")
