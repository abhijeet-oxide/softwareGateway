name: CD

on:
  push:
    branches:
      - main
    paths-ignore:
      # Pointer changes are deployment-only and must not publish another build.
      - "deploy/flux/instances/**"
      - "deploy/flux/software/patch/**"
      - "docs/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      create_release:
        description: >-
          Create a new versioned build. This builds all images and publishes the
          images and Helm chart and opens the Flux pointer PR.
        type: boolean
        default: true

# Prevent two releases from calculating or publishing the same version.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.26"
  GODEBUG: http2client=0
  REGISTRY_URL: https://${{ vars.REGISTRY_HOST }}
  REGISTRY_REPOSITORY: ${{ vars.REGISTRY_REPOSITORY }}
  JFROG_BUILD_NAME: software-gateway
  HTTP_PROXY: ${{ vars.HTTP_PROXY }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY }}
  NO_PROXY: ${{ vars.NO_PROXY }}
  GOPROXY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  GOPROXY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
  GOPROXY: ${{ vars.GOPROXY }}
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}

jobs:
  # ===========================================================================
  # 1. PREPARE
  #
  # Validate configuration, normalize the registry URL, and calculate the
  # release version.
  # ===========================================================================
  prepare:
    name: Prepare release

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      image_version: ${{ steps.version.outputs.image_version }}
      images_changed: ${{ steps.version.outputs.images_changed }}
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      instance: ${{ steps.instance.outputs.name }}

      configured: ${{ steps.registry.outputs.configured }}
      registry_host: ${{ steps.registry.outputs.registry_host }}
      registry_repository: ${{ steps.registry.outputs.registry_repository }}
      jf_url: ${{ steps.registry.outputs.jf_url }}

    steps:
      # Partial clone: full history for version.sh without downloading every
      # historical blob.
      - name: Checkout complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Select deployment instance
        id: instance
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$REF" in
            main)
              echo "name=lab" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::CD runs on main only"
              exit 1
              ;;
          esac

      - name: Validate and normalize registry configuration
        id: registry
        env:
          RAW_REGISTRY_URL: https://${{ vars.REGISTRY_HOST }}
          RAW_REGISTRY_REPOSITORY: ${{ vars.REGISTRY_REPOSITORY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          missing=()

          [ -n "${RAW_REGISTRY_URL:-}" ] ||
            missing+=("vars.REGISTRY_URL")

          [ -n "${RAW_REGISTRY_REPOSITORY:-}" ] ||
            missing+=("vars.REGISTRY_REPOSITORY")

          [ -n "${REGISTRY_USERNAME:-}" ] ||
            missing+=("secrets.REGISTRY_USERNAME")

          [ -n "${REGISTRY_TOKEN:-}" ] ||
            missing+=("secrets.REGISTRY_TOKEN")

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"

            {
              echo "### Publishing skipped"
              echo
              echo "The following configuration is missing:"
              echo
              for item in "${missing[@]}"; do
                echo "- \`${item}\`"
              done
              echo
              echo "Configure the values under:"
              echo
              echo "**Settings -> Secrets and variables -> Actions**"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # Strip protocol, trailing slash, and surrounding whitespace.
          registry_host="$(
            printf '%s' "$RAW_REGISTRY_URL" |
              sed \
                -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' \
                -e 's#^https\?://##' \
                -e 's#/*$##'
          )"

          if [ -z "$registry_host" ]; then
            echo "::error::vars.REGISTRY_URL becomes empty after normalization"
            exit 1
          fi

          # REGISTRY_URL must only identify the platform/registry hostname.
          # Reject URLs containing a path.
          if printf '%s' "$registry_host" | grep -q '/'; then
            echo "::error::vars.REGISTRY_URL must contain only the JFrog hostname"
            echo "::error::Received: $RAW_REGISTRY_URL"
            echo "::error::Expected example: https://artifact.example.com"
            exit 1
          fi

          registry_repository="$(
            printf '%s' "$RAW_REGISTRY_REPOSITORY" |
              sed \
                -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' \
                -e 's#^https\?://##' \
                -e 's#^/*##' \
                -e 's#/*$##'
          )"

          if [ -z "$registry_repository" ]; then
            echo "::error::vars.REGISTRY_REPOSITORY becomes empty after normalization"
            exit 1
          fi

          # A repository must not contain a host or protocol.
          if printf '%s' "$registry_repository" | grep -q '://'; then
            echo "::error::vars.REGISTRY_REPOSITORY must be a repository name"
            exit 1
          fi

          jf_url="https://${registry_host}"

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "registry_host=$registry_host" >> "$GITHUB_OUTPUT"
          echo "registry_repository=$registry_repository" >> "$GITHUB_OUTPUT"
          echo "jf_url=$jf_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Registry configuration"
            echo
            echo "- JFrog Platform URL: \`${jf_url}\`"
            echo "- Docker registry host: \`${registry_host}\`"
            echo "- repository: \`${registry_repository}\`"
            echo "- JFrog Build name: \`${JFROG_BUILD_NAME}\`"
            echo "- JFrog Project: not used"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate release version
        id: version
        env:
          CHANNEL: ${{ github.ref_name }}
          FORCE_RELEASE: ${{ inputs.create_release }}
        run: bash .github/scripts/version.sh

      - name: Validate calculated version
        if: >-
          steps.version.outputs.should_release == 'true'
          && steps.registry.outputs.configured == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          set -euo pipefail

          [ -n "$TAG" ] || {
            echo "::error::version.sh produced no tag"
            exit 1
          }

          [ -n "$CHART_VERSION" ] || {
            echo "::error::version.sh produced no chart version"
            exit 1
          }

          [ -n "$IMAGE_VERSION" ] || {
            echo "::error::version.sh produced no image version"
            exit 1
          }

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists locally"
            exit 1
          fi

          if git ls-remote \
            --exit-code \
            --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists on origin"
            exit 1
          fi

          {
            echo "### Version"
            echo
            echo "- Git tag: \`${TAG}\`"
            echo "- chart version: \`${CHART_VERSION}\`"
            echo "- image version: \`${IMAGE_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 2a. BUILD ONE IMAGE PER JOB
  #
  # Three jobs, one per component, running concurrently and each visible on its
  # own in the Actions UI with its own log and its own duration.
  #
  # NOTHING IS PUSHED HERE. Each job exports its image as a tarball artifact
  # that `release` loads after every build has succeeded. That is what keeps
  # publication all-or-nothing while still letting the builds run apart.
  # ===========================================================================
  build-image:
    name: Build ${{ matrix.component }} image

    needs:
      - prepare

    if: >-
      needs.prepare.outputs.should_release == 'true'
      && needs.prepare.outputs.configured == 'true'

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45

    strategy:
      # Report every broken component in one run. With fail-fast a web failure
      # would cancel a coordinator build that was also going to fail, and the
      # second problem only surfaces on the next attempt.
      fail-fast: false
      matrix:
        include:
          - component: coordinator
            runtime: go
          - component: worker
            runtime: go
          - component: web
            runtime: node

    env:
      REGISTRY_HOST: ${{ needs.prepare.outputs.registry_host }}
      REGISTRY_REPOSITORY: ${{ needs.prepare.outputs.registry_repository }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
      COMPONENT: ${{ matrix.component }}
      RUNTIME: ${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          # The current self-hosted runner rejects the nested BuildKit
          # container required by the docker-container driver.
          driver: docker

      - name: Prepare build credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          cat > "$RUNNER_TEMP/netrc" <<EOF
          machine ${REGISTRY_HOST}
            login ${REGISTRY_USERNAME}
            password ${REGISTRY_TOKEN}
          EOF

          npm_registry="${NPM_REGISTRY%/}/"
          npm_auth_path="${npm_registry#https:}"
          npm_auth_path="${npm_auth_path#http:}"

          cat > "$RUNNER_TEMP/npmrc" <<EOF
          registry=${npm_registry}
          ${npm_auth_path}:_authToken=${REGISTRY_TOKEN}
          always-auth=true
          EOF

      - name: Build the image
        run: |
          set -euo pipefail

          image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}/software-gateway-${COMPONENT}:${IMAGE_VERSION}"

          # A Go component authenticates to the module proxy with netrc. The
          # web component authenticates to the npm registry with npmrc.
          extra=()

          case "$RUNTIME" in
            go)
              extra+=(--build-arg "GOPROXY=${GOPROXY}")
              extra+=(--secret "id=netrc,src=${RUNNER_TEMP}/netrc")
              ;;
            node)
              extra+=(--build-arg "NPM_REGISTRY=${NPM_REGISTRY}")
              extra+=(--secret "id=npmrc,src=${RUNNER_TEMP}/npmrc")
              ;;
            *)
              echo "::error::unknown runtime '$RUNTIME' for component '$COMPONENT'"
              exit 1
              ;;
          esac

          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file "deploy/build/Dockerfile.${COMPONENT}" \
            --tag "$image" \
            --build-arg "VERSION=${IMAGE_VERSION}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "HTTP_PROXY=${HTTP_PROXY}" \
            --build-arg "HTTPS_PROXY=${HTTPS_PROXY}" \
            --build-arg "NO_PROXY=${NO_PROXY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "${extra[@]}" \
            .

          echo "Built $image"
          docker image inspect --format 'Image ID: {{.Id}}' "$image"

      - name: Export the image
        run: |
          set -euo pipefail

          image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}/software-gateway-${COMPONENT}:${IMAGE_VERSION}"

          mkdir -p "$RUNNER_TEMP/image"

          docker save "$image" -o "$RUNNER_TEMP/image/${COMPONENT}.tar"

          ls -lh "$RUNNER_TEMP/image/${COMPONENT}.tar"

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/image/${{ matrix.component }}.tar
          retention-days: 1
          # Layers are already compressed. Re-compressing costs CPU on both
          # ends and saves almost nothing.
          compression-level: 0

  # ===========================================================================
  # 2b. VALIDATE AND PACKAGE THE CHART
  #
  # Runs beside the image builds, not after them. The chart is packaged here
  # and published by `release`.
  # ===========================================================================
  validate-chart:
    name: Validate and package chart

    needs:
      - prepare

    if: >-
      needs.prepare.outputs.should_release == 'true'
      && needs.prepare.outputs.configured == 'true'

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30

    env:
      CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install project toolchain
        uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          helm: "true"

      # Compiled once and reused by every invocation below instead of
      # recompiling the tool on each `go run`.
      - name: Compile chartstage
        run: |
          set -euo pipefail

          go build \
            -o "$RUNNER_TEMP/chartstage" \
            ./deploy/chartstage/cmd/chartstage

      - name: Stage config into the chart
        run: "$RUNNER_TEMP/chartstage"

      - name: Lint Helm chart
        run: |
          set -euo pipefail

          helm lint deploy/charts/software-gateway \
            --set identity.masterkey.value=0123456789abcdef0123456789abcdef \
            --set identity.rootPassword.value=lint

      - name: Render every configured instance
        run: |
          set -euo pipefail

          instances="$("$RUNNER_TEMP/chartstage" -instances)"

          if [ -z "$instances" ]; then
            echo "::error::chartstage listed no instances - nothing was rendered"
            exit 1
          fi

          render_jobs="$RUNNER_TEMP/render-jobs.txt"
          : > "$render_jobs"

          while read -r instance current_version; do
            [ -n "$instance" ] || continue

            "$RUNNER_TEMP/chartstage" -values "$instance" \
              > "$RUNNER_TEMP/${instance}-values.yaml"

            printf '%s\n' "$instance database" >> "$render_jobs"
            printf '%s\n' "$instance application" >> "$render_jobs"
          done <<< "$instances"

          # Renders are independent and CPU-bound, so fan them out.
          xargs -r -P 4 -L 1 bash -c '
            set -euo pipefail
            instance="$0"
            layer="$1"

            database=false
            application=false

            if [ "$layer" = "database" ]; then
              database=true
            else
              application=true
            fi

            output="$RUNNER_TEMP/${instance}-${layer}.yaml"

            helm template swgw deploy/charts/software-gateway \
              --values "$RUNNER_TEMP/${instance}-values.yaml" \
              --set "layers.database=${database}" \
              --set "layers.application=${application}" \
              > "$output"

            object_count="$(grep -c "^kind:" "$output" || true)"
            echo "${instance}/${layer}: ${object_count} objects"
          ' < "$render_jobs"

      - name: Package Helm chart
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/chart"

          helm package deploy/charts/software-gateway \
            --version "$CHART_VERSION" \
            --app-version "$IMAGE_VERSION" \
            --destination "$RUNNER_TEMP/chart"

          chart="$RUNNER_TEMP/chart/software-gateway-${CHART_VERSION}.tgz"

          if [ ! -s "$chart" ]; then
            echo "::error::Helm did not create $chart"
            exit 1
          fi

          sha256sum "$chart"

      - name: Upload the packaged chart
        uses: actions/upload-artifact@v7
        with:
          name: chart
          path: ${{ runner.temp }}/chart/software-gateway-${{ needs.prepare.outputs.chart_version }}.tgz
          retention-days: 1

  # ===========================================================================
  # 3. PUBLISH, BUILD INFO 
  #
  # Reached only when all three image builds AND the chart validation have
  # succeeded, so the first byte sent to Artifactory implies the whole build is
  # already known good.
  # ===========================================================================
  release:
    name: Publish Release

    needs:
      - prepare
      - build-image
      - validate-chart

    if: >-
      needs.prepare.outputs.should_release == 'true'
      && needs.prepare.outputs.configured == 'true'

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60

    env:
      REGISTRY_HOST: ${{ needs.prepare.outputs.registry_host }}
      REGISTRY_REPOSITORY: ${{ needs.prepare.outputs.registry_repository }}
      JF_URL: ${{ needs.prepare.outputs.jf_url }}

      CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
      IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

      JFROG_CLI_BUILD_NAME: ngusp-software-gateway
      JFROG_CLI_BUILD_NUMBER: ${{ needs.prepare.outputs.chart_version }}
      JFROG_CLI_BUILD_URL: >-
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}

      # REGISTRY_TOKEN is an Artifactory REFERENCE token, not a JWT. Handing it
      # to the CLI as JF_ACCESS_TOKEN leaves the server entry with no username,
      # and the docker login that `jf docker push` performs internally then
      # fails with "username is empty". Basic auth is the supported path for a
      # reference token.
      JF_USER: ${{ secrets.REGISTRY_USERNAME }}
      JF_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # The tag exists only in this workspace at this point. It is not pushed
      # until images, chart, and Build Info all succeed.
      - name: Create local Git tag
        id: local_tag
        run: |
          set -euo pipefail

          if git rev-parse --verify \
            "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit="$(
              git rev-list -n 1 "$RELEASE_TAG"
            )"

            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Local tag $RELEASE_TAG points at $tag_commit"
              echo "::error::Expected source commit $GITHUB_SHA"
              exit 1
            fi

            echo "Local tag already exists and points at $GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git tag \
              -a "$RELEASE_TAG" \
              -m "Software Gateway ${CHART_VERSION}" \
              "$GITHUB_SHA"
          fi

          git show \
            --no-patch \
            --format='Local tag: %D%nCommit: %H' \
            "$RELEASE_TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Install project toolchain
        uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}
          helm: "true"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker

      # -----------------------------------------------------------------------
      # FAIL FAST ON CREDENTIALS
      #
      # Established before the artifacts are pulled down so a credential problem
      # costs seconds. Nothing is pushed here.
      # -----------------------------------------------------------------------
      - name: Install and configure JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ needs.prepare.outputs.jf_url }}
          JF_USER: ${{ secrets.REGISTRY_USERNAME }}
          JF_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}

      - name: Verify JFrog connectivity and authenticate Docker
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          jf --version

          # Shows the resolved server entry. A blank user here means the
          # reference token was taken as an access token again.
          jf config show

          jf rt ping

          printf '%s' "$REGISTRY_TOKEN" |
            docker login "$REGISTRY_HOST" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin

      # -----------------------------------------------------------------------
      # COLLECT WHAT THE BUILD JOBS PRODUCED
      # -----------------------------------------------------------------------
      - name: Download every image
        uses: actions/download-artifact@v7
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Download the packaged chart
        uses: actions/download-artifact@v7
        with:
          name: chart
          path: ${{ runner.temp }}/chart

      - name: Load and verify every image
        run: |
          set -euo pipefail

          for component in coordinator worker web; do
            tar="$RUNNER_TEMP/images/${component}.tar"

            if [ ! -s "$tar" ]; then
              echo "::error::missing image tarball for ${component}"
              exit 1
            fi

            docker load -i "$tar"
          done

          # Assert every expected tag is present after loading, so a renamed or
          # mismatched artifact fails here rather than mid-publication.
          for component in coordinator worker web; do
            image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}/software-gateway-${component}:${IMAGE_VERSION}"

            image_id="$(
              docker image inspect \
                --format '{{.Id}}' \
                "$image"
            )"

            echo "Loaded $image"
            echo "Image ID: $image_id"
          done

      # -----------------------------------------------------------------------
      # PUBLISH IMAGES
      #
      # Pushes stay sequential on purpose: JFrog CLI accumulates Build Info for
      # the same build name/number in a shared local partials directory, and
      # concurrent writers can corrupt it.
      # -----------------------------------------------------------------------
      - name: Push all images and collect Build Info
        id: push_images
        run: |
          set -euo pipefail

          for component in coordinator worker web; do
            image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}/software-gateway-${component}:${IMAGE_VERSION}"

            echo "Publishing $image"

            jf docker push "$image" \
              --build-name="$JFROG_CLI_BUILD_NAME" \
              --build-number="$JFROG_CLI_BUILD_NUMBER"
          done

          echo "completed=true" >> "$GITHUB_OUTPUT"

      # Read-only registry lookups, safe to run concurrently.
      - name: Verify every published image
        run: |
          set -euo pipefail

          printf '%s\n' coordinator worker web |
            xargs -r -P 3 -I {} bash -c '
              set -euo pipefail
              image="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}/software-gateway-{}:${IMAGE_VERSION}"
              docker buildx imagetools inspect "$image" >/dev/null
              echo "Verified published image: $image"
            '

      - name: Publish OCI Helm chart
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          chart="$RUNNER_TEMP/chart/software-gateway-${CHART_VERSION}.tgz"

          if [ ! -s "$chart" ]; then
            echo "::error::packaged chart $chart was not downloaded"
            exit 1
          fi

          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login "$REGISTRY_HOST" \
              --username "$REGISTRY_USERNAME" \
              --password-stdin

          helm push \
            "$chart" \
            "oci://${REGISTRY_HOST}/${REGISTRY_REPOSITORY}"

      # -----------------------------------------------------------------------
      # BUILD INFO
      # -----------------------------------------------------------------------
      - name: Add Git and environment metadata to JFrog Build Info
        env:
          # Prevent credentials and similarly named variables from entering
          # JFrog Build Info.
          JFROG_CLI_ENV_EXCLUDE: >-
            *password*;*secret*;*key*;*token*;*auth*;*credential*
        run: |
          set -euo pipefail

          jf rt build-add-git \
            "$JFROG_CLI_BUILD_NAME" \
            "$JFROG_CLI_BUILD_NUMBER" \
            .

          jf rt build-collect-env \
            "$JFROG_CLI_BUILD_NAME" \
            "$JFROG_CLI_BUILD_NUMBER"

      - name: Publish JFrog Build Info
        id: build_info
        run: |
          set -euo pipefail

          jf rt build-publish \
            "$JFROG_CLI_BUILD_NAME" \
            "$JFROG_CLI_BUILD_NUMBER"

          echo "published=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # REMOTE GIT TAG
      #
      # The Git tag is not pushed until image publication, chart publication,
      # Build Info publication have succeeded.
      # -----------------------------------------------------------------------
      - name: Push release Git tag
        id: push_tag
        run: |
          set -euo pipefail

          remote_tag="$(
            git ls-remote \
              --tags origin \
              "refs/tags/${RELEASE_TAG}" |
              awk '{print $1}'
          )"

          remote_peeled_tag="$(
            git ls-remote \
              --tags origin \
              "refs/tags/${RELEASE_TAG}^{}" |
              awk '{print $1}'
          )"

          if [ -n "$remote_tag" ] || [ -n "$remote_peeled_tag" ]; then
            remote_commit="$remote_peeled_tag"

            if [ -z "$remote_commit" ]; then
              remote_commit="$remote_tag"
            fi

            if [ "$remote_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Remote tag $RELEASE_TAG already exists"
              echo "::error::Remote commit: $remote_commit"
              echo "::error::Expected commit: $GITHUB_SHA"
              exit 1
            fi

            echo "Remote tag already points at $GITHUB_SHA"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "refs/tags/${RELEASE_TAG}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Release summary
        if: success()
        run: |
          {
            echo "### JFrog Build ${CHART_VERSION}"
            echo
            echo "- Git tag: \`${RELEASE_TAG}\`"
            echo "- JFrog Build: \`${JFROG_CLI_BUILD_NAME}/${JFROG_CLI_BUILD_NUMBER}\`"
            echo "- repository: \`${REGISTRY_REPOSITORY}\`"
            echo "- image version: \`${IMAGE_VERSION}\`"
            echo "- coordinator image: published and verified"
            echo "- worker image: published and verified"
            echo "- web image: published and verified"
            echo "- OCI Helm chart: published"
            echo "- JFrog Project: not used"
            echo "- Release Bundle: not created"
          } >> "$GITHUB_STEP_SUMMARY"

      # A failure before publication deletes the local tag.
      #
      # The remote tag is not normally present during a failure because it is
      # pushed only after Build Info succeed.
      #
      # If a later step is added after tag publication and fails, this cleanup
      # removes that remote tag as explicitly required.
      - name: Delete Git tag after release failure
        if: failure() && steps.local_tag.outputs.created == 'true'
        env:
          REMOTE_TAG_PUSHED: ${{ steps.push_tag.outputs.pushed }}
          IMAGES_PUSHED: ${{ steps.push_images.outputs.completed }}
        run: |
          set +e

          echo "::warning::Release failed. Removing local Git tag $RELEASE_TAG."

          git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true

          if [ "${REMOTE_TAG_PUSHED:-false}" = "true" ]; then
            echo "::warning::Removing remote Git tag $RELEASE_TAG."
            git push origin ":refs/tags/${RELEASE_TAG}" || true
          fi

          # Images are intentionally not deleted automatically.
          #
          # Docker/OCI publication is not transactional. If one JFrog push
          # succeeded and a later push failed, an artifact might exist under
          # this version. Deleting it requires Artifactory delete permission
          # and could remove an artifact another run is examining.
          if [ "${IMAGES_PUSHED:-false}" != "true" ]; then
            echo "::warning::Image publication did not complete."
            echo "::warning::Check Artifactory for partial artifacts tagged ${IMAGE_VERSION}."
          fi

  # ===========================================================================
  # 4. FLUX POINTER PR
  #
  # This starts only after the JFrog Build was published and the
  # release Git tag was pushed.
  # ===========================================================================
  promote:
    name: Point ${{ needs.prepare.outputs.instance }} at the build

    needs:
      - prepare
      - release

    if: >-
      needs.prepare.outputs.should_release == 'true'

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project toolchain
        uses: ./.github/actions/toolchain
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Move Flux pointer and open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTANCE: ${{ needs.prepare.outputs.instance }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
          IMAGES_CHANGED: ${{ needs.prepare.outputs.images_changed }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          chartstage="$RUNNER_TEMP/chartstage"

          go build -o "$chartstage" ./deploy/chartstage/cmd/chartstage

          previous_version="$(
            "$chartstage" -instances |
              awk -v instance="$INSTANCE" \
                '$1 == instance { print $2 }'
          )"

          "$chartstage" \
            -instance "$INSTANCE" \
            -set-version "$CHART_VERSION"

          pointer_file="deploy/flux/instances/${INSTANCE}/release/kustomization.yaml"

          if git diff --quiet -- deploy/flux; then
            echo "opened=false" >> "$GITHUB_OUTPUT"

            {
              echo "### No pointer PR required"
              echo
              echo "**${INSTANCE}** already points at \`${CHART_VERSION}\`."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          branch="deploy/${INSTANCE}-${CHART_VERSION}"

          # Reuse or replace only the automation branch for this exact
          # instance and version.
          if git ls-remote \
            --exit-code \
            --heads origin \
            "$branch" >/dev/null 2>&1; then
            echo "::warning::Replacing existing automation branch $branch"
            git push origin --delete "$branch"
          fi

          body="$RUNNER_TEMP/pointer-pr.md"

          cat > "$body" <<EOF
          ## What this PR does

          Points **${INSTANCE}** at build **${CHART_VERSION}**, previously
          \`${previous_version}\`.

          This repoints \`${pointer_file}\` to
          \`deploy/flux/software/patch/${CHART_VERSION}\`.

          Flux picks up the pointer after a person merges this PR. This
          workflow does not access the cluster and does not merge the PR.

          | Build field | Value |
          |---|---|
          | Instance | \`${INSTANCE}\` |
          | Chart version | \`${CHART_VERSION}\` |
          | Previous chart version | \`${previous_version}\` |
          | Image version | \`${IMAGE_VERSION}\` |
          | Git tag | \`${RELEASE_TAG}\` |
          | Images rebuilt | \`${IMAGES_CHANGED}\` |
          | JFrog Build Info | \`ngusp-software-gateway/${CHART_VERSION}\` |
          | Source commit | \`${GITHUB_SHA}\` |
          | CD run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          All images and the OCI Helm chart were published successfully. JFrog
          Build Info was published before
          this PR was opened.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add deploy/flux

          git commit \
            -m "deploy(${INSTANCE}): ${CHART_VERSION}" \
            -m "Point ${INSTANCE} at build ${CHART_VERSION}, previously ${previous_version}."

          git push origin "$branch"

          pr_url="$(
            gh pr create \
              --base "$BASE_REF" \
              --head "$branch" \
              --title "deploy(${INSTANCE}): ${previous_version} -> ${CHART_VERSION}" \
              --body-file "$body"
          )"

          echo "opened=true" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Deployment pointer summary
        env:
          OPENED: ${{ steps.pr.outputs.opened }}
          PR_URL: ${{ steps.pr.outputs.url }}
          INSTANCE: ${{ needs.prepare.outputs.instance }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
        run: |
          {
            echo "### Build ${CHART_VERSION}"
            echo
            echo "- chart: \`${CHART_VERSION}\`"
            echo "- images: \`${IMAGE_VERSION}\`"
            echo "- JFrog Build Info: published"
            echo "- Git tag: pushed"

            if [ "$OPENED" = "true" ]; then
              echo "- pointer PR for **${INSTANCE}**: ${PR_URL}"
              echo
              echo "Merge the PR to deploy through Flux."
            else
              echo
              echo "${INSTANCE} already points at this build."
            fi

            echo
            echo "No cluster credential was used."
          } >> "$GITHUB_STEP_SUMMARY"
