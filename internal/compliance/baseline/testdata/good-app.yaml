apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-app
  namespace: good
  labels:
    app.kubernetes.io/name: good-app
    app.kubernetes.io/instance: good-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: good-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.4.2
spec:
  replicas: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: good-app
      app.kubernetes.io/instance: good-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: good-app
        app.kubernetes.io/instance: good-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: good-platform
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: 1.4.2
      annotations:
        # Derived from the ConfigMap this workload reads, so changing the
        # settings changes the pod and the platform rolls it out. Without this,
        # an upgrade changes the ConfigMap and nothing restarts.
        checksum/config: "3a1f0c9d6b2e4857aa019f3c4d5e6b7089ac1d2e3f405162738495a6b7c8d9e0"
    spec:
      # The only tolerations a workload needs by default, and both bounded:
      # a kubelet missing one heartbeat should not evict, and five minutes of
      # silence should. Written out rather than left to the defaults so the
      # chart says what it means.
      tolerations:
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 300}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 300}
      serviceAccountName: good-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      volumes:
        - name: config
          configMap:
            name: good-app-config
            items:
              - {key: log.level, path: log.level}
        # Read-only program files with somewhere to write. Without this the
        # first temporary file the program creates fails at run time, which is
        # the reason teams turn readOnlyRootFilesystem back off again.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - topologyKey: topology.kubernetes.io/zone
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: good-app
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: good-app
      initContainers:
        - name: migrate
          image: registry.acme.example/good/migrate@sha256:5f9a1c2e3b4d5a6f7081920a3b4c5d6e7f8091a2b3c4d5e6f70819202122a3b4
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: api
          image: registry.acme.example/good/api@sha256:1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9464
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Four times the request: room for an ordinary burst without the
              # platform pausing the container.
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/good-app, readOnly: true}
            - {name: tmp, mountPath: /tmp}
