# WHO MAY USE THIS GATEWAY, and what each of them may do.
#
# This file IS the provisioning mechanism. Add a person, commit, and let the
# seeder run - `docker compose run --rm zitadel-init` locally, the seeding Job
# under Flux, a pipeline step in CI. Who has access is then a reviewed change
# rather than clicks in a console that nobody can reconstruct afterwards.
#
# Idempotent in both directions that matter: an account that already exists is
# left alone, a grant that is missing is added. Removing somebody here does NOT
# delete their account - deleting a person is not a thing a seeder should decide
# to do on a re-run - so revoke access in the console or by disabling them at
# the identity provider.
#
# THE ADDRESS IS THE IDENTITY. With single sign-on configured, an account is
# matched to an arriving sign-in by a VERIFIED e-mail address. The address here
# must be the one the corporate directory asserts for that person, or they are
# refused with `Errors.User.NotFound` however correct everything else looks. The
# seeder prints what the directory actually asserted on every run.
#
#   username    OPTIONAL. The login name in the identity provider, local to
#               this system. Left out, it IS the address - which is what you
#               want in almost every case, because a username has to be unique
#               across the whole instance and an address already is.
#   email       what the directory asserts. This is what a sign-in matches on.
#   firstName   optional. Derived from the address when it spells a name, and
#   lastName    replaced by the directory's own at the second sign-in.
#   password    LOCAL AND TEST ONLY. Ignored once SSO_ISSUER is set.
#   orgRoles    tenant-wide roles, from config/access/roles.yaml. OPTIONAL, and
#               an empty list is a normal answer: everybody listed here is also
#               granted the baseline role (`tenant.baselineRole`, `org-member`)
#               whether or not they are given anything else. It carries no
#               permission. It is what says this person was PROVISIONED, which
#               is what lets somebody with no product access sign in, see the
#               application, and be told who to ask - rather than meeting a
#               door saying their account does not exist. Being able to sign in
#               does not make somebody a member: with a corporate directory
#               federated, everybody in the company can sign in.
#   products    per-product roles, from the same file
#
# TWO PEOPLE, TWO DOMAINS, ONE NAME. test@domain1.com and test@domain2.com are
# two different people, and only one of them can be `test`. Do not invent
# `test2` for the second: it is a login name they have never been told. Leave
# `username` out of both and each signs in as their own address:
#
#     users:
#       - email: test@domain1.com     # signs in as test@domain1.com
#         products: {...}
#       - email: test@domain2.com     # signs in as test@domain2.com
#         products: {...}
#
# Either spelling gets them in - the sign-in screen looks a typed value up as a
# login name first and as an address second - but with the default there is one
# string to know instead of two. Dropping `username` from a stack that already
# carries `test` and `test2` renames those two accounts on the next seeding
# run, which is printed as it happens and ends any session they are holding.
#
# TWO ENTRIES MAY NOT SHARE AN ADDRESS. The address is how a re-run finds an
# existing account, so two entries carrying one address are one account, and
# the second one's roles land on the first person. Seeding refuses.
#
# EVERY PRODUCT IN config/products NEEDS AN OWNER HERE. Seeding fails otherwise,
# naming the product and the role - see `ownerRole` in config/access/roles.yaml.

users:
  - username: test-owner
    email: test-owner@example.com
    firstName: Test
    lastName: Owner
    password: TestOwner!23
    orgRoles: []
    products:
      software-01: [product-owner]
      software-02: [product-owner]
      software-03: [product-owner]

  - username: test-security
    email: test-security@example.com
    firstName: Test
    lastName: Security
    password: TestSec!23
    orgRoles: [org-security]
    products: {}

  - username: test-reader
    email: test-reader@example.com
    firstName: Test
    lastName: Reader
    password: TestRead!23
    orgRoles: [org-reader]
    products: {}

# Machine accounts. They authenticate with the client credentials grant - no
# browser, no password - and carry exactly the same roles as a person, so an
# automated caller is gated by the same policies. Their secrets are printed
# ONCE, by the run that creates them, because ZITADEL does not store them
# retrievably; set `rotateSecret: true` to reissue.
apiUsers:
  - username: ci-deployer
    name: CI Deployer
    description: pipeline that requests downloads
    orgRoles: []
    products:
      software-01: [product-operator]

  - username: ci-auditor
    name: CI Auditor
    description: reads security across all products
    orgRoles: [org-security]
    products: {}
