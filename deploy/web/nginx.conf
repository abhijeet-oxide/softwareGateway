# The web tier. Serves the built SPA and proxies the API on the SAME ORIGIN.
#
# Same-origin is not a convenience: the Coordinator installs no CORS
# middleware (web/vite.config.ts says so, and that is the right production
# posture), so the browser MUST reach /api/v1 on the origin that served the
# page. Vite proxies it in development; this does the same job in a container,
# which is why dev and production agree.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A privileged user's token carries org-wide roles. Default buffers are
    # 4k/8k and reject it. See docs/design/24 section 5.1.
    large_client_header_buffers 4 32k;

    # Resolve upstreams PER REQUEST, not once at startup.
    #
    # nginx resolves a literal upstream hostname when it parses the config and
    # then caches that address for the life of the process. Two failures
    # follow: the container refuses to START if the controller is not up yet (a
    # restart ordering problem that depends_on cannot fully remove), and if the
    # controller is later replaced with a new IP the web tier proxies to a dead
    # address until someone restarts it. Assigning to a variable forces runtime
    # resolution through the engine's embedded DNS instead. The address itself
    # is filled in by docker-entrypoint.sh at container start: Docker's is a
    # fixed 127.0.0.11, but Podman's (aardvark-dns) is the network's own
    # gateway IP, so it cannot be hardcoded here and still work under both.
    #
    # At the SERVER level rather than inside one location, because both the API
    # proxy and the readiness probe below reach the Coordinator by name.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers on the old bundle pointing at new API shapes.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Written at container start by docker-entrypoint.sh, and never cached: it
    # names the identity provider this deployment signs in against, so a stale
    # copy sends a browser to the previous one.
    location = /runtime-config.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # --- probes -------------------------------------------------------------
    #
    # These exist because the obvious healthcheck for this tier is a lie. Every
    # unknown path falls through to /index.html (the client-side router, at the
    # bottom of this file), so `wget http://127.0.0.1/` answers 200 from a
    # container whose upstream is gone, whose runtime configuration was never
    # rendered, and whose bundle is missing. It proves nginx parsed its config
    # and nothing else.
    #
    # Two questions, two endpoints, matched EXACTLY so neither can be swallowed
    # by the router fallback:
    #
    #   /healthz - is this web tier serving? Local only, answers nothing about
    #              the API. This is the liveness probe: a Coordinator outage
    #              must not restart the tier that renders the page explaining it.
    #   /readyz  - can a browser loaded from here reach the Coordinator? This
    #              proxies to the Coordinator's OWN liveness endpoint, which is
    #              public and needs no token, so the answer is about
    #              reachability rather than about authorization.
    location = /healthz {
        access_log off;
        # default_type, not add_header: `return` builds the response before
        # add_header runs, so the header set that way is appended to a body
        # already typed application/octet-stream.
        default_type application/json;
        return 200 '{"status":"HEALTHY"}';
    }

    location = /readyz {
        access_log off;
        # One variable holding the whole URL: with a variable in proxy_pass the
        # request URI is not appended, which is what makes this reach the
        # Coordinator's /healthz rather than /readyz on the Coordinator.
        set $probe http://controller:8080/healthz;
        proxy_pass $probe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Short, because this is a probe: a Coordinator that takes three
        # seconds to answer its own liveness endpoint is not reachable in any
        # sense this tier cares about.
        proxy_connect_timeout 2s;
        proxy_read_timeout    3s;
    }

    location /api/ {
        set $upstream      http://controller:8080;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        # Server-sent events and long polls must not be buffered or the UI
        # shows nothing until the response completes.
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }

    # Client-side router: every unknown path is the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
