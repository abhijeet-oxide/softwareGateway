# Source: bad-pdb/templates/undeclared-namespace.yaml
# THE JOIN. `helm template` emits metadata.namespace only where a chart
# hard-codes it, and real releases mix both conventions - so this rule and the
# workload it protects read as different namespaces to a string comparison.
# Neither PDB-01 ("this workload has no rule") nor PDB-09 ("this rule protects
# nothing") may fire: they are mirror images, and both firing on one pair is the
# signature of a broken join rather than two broken rules.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: implicit-namespace-pdb}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: namespaced}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: namespaced, namespace: bad}
spec:
  replicas: 2
  progressDeadlineSeconds: 600
  selector: {matchLabels: {app.kubernetes.io/name: namespaced}}
  template:
    metadata: {labels: {app.kubernetes.io/name: namespaced}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: namespaced
          image: registry.acme.example/bad/app@sha256:7777000077770000777700007777000077770000777700007777000077770000
